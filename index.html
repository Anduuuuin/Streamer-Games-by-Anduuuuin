/* Crash-Diagramm: Icon zeichnen – Profilbild als Kreis, sonst Emoji */
function drawIcon(x, id, emoji, cx, baseY, size) {
  const im = aviImg(id);
  if (!im) { x.font = size + 'px serif'; x.fillText(emoji, cx, baseY); return }
  const r = size / 2, cy = baseY - r + 4;
  x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.closePath(); x.clip();
  x.drawImage(im, cx - r, cy - r, size, size); x.restore();
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.lineWidth = 4; x.strokeStyle = '#000'; x.stroke();
}

/* ===================================================================================
   CRASH – steigende Punktzahl, rechtzeitig aussteigen
   Phasen in state.crash.phase:
   'pick'    → Spiel gestartet, Spieler wählen ihr Icon
   'run'     → Runde läuft (erst Countdown, dann steigt die Punktzahl)
   'crashed' → Runde vorbei, Punkte gutgeschrieben
   'over'    → jemand hat die Zielpunktzahl erreicht
   Der Crash-Punkt kennt nur der Host (crashSecret) – er wird nie verschickt.
   =================================================================================== */

/* ----- Crash – HIER ANPASSEN ----- */
const CRASH_ICONS = ['🚀', '💎', '🍀', '🔥', '⭐', '🎯', '💰', '🦄'];   // Icons zur Auswahl (Anzahl beliebig)
const CRASH_TARGET_DEFAULT = 1000;   // Standard-Zielpunktzahl im Host-Menü
// ===== GESCHWINDIGKEIT – HIER ANPASSEN =====
// Die Punktzahl wächst exponentiell: langsam am Anfang, dann immer schneller.
//   Punkte(t) = CRASH_BASE · (e^(Tempo · t) − 1)        t = Sekunden seit dem Start
// Bei normalem Tempo (0,12):  5 s ≈ 33 · 10 s ≈ 93 · 15 s ≈ 200 · 20 s ≈ 400 · 25 s ≈ 760 Punkte
const CRASH_BASE = 40;               // größer = am Anfang schneller
const CRASH_RATE = 0.12;             // normales Tempo – größer = wird schneller steil
// Jede Runde wird das Tempo zufällig zwischen diesen Faktoren gewählt (1 = normal).
// 0,8 = gemütliche Runde, 1,35 = flotte Runde. Beide Werte gleich = jede Runde gleich schnell.
const CRASH_RATE_VARIATION = [0.8, 1.35];
const CRASH_COUNTDOWN_SEC = 3;       // Countdown vor dem Start
// ===== CRASH-WAHRSCHEINLICHKEIT – HIER ANPASSEN =====
// Der Crash-Punkt wird aus einem dieser Bereiche gezogen. „weight“ = wie oft (relativ zu den anderen),
// innerhalb des Bereichs ist jeder Wert gleich wahrscheinlich. Die Gewichte müssen nicht 100 ergeben.
// Abwechslung: Der erste Bereich (früher Crash) kommt nie zweimal hintereinander,
// und kein Bereich kommt mehr als CRASH_MAX_SAME_IN_A_ROW-mal hintereinander.
const CRASH_RANGES = [
  { min: 10,  max: 50,   weight: 8  },   // früher Crash – selten (8 %)
  { min: 50,  max: 150,  weight: 40 },   // mittel – häufig (40 %)
  { min: 150, max: 300,  weight: 32 },   // mittel-hoch – häufig (32 %)
  { min: 300, max: 600,  weight: 15 },   // hoch – seltener (15 %)
  { min: 600, max: 1500, weight: 5  }    // sehr hoch – selten (5 %)
];
const CRASH_MAX_SAME_IN_A_ROW = 2;

const crashRate = () => (state.crash && state.crash.rate) || CRASH_RATE;   // Tempo der aktuellen Runde (steht im State, damit alle gleich rechnen)
const crashPts = t => t <= 0 ? 0 : Math.floor(CRASH_BASE * (Math.exp(crashRate() * t) - 1));
const crashTimeOf = p => p <= 0 ? 0 : Math.log(p / CRASH_BASE + 1) / crashRate();
const crashName = id => (state.crash && state.crash.names && state.crash.names[id]) || impName(id);
let crashHist = [];                  // nur Host: Bereiche der letzten Runden (für die Abwechslung)
try { crashHist = JSON.parse(ls.get('qs-crash-hist') || '[]') || [] } catch (e) {}
function crashDraw() {
  const rnd01 = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
  const total = CRASH_RANGES.reduce((s, r) => s + r.weight, 0);
  const pick = () => { let x = rnd01() * total; for (let i = 0; i < CRASH_RANGES.length; i++) { if (x < CRASH_RANGES[i].weight) return i; x -= CRASH_RANGES[i].weight } return CRASH_RANGES.length - 1 };
  const last = crashHist.slice(-CRASH_MAX_SAME_IN_A_ROW);
  let i = pick();
  for (let k = 0; k < 50; k++) {
    const earlyAgain = i === 0 && crashHist[crashHist.length - 1] === 0;                     // früher Crash nie zweimal hintereinander
    const sameStreak = last.length >= CRASH_MAX_SAME_IN_A_ROW && last.every(x => x === i);    // nicht zu oft derselbe Bereich
    if (!earlyAgain && !sameStreak) break;
    i = pick();
  }
  crashHist = [...crashHist, i].slice(-10); ls.set('qs-crash-hist', JSON.stringify(crashHist));
  const r = CRASH_RANGES[i];
  return Math.round(r.min + rnd01() * (r.max - r.min));
}
const crashRandRate = () => { const [a, b] = CRASH_RATE_VARIATION, u = crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296; return CRASH_RATE * (a + u * (b - a)) };

/* Einstellungen (Host) */
let crashCfg = { target: CRASH_TARGET_DEFAULT };
try { Object.assign(crashCfg, JSON.parse(ls.get('qs-crashcfg') || '{}')) } catch (e) {}
let crashMsg = '';

/* ----- Zeit: alle rechnen ab demselben Start – Uhr-Unterschied der Geräte wird ausgeglichen ----- */
let crashLocalStart = 0, crashStartId = 0;
function crashSync() {
  const c = state.crash;
  if (!c || !c.startAt) { crashLocalStart = 0; crashStartId = 0; return }
  if (c.startAt === crashStartId) return;
  crashStartId = c.startAt;
  crashLocalStart = ROLE === 'host' ? c.startAt : c.startAt - ((state.sentAt || Date.now()) - Date.now());
}
const crashElapsed = () => crashLocalStart ? (Date.now() - crashLocalStart) / 1000 : 0;
function crashNow() {
  const c = state.crash; if (!c) return 0;
  if (c.crashValue != null && c.phase !== 'run') return c.crashValue;
  return c.phase === 'run' ? crashPts(crashElapsed()) : 0;
}

/* ----- Host: geheimer Crash-Punkt + Crash auslösen ----- */
let crashSecret = null;
try { crashSecret = JSON.parse(ls.get('qs-crash') || 'null') } catch (e) {}
// Hintergrund-Timer (Worker): läuft auch zuverlässig, wenn der Host-Tab im Hintergrund ist
const crashWorker = (() => {
  try { return new Worker(URL.createObjectURL(new Blob(['onmessage=e=>setTimeout(()=>postMessage(e.data),Math.max(0,e.data.ms))'], { type: 'text/javascript' }))) }
  catch (e) { return null }
})();
if (crashWorker) crashWorker.onmessage = () => crashCheck();
function crashSchedule() {
  const c = state.crash;
  if (ROLE !== 'host' || !c || c.phase !== 'run' || !crashSecret || crashSecret.round !== c.round) return;
  const ms = c.startAt + crashTimeOf(crashSecret.at) * 1000 + 5 - Date.now();
  if (crashWorker) crashWorker.postMessage({ ms }); else setTimeout(crashCheck, Math.max(0, ms));
}
function crashCheck() {
  const c = state.crash;
  if (ROLE !== 'host' || !c || c.phase !== 'run' || !crashSecret) return;
  if (crashPts((Date.now() - c.startAt) / 1000) >= crashSecret.at) doCrash();
}
if (ROLE === 'host') setInterval(crashCheck, 250);   // Sicherheitsnetz

function doCrash() {
  const c = state.crash; if (!c || c.phase !== 'run') return;
  c.phase = 'crashed'; c.crashValue = crashSecret.at; c.crashT = crashTimeOf(crashSecret.at);
  const last = {};
  (c.riders || []).forEach(id => {                       // Ausgestiegene bekommen ihre Punkte, alle anderen 0
    const g = c.cashed[id] ? c.cashed[id].pts : 0;
    last[id] = g; c.totals[id] = (c.totals[id] || 0) + g;
  });
  c.last = last;
  const max = Math.max(0, ...Object.values(c.totals));
  if (max >= c.target) { c.phase = 'over'; c.winners = Object.keys(c.totals).filter(id => c.totals[id] === max) }
  push(); render();
}

/* Host: Spieler meldet „Aussteigen“ (verschlüsselt mit seinem Schlüssel) */
async function crashReceiveCash(pl) {
  const c = state.crash;
  if (ROLE !== 'host' || !pl || !c || c.phase !== 'run' || pl.round !== c.round) return;
  const id = cleanId(pl.id);
  if (!(c.riders || []).includes(id) || c.cashed[id]) return;
  crashCheck(); if (c.phase !== 'run') return;
  let o; try { o = await unseal(secrets[+id.slice(1) - 1], pl.box) } catch (e) { return }
  if (!o || o.round !== c.round) return;
  crashCheck(); if (c.phase !== 'run' || c.cashed[id]) return;
  const hostPts = crashPts((Date.now() - c.startAt) / 1000);
  if (hostPts <= 0) return;                               // noch Countdown
  const pts = Math.max(1, Math.min(Math.floor(+o.pts || 0), hostPts, crashSecret.at - 1));   // nie mehr als der Host gerade sieht
  c.cashed[id] = { pts, t: crashTimeOf(pts) };
  push(); render();
}
/* Host: Spieler wählt ein Icon (jedes Icon nur einmal) */
function crashReceiveIcon(pl) {
  const c = state.crash;
  if (ROLE !== 'host' || !pl || !c || c.phase !== 'pick') return;   // Icons nur einmal, vor Runde 1
  const id = cleanId(pl.id), icon = pl.icon;
  if (!/^p\d+$/.test(id) || !CRASH_ICONS.includes(icon)) return;
  if (Object.entries(c.icons).some(([k, v]) => v === icon && k !== id)) return;
  c.icons[id] = icon; push(); render();
}

/* ----- Spieler: Aussteigen ----- */
let crashPending = 0;
async function crashCashOut() {
  const c = state.crash;
  if (!me || !c || c.phase !== 'run' || !(c.riders || []).includes(me.id) || c.cashed[me.id] || crashPending === c.round) return;
  const pts = crashNow(); if (pts <= 0) return;
  crashPending = c.round; render();
  try {
    const box = await seal(me.secret, { round: c.round, pts });
    if (ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'cashout', payload: { id: me.id, round: c.round, box } });
  } catch (e) {}
}

/* ----- Diagramm (Canvas) – Aussehen HIER ANPASSEN ----- */
const CRASH_CHART = {
  line: '#ffe600', lineCrash: '#ff2d55', grid: 'rgba(255,43,214,.25)', label: '#b9a8e8', cashed: '#39ff14',
  iconSize: 46, font: '"Press Start 2P", monospace'
};
function niceStep(r) { const p = Math.pow(10, Math.floor(Math.log10(r || 1))); return [1, 2, 5, 10].map(m => m * p).find(s => s >= r) || p * 10 }
function drawCrashChart(cv) {
  const c = state.crash, x = cv.getContext && cv.getContext('2d');
  if (!c || !x) return;
  if (cv.dataset && cv.dataset.fit && cv.clientWidth && cv.clientHeight && (cv.width !== cv.clientWidth || cv.height !== cv.clientHeight)) {
    cv.width = cv.clientWidth; cv.height = cv.clientHeight;   // Zeichenfläche = Kastengröße → nichts verzerrt
  }
  const W = cv.width, H = cv.height, L = 100, R = 40, T = 70, B = 40;
  const crashed = c.phase !== 'run' && c.crashValue != null;
  const el = crashed ? c.crashT : Math.max(0, crashElapsed());
  const cur = crashed ? c.crashValue : crashNow();
  const cashedPts = Object.values(c.cashed || {}).map(v => v.pts);
  const ymax = Math.max(100, cur * 1.25, ...cashedPts.map(p => p * 1.15));
  const xmax = Math.max(15, el * 1.12);   // Diagramm zeigt anfangs 15 Sekunden
  const X = t => L + (W - L - R) * t / xmax, Y = p => H - B - (H - T - B) * p / ymax;
  x.clearRect(0, 0, W, H);
  // Gitter + Beschriftung
  x.lineWidth = 2; x.strokeStyle = CRASH_CHART.grid; x.fillStyle = CRASH_CHART.label; x.font = '16px ' + CRASH_CHART.font; x.textAlign = 'right';
  const step = niceStep(ymax / 5);
  for (let v = 0; v <= ymax; v += step) { x.beginPath(); x.moveTo(L, Y(v)); x.lineTo(W - R, Y(v)); x.stroke(); x.fillText(String(v), L - 14, Y(v) + 6) }
  // Kurve
  if (el > 0) {
    x.beginPath();
    for (let i = 0; i <= 90; i++) { const t = el * i / 90, px = X(t), py = Y(crashPts(t)); i ? x.lineTo(px, py) : x.moveTo(px, py) }
    x.strokeStyle = crashed ? CRASH_CHART.lineCrash : CRASH_CHART.line; x.lineWidth = 8;
    x.shadowColor = x.strokeStyle; x.shadowBlur = 18; x.stroke(); x.shadowBlur = 0;
  }
  // Icons: Ausgestiegene bleiben auf ihrer Höhe stehen, alle anderen fahren an der Spitze mit
  x.textAlign = 'center';
  let k = 0;
  (c.riders || []).forEach(id => {
    const icon = c.icons[id] || '❔', cs = c.cashed && c.cashed[id];
    if (cs) {
      const px = X(cs.t), py = Y(cs.pts);
      drawIcon(x, id, icon, px, py - 12, CRASH_CHART.iconSize);          // Profilbild oder Emoji
      x.font = '15px ' + CRASH_CHART.font; x.fillStyle = CRASH_CHART.cashed; x.fillText(String(cs.pts), px, py - CRASH_CHART.iconSize - 18);
    } else {
      if (crashed) { x.font = CRASH_CHART.iconSize + 'px serif'; x.fillText('💥', X(el) - k * (CRASH_CHART.iconSize + 6), Y(cur) - 12) }
      else drawIcon(x, id, icon, X(el) - k * (CRASH_CHART.iconSize + 6), Y(cur) - 12, CRASH_CHART.iconSize);
      k++;
    }
  });
}

/* Läuft dauerhaft: Punktzahl-Text + Diagramme aktualisieren */
const crashRaf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : f => setTimeout(f, 50);
(function crashLoop() {
  const c = state.crash;
  if (state.activeGame === 'crash' && c) {
    const el = crashElapsed();
    const txt = c.phase === 'run' ? (el < 0 ? 'START IN ' + Math.ceil(-el) : String(crashNow()))
              : c.crashValue != null ? 'CRASH BEI ' + c.crashValue : '0';
    document.querySelectorAll('.crash-score').forEach(e => {
      if (e.textContent !== txt) e.textContent = txt;
      e.classList && e.classList.toggle('boom', c.phase !== 'run' && c.crashValue != null);
    });
    document.querySelectorAll('canvas.crash-canvas').forEach(drawCrashChart);
  }
  crashRaf(crashLoop);
})();

/* ----- Bausteine ----- */
function crashIds() {

  return [...new Set([...Object.keys(c.icons || {}), ...(c.riders || []), ...Object.keys(c.totals || {}),

}
function crashTotals(big) {

// Overlay-Diagramm (cls 'ov') passt seine Zeichenfläche an die Kastengröße an (data-fit)
const crashChart = cls => `<div class="crash-chart ${cls || ''}"><div class="crash-score">0</div><canvas class="crash-canvas" width="1200" height="560" ${cls === 'ov' ? 'data-fit="1"' : ''}></canvas></div>`;

/* ----- Crash-Spieleransicht nach Skizze – Bausteine (Aussehen HIER ANPASSEN) ----- */

  }
  if (c.phase === 'pick') return `${avatarCard(true)}${picker}<p class="mu">${aviOf(me.id) ? 'Im Spiel wird dein Profilbild benutzt – das Emoji ist nur Ersatz. ' : ''}Der Quizmaster startet gleich die erste Runde.</p>`;

    <div class="icons">${CRASH_ICONS.map(ic => {
      const owner = Object.keys(c.icons).find(k => c.icons[k] === ic), taken = owner && owner !== me.id;
      return `<button class="icon ${owner === me.id ? 'on' : ''}" ${taken ? 'disabled' : ''} onclick="A.pickIcon('${ic}')"><span>${ic}</span><em>${taken ? esc(crashName(owner)) : owner === me.id ? 'DU' : ''}</em></button>`;
    }).join('')}</div></div>` : '';
  let action = '';
  if (c.phase === 'run') {
    action = !rider ? `<div class="crash-btn wait">Du fährst diese Runde nicht mit</div>`
      : cs ? `<div class="crash-btn safe">✓ GESICHERT: ${cs.pts}</div>`
      : crashPending ? `<div class="crash-btn wait">Wird gesichert …</div>`
      : `<button class="crash-btn go" onclick="A.cashOut()">${iconHtml(me.id, mine)} AUSSTEIGEN</button>`;
  }
  if (c.phase === 'crashed' && rider) {
    const g = (c.last || {})[me.id] || 0;
    action = g ? `<div class="crash-btn safe">✓ +${g} PUNKTE GESICHERT</div>` : `<div class="crash-btn boom">💥 CRASH – 0 PUNKTE</div>`;
  }
  const chart = c.phase === 'pick' ? '' : crashChart();
  return `<div class="card crash-card">${head}${chart}${action}${picker}
    ${c.phase === 'pick' ? '<p class="mu">Der Quizmaster startet gleich die erste Runde.</p>' : ''}
    <div class="crash-tot"><small>PUNKTESTAND</small>${crashTotals(false)}</div></div>`;
}

/* ----- Host-Ansicht ----- */
function crashHostCard() {
  const c = state.crash;
  if (!c) return `<div class="card crash-card"><h3>Crash · Einstellungen</h3>
    ${crashMsg ? `<div class="warn">${esc(crashMsg)}</div>` : ''}
    <div class="setup"><label><span>Zielpunktzahl</span><small>wer sie zuerst erreicht, gewinnt</small>
      <input class="input" type="number" min="50" max="100000" step="50" value="${crashCfg.target}" onchange="A.crashCfg(this.value)"></label></div>
    <div class="row"><button class="btn pk big" onclick="A.crashNewGame()">▶ Spiel starten</button></div></div>`;
  const rows = crashIds().map(id => {
    const rider = (c.riders || []).includes(id), cs = c.cashed[id];
    let st = c.icons[id] ? 'Icon gewählt' : 'wählt noch …';
    if (c.phase === 'run' && rider) st = cs ? `✓ ausgestiegen bei ${cs.pts}` : 'fährt …';
    if ((c.phase === 'crashed' || c.phase === 'over') && rider) st = (c.last || {})[id] ? `✓ +${c.last[id]}` : '💥 0';
    return `<div class="crow ${cs ? 'safe' : ''} ${c.phase !== 'run' && rider && !(c.last || {})[id] && c.crashValue != null ? 'lost' : ''}">
      <i>${iconHtml(id, c.icons[id] || '·')}</i><b>${esc(crashName(id))}</b><span>${st}</span><em>${c.totals[id] || 0}</em></div>`;
  }).join('');
  let ctl = '';
  if (c.phase === 'pick') ctl = `<button class="btn pk big" onclick="A.crashStart()">▶ Runde 1 starten</button>`;
  if (c.phase === 'crashed') ctl = `<button class="btn pk big" onclick="A.crashStart()">▶ Runde ${c.round + 1} starten</button>`;
  if (c.phase === 'over') ctl = `<button class="btn pk big" onclick="A.crashEnd()">Neues Spiel</button>`;
  return `<div class="card crash-card"><h3>Crash · Ziel ${c.target}${c.round ? ' · Runde ' + c.round : ''}</h3>
    ${crashMsg ? `<div class="warn">${esc(crashMsg)}</div>` : ''}
    ${c.phase === 'over' ? `<div class="crash-win"><small>GEWONNEN HAT</small><b>${esc((c.winners || []).map(crashName).join(' & '))}</b></div>` : ''}
    ${c.phase === 'pick' ? '<p class="mu">Die Spieler wählen jetzt ihre Icons. Wer beim Start noch keins hat, bekommt ein freies.</p>' : crashChart('host')}
    <div class="crows">${rows || '<p class="mu">Noch keine Spieler verbunden.</p>'}</div>
    <div class="row" style="margin-top:14px">${ctl}${c.phase !== 'over' ? `<button class="btn" onclick="A.crashEnd()">Spiel beenden</button>` : ''}</div>
    <p class="mu">Der Crash-Punkt ist geheim – auch für dich, damit er nicht im Stream landet.</p>
  </div>`;
}

/* ----- Overlay ----- */
OVERLAY_GAMES.crash = {
  game: () => {
    const c = state.crash;
    const head = `<div class="o-head o-target"><b>CRASH</b>${c ? `<span><small>ZIELPUNKTZAHL</small> ${c.target}</span>${c.round ? `<span><small>RUNDE</small> ${c.round}</span>` : ''}` : ''}</div>`;
    if (!c) return head + `<div class="o-panel o-center"><div class="o-big">Gleich geht’s los …</div></div>`;
    if (c.phase === 'over') return head + `<div class="o-panel o-center"><small>GEWONNEN HAT</small><div class="o-big o-win">${(c.winners || []).map(id => iconHtml(id, c.icons[id]) + ' ' + esc(crashName(id))).join(' &amp; ')}</div></div>`;
    if (c.phase === 'pick') return head + `<div class="o-panel o-center"><div class="o-big">Wählt eure Icons!</div>
      <div class="o-icons">${CRASH_ICONS.map(ic => { const o = Object.keys(c.icons).find(k => c.icons[k] === ic); return `<div class="${o ? 'on' : ''}"><span>${o && aviOf(o) ? iconHtml(o) : ic}</span><em>${o ? esc(crashName(o)) : ''}</em></div>` }).join('')}</div></div>`;
    return head + `<div class="o-panel o-crash">${crashChart('ov')}</div>`;
  },
  side: () => state.crash ? `<div class="o-scores"><div class="vsh"><small>PUNKTE</small><small>ZIEL ${state.crash.target}</small></div>${crashTotals(false)}</div>` : ''
};

  if (!list.length) return '';
  let i = o.indexOf(from);
  for (let k = 1; k <= o.length; k++) { const id = o[(i + k + o.length) % o.length]; if (list.includes(id)) return id }
  return list[0];
}
/* Leben-Anzeige (Herzen) – HIER ANPASSEN */
function dummHearts(id) {
  if (state.activeGame !== 'dumm' || !dummIn(id)) return '';
  const n = Math.max(0, D().lives[id]), max = D().maxLives || DUMM_LIVES;
  return `<span class="lives ${n ? '' : 'zero'}">${DUMM_HEART.repeat(n)}${DUMM_HEART_EMPTY.repeat(Math.max(0, max - n))}</span>`;
}
/* RAUS-Overlay + Profilbild an einer Kamera-Kachel (Spieler-Ansicht und Overlay) */
function dummDecorate(t, frameSel, pid) {
  const fr = t.querySelector(frameSel); if (!fr) return;
  const out = dummOut(pid);
  t.classList.toggle('out', out);                       // raus → Kamera grau (CSS „RAUS-Stempel“)
  let r = fr.querySelector('.raus');
  if (out && !r) { r = document.createElement('div'); r.className = 'raus'; r.innerHTML = '<span>' + esc(DUMM_OUT_TEXT) + '</span>'; fr.appendChild(r) }   // Stempel – Animation läuft beim Erscheinen
  if (!out && r) r.remove();
  // Abzeichen oben rechts in der Kachel: Herzen (Hauptrunde) bzw. richtige Antworten (Finale) – HIER ANPASSEN
  const fin = dummFinalOn() && D().finalists.includes(pid);
  t.classList.toggle('fin', fin);
  const bh = state.activeGame !== 'dumm' || !dummIn(pid) || out ? '' : fin ? `<b>${D().fs[pid] || 0}</b><small>RICHTIG</small>` : dummHearts(pid);
  let lv = fr.querySelector('.vlives');
  if (bh && !lv) { lv = document.createElement('div'); lv.className = 'vlives'; fr.appendChild(lv) }
  if (!bh && lv) { lv.remove(); lv = null }
  if (lv && lv._h !== bh) { lv.innerHTML = bh; lv._h = bh }
}

/* ----- Fragen ziehen (Host) ----- */
function dummDraw(estimate) {
  const db = estimate ? DUMM_ESTIMATES : DUMM_QUESTIONS, key = estimate ? 'estUsed' : 'used';
  let free = db.map((_, i) => i).filter(i => !dummHost[key].includes(i));
  if (!free.length) { dummHost[key] = []; free = db.map((_, i) => i) }
  const i = free[rint(free.length)]; dummHost[key].push(i);
  return { text: db[i].q, answer: db[i].a, cat: db[i].cat || '', flag: db[i].flag || '' };
}
function dummAsk(q, estimate) {      // Frage stellen: Text geht an alle, Antwort bleibt beim Host
  const d = D(); d.qNo = (d.qNo || 0) + 1;
  d.q = { text: q.text, cat: q.cat || '', flag: cleanFlag(q.flag), type: estimate ? 'estimate' : 'normal', no: d.qNo };
  dummHost.ans = { no: d.qNo, answer: q.answer }; dummSave();
}

/* ----- Abstimmung ----- */
async function dummReceiveVote(pl) {
  const d = D();
  if (ROLE !== 'host' || !pl || !d || d.phase !== 'vote' || pl.voteNo !== d.voteNo) return;
  const id = cleanId(pl.id);
  if (!(d.lives[id] > 0)) return;                               // nur aktive Spieler stimmen ab
  if (timerEnd && Date.now() > timerEnd + 2000) return;        // zu spät
  try {
    const o = await unseal(secrets[+id.slice(1) - 1], pl.box);
    if (o.voteNo !== d.voteNo || !d.cands.includes(o.target) || o.target === id) return;
    dummHost.votes[id] = o.target; dummSave();
    d.voted = Object.keys(dummHost.votes).length;             // nur die Anzahl geht raus
    push(); render();
  } catch (e) {}
}
function dummTally() {
  const t = {}; D().cands.forEach(id => t[id] = 0);
  Object.values(dummHost.votes).forEach(id => { if (id in t) t[id]++ });
  return t;
}
/* Schätzfrage im Finale */
async function dummReceiveEst(pl) {
  const d = D();
  if (ROLE !== 'host' || !pl || !d || d.phase !== 'estimate' || pl.qNo !== d.q.no) return;
  const id = cleanId(pl.id);
  if (!(d.finalists || []).includes(id)) return;
  try {
    const o = await unseal(secrets[+id.slice(1) - 1], pl.box);
    const v = Number(o.value);
    if (o.qNo !== d.q.no || !isFinite(v)) return;
    dummHost.est[id] = v; dummSave();
    d.estCount = Object.keys(dummHost.est).length; push(); render();
  } catch (e) {}
}

/* ----- Finale: Sieger prüfen (gleich viele Fragen = faire Chance) ----- */
function dummFinalCheck() {
  const d = D(), [a, b] = d.finalists, T = DUMM_FINAL_WINS;
  const sa = d.fs[a], sb = d.fs[b], qa = d.fq[a], qb = d.fq[b];
  if (qa === qb) {
    if (sa >= T && sb >= T) return 'estimate';
    if (sa >= T) return a;
    if (sb >= T) return b;
    return '';
  }
  const lead = qa > qb ? a : b, lag = lead === a ? b : a;
  if (d.fs[lead] >= T && d.fs[lag] + 1 < T) return lead;     // der andere kann nicht mehr gleichziehen
  return '';
}
function dummStartEstimate() {
  const d = D(); d.phase = 'estimate'; d.est = null; d.estCount = 0; dummHost.est = {};
  dummAsk(dummDraw(true), true); state.timer = null;
}
function dummWin(id) {
  const d = D(); d.phase = 'over'; d.winner = id; d.q = d.phase === 'over' && d.q && d.q.type === 'estimate' ? d.q : null;
  if (dummHost.ans && d.q) d.est = { answer: dummHost.ans.answer, guesses: { ...dummHost.est } };   // Auflösung erst am Ende
  state.timer = null;
}

/* ----- Host-Aktionen ----- */
const DA = {
  cfg(k, v) {
    const lim = { lives: [1, 9], roundSec: [15, 900], voteSec: [10, 600] }[k];
    dummCfg[k] = Math.max(lim[0], Math.min(lim[1], Math.round(+v) || lim[0]));
    ls.set('qs-dummcfg', JSON.stringify(dummCfg)); render();
  },
  start() {
    const ids = (state.players || []).filter(p => /^p\d+$/.test(p.id)).sort((a, b) => (a.slot || 99) - (b.slot || 99)).map(p => p.id);
    if (ids.length < 3) { dummMsg = 'Mindestens 3 Spieler nötig – gerade ' + ids.length + ' verbunden.'; render(); return }
    const lives = {}, status = {}, names = {}, stats = {}, slots = {};
    (state.players || []).forEach(p => slots[p.id] = p.slot);
    ids.forEach(id => { lives[id] = dummCfg.lives; status[id] = 'active'; names[id] = impName(id); stats[id] = { r: 0, w: 0 } });
    state.dumm = { phase: 'ready', round: 0, maxLives: dummCfg.lives, roundSec: dummCfg.roundSec, voteSec: dummCfg.voteSec,
      lives, status, names, slots, order: ids, stats, turn: '', q: null, qNo: 0, voteNo: 0, cands: [], voted: 0,
      tally: null, tie: null, loser: null, lastStart: null, lastHit: null, finalists: null, fs: {}, fq: {}, winner: null, est: null };
    dummHost = { ans: null, votes: {}, est: {}, used: [], estUsed: [] }; dummSave();
    dummMsg = ''; state.timer = null; push(); render();
  },
  round() {
    const d = D(); if (!d || (d.phase !== 'ready' && d.phase !== 'result')) return;
    d.round++; d.phase = 'round'; d.tally = d.tie = d.loser = null;
    Object.keys(d.stats).forEach(id => d.stats[id] = { r: 0, w: 0 });
    d.turn = d.lastStart ? dummNext(d.lastStart) : dummActive()[rint(dummActive().length)];   // Startspieler wechselt
    d.lastStart = d.turn;
    dummAsk(dummDraw(false)); state.timer = newTimer(d.roundSec); push(); render();
  },
  mark(ok) {                                            // richtig / falsch → nächster Spieler, neue Frage
    const d = D(); if (!d || !d.turn || (d.phase !== 'round' && d.phase !== 'final')) return;
    if (d.phase === 'round') { d.stats[d.turn][ok ? 'r' : 'w']++; d.turn = dummNext(d.turn); dummAsk(dummDraw(false)) }
    else {
      d.fq[d.turn]++; if (ok) d.fs[d.turn]++;
      const res = dummFinalCheck();
      if (res === 'estimate') dummStartEstimate();
      else if (res) dummWin(res);
      else { d.turn = dummNext(d.turn, d.finalists); dummAsk(dummDraw(false)) }
    }
    push(); render();
  },
  skip() { const d = D(); if (!d || !d.q) return; dummAsk(dummDraw(d.q.type === 'estimate'), d.q.type === 'estimate'); if (d.phase === 'estimate') { dummHost.est = {}; d.estCount = 0 } push(); render() },
  manual() {
    const d = D(); if (!d) return;
    const tx = ((document.getElementById('dq-text') || {}).value || '').trim(), an = ((document.getElementById('dq-ans') || {}).value || '').trim();
    if (!tx) return;
    const est = d.phase === 'estimate';
    if (est && !isFinite(Number(an.replace(',', '.')))) { dummMsg = 'Bei Schätzfragen muss die Antwort eine Zahl sein.'; render(); return }
    dummMsg = ''; dummAsk({ text: tx.slice(0, 200), answer: est ? Number(an.replace(',', '.')) : an.slice(0, 100) }, est);
    if (est) { dummHost.est = {}; d.estCount = 0 }
    push(); render();
  },
  vote(only) {                                          // Abstimmung starten (only = nur zwischen den Gleichstand-Spielern)
    const d = D(); if (!d || (d.phase !== 'round' && d.phase !== 'result')) return;
    d.phase = 'vote'; d.voteNo++; d.cands = only && d.tie ? [...d.tie] : dummActive();
    d.voted = 0; d.tally = d.tie = d.loser = null; dummHost.votes = {}; dummSave();
    d.q = null; state.timer = newTimer(d.voteSec); push(); render();
  },
  close() {                                             // Abstimmung beenden & auswerten
    const d = D(); if (!d || d.phase !== 'vote') return;
    const t = dummTally(), max = Math.max(0, ...Object.values(t)), top = Object.keys(t).filter(id => t[id] === max);
    d.tally = t; d.phase = 'result'; state.timer = null;
    if (max > 0 && top.length === 1) { d.loser = top[0]; d.tie = null } else { d.loser = null; d.tie = top }
    push(); render();
  },
  hit(id) {                                             // Ergebnis bestätigen: Spieler verliert 1 Leben
    const d = D(); if (!d || d.phase !== 'result' || !(d.lives[id] > 0)) return;
    d.lives[id]--; d.lastHit = id;
    if (d.lives[id] <= 0) d.status[id] = 'eliminated';
    const act = dummActive();
    if (act.length <= 1) dummWin(act[0] || id);
    else if (act.length === 2) {                         // Finale
      d.phase = 'final'; d.finalists = act; d.fs = { [act[0]]: 0, [act[1]]: 0 }; d.fq = { [act[0]]: 0, [act[1]]: 0 };
      d.tally = d.tie = d.loser = null; d.turn = act[rint(2)]; dummAsk(dummDraw(false)); state.timer = null;
    } else { d.phase = 'ready'; d.q = null; d.turn = '' }
    push(); render();
  },
  life(id, delta) {                                     // Leben manuell korrigieren
    const d = D(); if (!d || !dummIn(id) || d.phase === 'final' || d.phase === 'estimate' || d.phase === 'over') return;
    d.lives[id] = Math.max(0, Math.min(d.maxLives, d.lives[id] + delta));
    d.status[id] = d.lives[id] > 0 ? 'active' : 'eliminated';
    push(); render();
  },
  estimate() { const d = D(); if (!d || d.phase !== 'final') return; dummStartEstimate(); push(); render() },
  win(id) { const d = D(); if (!d || d.phase !== 'estimate' || !(d.finalists || []).includes(id)) return; dummWin(id); push(); render() },
  end() {
    if (D() && D().phase !== 'over' && !confirm('„Der Dümmste fliegt“ beenden? Der Spielstand geht verloren.')) return;
    state.dumm = null; state.timer = null; dummHost = { ans: null, votes: {}, est: {}, used: [], estUsed: [] }; dummSave(); dummMsg = ''; push(); render();
  },
  // Spieler
  async sendVote(target) {
    const d = D(); if (!me || !d || d.phase !== 'vote' || !(d.lives[me.id] > 0) || target === me.id || !d.cands.includes(target) || !timerRunning()) return;
    myDummVote = target; myDummVoteNo = d.voteNo; render();
    try { const box = await seal(me.secret, { target, voteNo: d.voteNo }); if (ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'dvote', payload: { id: me.id, voteNo: d.voteNo, box } }) } catch (e) {}
  },
  async sendEst() {
    const d = D(); if (!me || !d || d.phase !== 'estimate' || !(d.finalists || []).includes(me.id)) return;
    const v = Number(String((document.getElementById('dest') || {}).value || '').replace(',', '.'));
    if (!isFinite(v) || String((document.getElementById('dest') || {}).value || '').trim() === '') return;
    myDummEst = d.q.no + ':' + v; render();
    try { const box = await seal(me.secret, { value: v, qNo: d.q.no }); if (ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'dest', payload: { id: me.id, qNo: d.q.no, box } }) } catch (e) {}
  }
};

/* ----- Bausteine ----- */
// Leben-Tafel (unter der Quizmaster-Kamera bzw. im Overlay)
function dummBoard() {
  const d = D(); if (!d) return '';
  return `<div class="vsh"><small>LEBEN</small><small>${d.phase === 'final' || d.phase === 'estimate' ? 'FINALE' : 'RUNDE ' + Math.max(1, d.round)}</small></div>` +
    d.order.map(id => `<div class="vsr dl ${d.lives[id] > 0 ? '' : 'out'} ${me && id === me.id ? 'me' : ''}"><b>${iconHtml(id, '')} ${esc(dummName(id))}</b><span>${d.lives[id] > 0 ? dummHearts(id) : 'RAUS'}</span></div>`).join('');
}
const dummHead = () => { const d = D(); return `<div class="dhead"><b>DER DÜMMSTE FLIEGT</b><span>${{ ready: 'BEREIT', round: 'RUNDE ' + d.round, vote: 'ABSTIMMUNG', result: 'ERGEBNIS', final: 'FINALE', estimate: 'SCHÄTZFRAGE', over: 'SIEGER' }[d.phase]}</span></div>` };
function dummFinalScore() {
  const d = D(), [a, b] = d.finalists;
  return `<div class="dfinal"><div class="${d.turn === a ? 'on' : ''}">${iconHtml(a, '')}<b>${esc(dummName(a))}</b><em>${d.fs[a]}</em></div><i>:</i><div class="${d.turn === b ? 'on' : ''}"><em>${d.fs[b]}</em><b>${esc(dummName(b))}</b>${iconHtml(b, '')}</div></div><small class="dsub">Wer zuerst ${DUMM_FINAL_WINS} richtige hat, gewinnt</small>`;
}

/* ----- Spieler-Ansicht (großer Infokasten) – Aussehen HIER ANPASSEN ----- */
function dummPanel() {
  const d = D(), mine = me && dummIn(me.id) ? d.lives[me.id] : null, out = mine === 0;
  if (myDummVoteNo !== d.voteNo) { myDummVote = ''; myDummVoteNo = d.voteNo }
  let main = '';
  const qBox = (who) => d.q ? `<div class="dq ${d.q.flag ? 'hasflag' : ''}"><small>${who}${d.q.cat ? ' · ' + esc(d.q.cat).toUpperCase() : ''}</small>${flagImg(d.q.flag, 'big')}<b>${esc(d.q.text)}</b></div>` : '';
  if (d.phase === 'ready') main = `<div class="dmsg">${d.round ? 'Gleich startet die nächste Runde …' : 'Gleich geht’s los …'}</div>`;
  if (d.phase === 'round') main = qBox(me && d.turn === me.id ? 'DU BIST DRAN!' : 'FRAGE AN ' + esc(dummName(d.turn)).toUpperCase());
  if (d.phase === 'vote') {
    if (out || mine === null) main = `<div class="dmsg">Abstimmung läuft – ${out ? 'du bist raus und stimmst nicht mit ab' : 'du schaust zu'}.</div>`;
    else if (!timerRunning()) main = `<div class="dmsg">${myDummVote ? 'Deine Stimme: ' + esc(dummName(myDummVote)) + '. ' : 'Keine Stimme abgegeben. '}Zeit um – der Quizmaster wertet aus …</div>`;
    else main = `<div class="dq"><small>WER VERLIERT EIN LEBEN?</small><div class="vbtns">${d.cands.filter(id => id !== me.id).map(id =>
      `<button class="btn ${myDummVote === id ? 'ok' : ''}" onclick="DA.sendVote('${esc(id)}')">${iconHtml(id, '')} ${esc(dummName(id))}</button>`).join('')}</div>
      ${myDummVote ? `<span class="mu">Abgestimmt für ${esc(dummName(myDummVote))} – du kannst bis Zeitende ändern.</span>` : ''}</div>`;
  }
  if (d.phase === 'result') {
    const t = d.tally || {}, list = Object.keys(t).sort((a, b) => t[b] - t[a]);
    main = `<div class="dq"><small>ERGEBNIS</small><b>${d.loser ? esc(dummName(d.loser)) + ' verliert ein Leben' : 'Gleichstand – der Quizmaster entscheidet'}</b>
      <div class="dtally">${list.map(id => `<span>${esc(dummName(id))}: ${t[id]}</span>`).join('')}</div></div>`;
  }
  if (d.phase === 'final') main = dummFinalScore() + qBox(me && d.turn === me.id ? 'DU BIST DRAN!' : 'FRAGE AN ' + esc(dummName(d.turn)).toUpperCase());
  if (d.phase === 'estimate') {
    const fin = me && (d.finalists || []).includes(me.id), sent = myDummEst.startsWith(d.q.no + ':');
    main = dummFinalScore() + qBox('SCHÄTZFRAGE') + (fin ? `<div class="row"><input class="input vin" id="dest" inputmode="decimal" placeholder="Deine Schätzung" onkeydown="if(event.key==='Enter')DA.sendEst()"><button class="btn y" onclick="DA.sendEst()">Absenden</button></div>${sent ? `<span class="mu">Abgegeben: ${esc(myDummEst.split(':')[1])} – du kannst noch ändern.</span>` : ''}` : '<div class="dmsg">Die beiden Finalisten schätzen …</div>');
  }
  if (d.phase === 'over') main = `<div class="crash-win"><small>GEWONNEN HAT</small><b>${iconHtml(d.winner, '')} ${esc(dummName(d.winner))}</b></div>` +
    (d.est ? `<div class="dtally"><span>Richtig: ${esc(d.est.answer)}</span>${Object.entries(d.est.guesses).map(([id, v]) => `<span>${esc(dummName(id))}: ${esc(v)}</span>`).join('')}</div>` : '');
  const status = mine === null ? '<span class="dst">DU SCHAUST ZU</span>' : out ? '<span class="dst out">DU BIST RAUS</span>' : `<span class="dst">DEINE LEBEN ${dummHearts(me.id)}</span>`;
  return `${dummHead()}<div class="dme">${status}</div>${main}`;
}

/* ----- Host-Ansicht ----- */
function dummHostCard() {

  if (!d) return `<div class="card dumm-card"><h3>Der Dümmste fliegt · Einstellungen</h3>

      <div class="row"><button class="btn pk big" onclick="DA.close()">Abstimmung beenden &amp; auswerten</button></div>`;
  if (d.phase === 'result') {

    ctl = `<div class="turnbox"><span class="mu">ERGEBNIS</span><b>${d.loser ? esc(dummName(d.loser)) + ' hat die meisten Stimmen' : 'GLEICHSTAND'}</b></div>
      <div class="dtally">${list.map(id => `<span>${esc(dummName(id))}: ${t[id]}</span>`).join('')}</div>
      <div class="row">${d.loser ? `<button class="btn pk big" onclick="DA.hit('${d.loser}')">Bestätigen – ${esc(dummName(d.loser))} verliert 1 Leben</button>` : ''}
        ${(d.tie || []).map(id => `<button class="btn pk" onclick="DA.hit('${id}')">${esc(dummName(id))} verliert 1 Leben</button>`).join('')}
        ${d.tie && d.tie.length > 1 ? `<button class="btn y" onclick="DA.vote(true)">Neu abstimmen (nur zwischen ${d.tie.map(dummName).map(esc).join(' &amp; ')})</button>` : ''}</div>
      ${d.loser ? `<details class="dman"><summary class="mu">Anders entscheiden</summary><div class="row">${dummActive().filter(id => id !== d.loser).map(id => `<button class="btn sm" onclick="DA.hit('${id}')">${esc(dummName(id))}</button>`).join('')}</div></details>` : ''}`;
  }
  if (d.phase === 'final') ctl = `${dummFinalScore()}${qPanel}<div class="row"><button class="btn ok big" onclick="DA.mark(true)">✓ Richtig</button><button class="btn big" onclick="DA.mark(false)">✗ Falsch</button><button class="btn sm" onclick="DA.skip()">Andere Frage</button></div>${manual}
      <div class="row" style="margin-top:12px"><button class="btn y" onclick="DA.estimate()">Schätzfrage jetzt</button></div>`;
  if (d.phase === 'estimate') {
    const a = dummHost.ans ? Number(dummHost.ans.answer) : NaN, g = dummHost.est;
    const best = d.finalists.filter(id => id in g).sort((x, y) => Math.abs(g[x] - a) - Math.abs(g[y] - a))[0];
    ctl = `${dummFinalScore()}${qPanel}
      <div class="answers">${d.finalists.map(id => `<div class="arow ${id === best ? 'right' : ''}"><b>${esc(dummName(id))}</b><i>SCHÄTZT</i><span>${id in g ? esc(g[id]) : '— noch nichts —'}</span><em>${id in g && isFinite(a) ? 'Δ ' + Math.abs(g[id] - a) : ''}</em></div>`).join('')}</div>
      <div class="row">${d.finalists.map(id => `<button class="btn pk big" onclick="DA.win('${id}')">${esc(dummName(id))} gewinnt</button>`).join('')}<button class="btn sm" onclick="DA.skip()">Andere Schätzfrage</button></div>${manual}`;
  }
  if (d.phase === 'over') ctl = `<div class="crash-win"><small>GEWONNEN HAT</small><b>${iconHtml(d.winner, '')} ${esc(dummName(d.winner))}</b></div><div class="row"><button class="btn pk big" onclick="DA.end()">Neues Spiel</button></div>`;
  const rows = d.order.map(id => {
    const s = d.stats[id] || { r: 0, w: 0 }, out = !(d.lives[id] > 0);
    const vf = Object.values(dummHost.votes).filter(t => t === id).length;
    return `<div class="crow ${out ? 'lost' : ''} ${d.turn === id && (d.phase === 'round' || d.phase === 'final') ? 'safe' : ''}"><i>${iconHtml(id, '·')}</i><b>${esc(dummName(id))}</b>
      <span>${out ? 'RAUS' : dummHearts(id)}${d.phase === 'round' ? ` · ✓${s.r} ✗${s.w}` : ''}${d.phase === 'vote' && vf ? ` · ${vf} Stimme${vf > 1 ? 'n' : ''}` : ''}</span>
      <em>${d.phase === 'final' || d.phase === 'estimate' || d.phase === 'over' ? '' : `<button class="btn sm" onclick="DA.life('${id}',-1)">−</button><button class="btn sm" onclick="DA.life('${id}',1)">+</button>`}</em></div>`;
  }).join('');
  return `<div class="card dumm-card"><h3>Der Dümmste fliegt · ${dummHead().match(/<span>(.*?)<\/span>/)[1]}</h3>
    ${dummMsg ? `<div class="warn">${esc(dummMsg)}</div>` : ''}${ctl}
    <div class="crows dcrows">${rows}</div>
    ${d.phase !== 'over' ? `<div class="row" style="margin-top:14px"><button class="btn" onclick="DA.end()">Spiel beenden</button></div>` : ''}
    <p class="mu">Antworten und wer wen gewählt hat, siehst nur du.</p></div>`;
}

/* ----- Overlay ----- */
OVERLAY_GAMES.dumm = {
  // 'main' = Hauptrunde (Quizmaster + Spieler-Kameras, Leiste unten) · 'final' = Finale (Fragekasten oben, 2 große Kameras)
  sub: () => dummFinalOn() ? 'final' : 'main',
  game: () => {
    const d = D();
    if (!d) return `<div class="o-dbar"><div class="o-dtxt"><small>DER DÜMMSTE FLIEGT</small><b>Gleich geht’s los …</b></div></div>`;
    const phase = dummHead().match(/<span>(.*?)<\/span>/)[1];
    if (dummFinalOn()) {                                   // Finale: Fragekasten
      let q = '';
      if (d.phase === 'over') q = `<small>GEWONNEN HAT</small><div class="o-big o-win">${iconHtml(d.winner, '')} ${esc(dummName(d.winner))}</div>`;
      else if (d.q) q = `<small>${d.phase === 'estimate' ? 'SCHÄTZFRAGE' : 'FRAGE AN ' + esc(dummName(d.turn)).toUpperCase()}</small>${d.q.flag ? `<div class="o-flagrow">${flagImg(d.q.flag, 'ovfin')}<div class="o-q">${esc(d.q.text)}</div></div>` : `<div class="o-q">${esc(d.q.text)}</div>`}`;
      return `<div class="o-dq"><div class="o-dqh"><b>FINALE</b><span>${phase}</span><em>${DUMM_FINAL_WINS} richtige gewinnen</em></div>${q}</div>`;
    }
    const timer = d.phase === 'round' || d.phase === 'vote' ? `<div class="vtimer o-timer"><div class="vtbar"><i></i></div><span class="vtt"></span></div>` : '';
    let txt = '';                                          // Hauptrunde: Leiste unten
    if (d.phase === 'ready') txt = `<small>DER DÜMMSTE FLIEGT · ${phase}</small><b>${d.round ? 'Gleich geht’s weiter …' : 'Gleich geht’s los …'}</b>`;
    if (d.phase === 'round') txt = `<small>RUNDE ${d.round} · FRAGE AN ${esc(dummName(d.turn)).toUpperCase()}${d.q && d.q.cat ? ' · ' + esc(d.q.cat).toUpperCase() : ''}</small><b>${d.q ? esc(d.q.text) : ''}</b>`;
    if (d.phase === 'vote') txt = `<small>ABSTIMMUNG · ${d.voted}/${dummActive().length} STIMMEN</small><b class="o-vote">Wer verliert ein Leben?</b>`;
    if (d.phase === 'result') txt = `<small>ERGEBNIS · ${Object.keys(d.tally || {}).sort((a, b) => d.tally[b] - d.tally[a]).map(id => esc(dummName(id)) + ' ' + d.tally[id]).join(' · ')}</small><b>${d.loser ? esc(dummName(d.loser)) + ' verliert ein Leben' : 'Gleichstand!'}</b>`;
    if (d.phase === 'over') txt = `<small>GEWONNEN HAT</small><b class="o-win">${iconHtml(d.winner, '')} ${esc(dummName(d.winner))}</b>`;
    const fl = d.phase === 'round' && d.q && d.q.flag ? flagImg(d.q.flag, 'ovbar') : '';
    return `<div class="o-dbar ${fl ? 'flag' : ''}">${fl}<div class="o-dtxt">${txt}</div>${timer}</div>`;
  },
  side: () => ''                                           // Leben stehen direkt in den Kamera-Kacheln
};

/* Host-Hauptmenü: fester OBS-Link */
function obsCard() {
  return `<div class="card obs-card"><h3>OBS Overlay Link</h3>
    <div class="lk"><code>${esc(OVERLAY_URL)}</code></div>
    <div class="row"><button class="btn y" onclick="A.copyOv(this)">Link kopieren</button></div>
    <p class="mu">In OBS als Browser-Source einfügen (1920×1080)</p>
    ${HOST_PASSWORD_HASH ? '' : '<p class="mu tip">Tipp: Trag unten bei „Quizmaster“ den angezeigten Wert als HOST_PASSWORD_HASH in die Datei ein. Dann kann niemand mit eigenem Host dein Overlay stören.</p>'}
  </div>`;
}

/* ===== Login ===== */
function gateView() {
  const host = ROLE === 'host', setup = host && !hostHash();
  const enter = `onkeydown="if(event.key==='Enter')A.login()"`;
  return `<div class="wrap">${logo()}
    <div class="card gate"><h3>${setup ? 'Quizmaster-Passwort festlegen' : host ? 'Quizmaster-Login' : 'Spieler-Login'}</h3>
      <p class="mu">${setup ? 'Wähle ein Passwort. Das gibst du ab jetzt bei jedem Öffnen ein.' : host ? 'Gib dein Quizmaster-Passwort ein.' : 'Gib das Passwort ein, das du vom Quizmaster bekommen hast.'}</p>
      <div class="gform">
        <input class="input" id="pw" type="${host ? 'password' : 'text'}" placeholder="${host ? 'Passwort' : 'z. B. K7MXP2'}" autocomplete="${host ? 'current-password' : 'off'}" autocapitalize="characters" spellcheck="false" ${enter}>
        ${setup ? `<input class="input" id="pw2" type="password" placeholder="Passwort wiederholen" ${enter}>` : ''}
        <button class="btn y" onclick="A.login()">${setup ? 'Festlegen' : 'Einloggen'}</button>
      </div>
      ${gateErr ? `<div class="warn" style="margin-top:14px">${esc(gateErr)}</div>` : ''}
    </div></div>`;
}

/* ===== Views ===== */
function hostView() {
  const ovl = (t, k) => `<div class="lk"><span>${t}</span><code>${esc(overlayLink(k))}</code><div class="row"><button class="btn y" onclick="A.copy('${k}',this)">Kopieren</button></div></div>`;
  return `<div class="wrap">${logo()}${statusChip()}${warn()}
    <div class="card"><h3>Spiel wählen</h3>
      <div class="now">${state.activeGame ? '▶ ' + esc(gameName(state.activeGame)) : 'Hauptmenü'}</div>
      <div class="mg">${Object.keys(GAMES).map(k =>
        `<button class="gm ${state.activeGame === k ? 'on' : ''}" onclick="A.game('${k}')">${GAMES[k]}</button>`).join('')}</div>
      ${state.activeGame ? `<div class="row" style="margin-top:18px"><button class="btn" onclick="A.menu()">← Zurück zum Menü</button></div>` : ''}
    </div>
    ${!state.activeGame ? obsCard() : ''}
    ${state.activeGame === 'imposter' ? impHostCard() : ''}
    ${state.activeGame === 'crash' ? crashHostCard() : ''}
    ${state.activeGame === 'dumm' ? dummHostCard() : ''}
  </div>`;
}

/* Unterer Teil der Host-Seite (unter den Kameras) */
function hostBottom() {
  const ovl = (t, k) => `<div class="lk"><span>${t}</span><code>${esc(overlayLink(k))}</code><div class="row"><button class="btn y" onclick="A.copy('${k}',this)">Kopieren</button></div></div>`;
  return `<div class="wrap wrap-b">
    ${avatarHostCard()}
    <div class="card"><h3>Spieler-Links</h3>
      <div class="round">
        <div><span class="mu">AKTUELLE RUNDE</span><b>${esc(ROUND.toUpperCase())}</b></div>
        <div class="pwbox"><span class="mu">SPIELER-PASSWORT</span><b>${esc(ROUND_PW)}</b><button class="btn y sm" onclick="A.copyPw(this)">Kopieren</button></div>
        <button class="btn pk" onclick="A.newRound()">Neue Runde · neue Links + Passwort</button>
      </div>
      <p class="mu">Namen eintragen, Link kopieren, an den Spieler schicken – und das Passwort dazu (am besten getrennt vom Link). Links und Passwort gelten nur für diese Runde. Vor dem nächsten Quiz „Neue Runde“ drücken – dann kommt mit den alten niemand mehr rein.</p>
      <div class="slots">${slotCards()}</div>
      <div class="row" style="margin-top:16px"><button class="btn y" onclick="A.openAll()">Alle zum Testen öffnen</button><button class="btn" onclick="A.resetNames()">Namen zurücksetzen</button></div>
    </div>
    <div class="card"><h3>Quizmaster</h3>
      ${HOST_PASSWORD_HASH ? '' : `<p class="mu">Dein Passwort gilt im Moment nur in diesem Browser. Damit es auf allen Geräten gilt, trage diesen Wert in der index.html bei HOST_PASSWORD_HASH ein:</p>
      <div class="lk"><code>${esc(hostHash())}</code><div class="row"><button class="btn y sm" onclick="A.copyHash(this)">Kopieren</button></div></div>`}
      <div class="row"><button class="btn" onclick="A.logout()">Abmelden</button></div>
    </div>
  </div>`;
}

function playerView() {
  if (linkProblem() || roundClosed) {
    const t = linkProblem() || 'Diese Runde ist beendet. Frag den Host nach deinem Link für die neue Runde.';
    return `<div class="wrap">${logo()}<div class="card dead"><h3>Kein Zutritt</h3><p class="mu">${esc(t)}</p></div></div>`;
  }
  const g = state.activeGame;
  const mine = (state.players || []).find(p => p.id === me.id);
  const youCard = `<div class="card"><h3>Du</h3>
      <div class="row">
        <input class="input" value="${esc(me.name)}" maxlength="24" onchange="A.rename(this.value)">
        <span class="mu">ID ${esc(me.id)} · CAM ${mine && mine.slot || me.slot || '–'}</span>
      </div>
    </div>`;
  // Imposter: Rolle steht im Infokasten oben (in #vdo), hier nur noch Name + Spielerliste
  if (g === 'imposter') return `<div class="wrap wrap-b">${statusChip()}${warn()}</div>`;
  if (g === 'dumm') return state.dumm ? `<div class="wrap wrap-b">${statusChip()}${warn()}</div>`
    : `<div class="wrap">${statusChip()}${warn()}<div class="card"><h3>Der Dümmste fliegt</h3><div class="stage"><div><b>Der Dümmste fliegt</b>Warte, bis der Quizmaster das Spiel startet …</div></div></div></div>`;
  if (g === 'crash') return state.crash ? `<div class="wrap wrap-b">${statusChip()}${warn()}</div>` : `<div class="wrap">${statusChip()}${warn()}${crashPlayerView()}</div>`;
  return `<div class="wrap">${logo()}${statusChip()}${warn()}
    ${avatarCard(false)}
    <div class="card"><h3>Aktives Spiel</h3>
      <div class="now">${g ? esc(gameName(g)) : gotState ? 'Hauptmenü' : 'Warte auf den Host …'}</div>
      ${expired && !gotState ? '<p class="mu">Der Host ist gerade nicht online oder dein Link ist aus einer alten Runde. Die Kameras funktionieren trotzdem.</p>' : ''}
      ${g === 'imposter' ? impPlayerStage() : `<div class="stage">${g ? `<div><b>${esc(gameName(g))}</b>Hier kommt die Spiel-UI hin.</div>` : '<div>Gleich geht’s los …</div>'}</div>`}
    </div>
  </div>`;
}

function overlayView() {
  const g = state.activeGame, cl = camList();
  const camsHtml = cl.length ? `<div class="ocams">${cl.map(camTile).join('')}</div>` : '';
  const noCam = connectedPlayers().filter(p => !p.cameraFrame);   // Spieler ohne Kamera als Namens-Chip
  return `<div class="ov ${OV_LAYOUT}">
    ${OV_LAYOUT !== 'bottom' ? camsHtml : ''}
    <div class="omain">
      <h1 class="${g ? '' : 'idle'}">${g ? esc(gameName(g)) : 'Gleich geht’s los'}</h1>
      ${g === 'imposter' && state.imposter ? `<div class="osub">Kategorie ${esc(state.imposter.category)} · Runde ${state.imposter.deal}<br>Wer ist der Imposter?</div>` : ''}
      ${noCam.length ? `<div class="chips">${noCam.map(p => `<div class="chip"><i>${p.slot || '–'}</i>${esc(p.name)} · ${esc(p.id)}</div>`).join('')}</div>` : ''}
    </div>
    ${OV_LAYOUT === 'bottom' ? camsHtml : ''}
  </div>`;
}

function render() {
  document.body.className = ROLE === 'overlay' ? 'overlay' : '';
  updateVdo();
  const app2 = document.getElementById('app2');
  // Eingabefeld nicht beim Tippen überschreiben
  if (ROLE !== 'overlay' && document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('input')) return;
  if (!authed && !(ROLE === 'player' && linkProblem())) {          // noch nicht eingeloggt → nur Login
    document.getElementById('app').innerHTML = gateView();
    if (app2) app2.innerHTML = '';
    const f = document.getElementById('pw'); if (f && f.focus) f.focus();
    return;
  }
  if (ROLE === 'overlay') { renderOverlay(); return }
  if (ROLE === 'player') syncWinner(document.body);       // Gewinner + Konfetti in der Spieler-Ansicht
  document.getElementById('app').innerHTML = ROLE === 'host' ? hostView() : playerView();
  if (app2) app2.innerHTML = (ROLE === 'host' ? hostBottom() : '') + versionTag();
  // Eigenes Video-Element wiederverwenden, damit es beim Neuzeichnen nicht flackert
  const slot = document.getElementById('myvid');
  if (slot && stream) slot.appendChild(vid);
}

/* Host doppelt offen? Startet ein anderer Tab eine neue Runde, lädt sich dieser Tab neu –
   sonst würde er den alten Raum (mit altem Passwort) weiter offen halten. */
addEventListener('storage', e => { if (ROLE === 'host' && e.key === 'qs-round' && e.newValue && e.newValue !== ROUND) location.reload() });

/* Start: Schlüssel berechnen, gespeicherten Login dieser Sitzung prüfen, dann verbinden */
(async function boot() {
  try {
    await initOverlayChannel();
    if (ROLE === 'host') {
      loadRoundPw(false);
      if (crypto.subtle) await deriveKeys(ROUND_PW);
      const hh = hostHash();
      if (hh && ss.get('qs-auth-host') === hh) authed = true;
    }
    if (ROLE === 'player' && !linkProblem()) {
      const pw = ss.get('qs-auth-' + ROUND);
      if (pw && await checkPlayerPw(pw)) authed = true;
    }
  } catch (e) {}
  render();
  if (authed) connect();
  if (ROLE === 'host') { crashSync(); crashSchedule() }
})();
</script>

<!--
  ===== WAS DU ALS NÄCHSTES ANPASSEN MUSST =====
  0. Passwortschutz: Quizmaster-Passwort beim ersten Öffnen festlegen, für alle Geräte den angezeigten Wert
     bei HOST_PASSWORD_HASH eintragen. Spieler-Passwort steht im Host bei den Spieler-Links.
  1. Kamera-Werte oben im Skript (Abschnitt "Kamera – HIER ANPASSEN"): FRAME_MS, FRAME_W, FRAME_Q.
     Jedes Bild ist eine Realtime-Nachricht, die an alle Clients geht. Bei 6 Kameras alle 300 ms
     kommen schnell über hundert zugestellte Nachrichten pro Sekunde zusammen. Wenn Supabase
     drosselt oder dein Kontingent knapp wird: FRAME_MS auf 500–1000 hochsetzen.
  2. Kamera geht nur über https:// (z. B. Netlify) oder localhost. Über file:// klappt es in Chrome
     meist auch, für Mitspieler aber immer über die Online-Adresse.
  3. Overlay in OBS: https://anduuuuin.github.io/Streamer-Games-by-Anduuuuin/?role=overlay als
     Browser-Source 1920×1080. Aussehen pro Spiel: OVERLAY_GAMES im Skript + CSS "OBS-Overlay".
     HOST_PASSWORD_HASH eintragen, damit niemand mit eigenem Host dein Overlay stören kann.
  4. Runden: Vor jedem Quiz "Neue Runde · neue Links" drücken und die neuen Links verschicken.
  5. Nur EIN Host gleichzeitig und immer im selben Browser (Runde, Schlüssel, Namen im localStorage).
  6. Falls Supabase unter Realtime → Settings "Private channels only" aktiv ist: ausschalten.
  6a. Profilbilder: Größe/Qualität oben bei AVATAR_SIZE/AVATAR_QUALITY, Anzeige im CSS unter "Profilbilder".
      Freigabe-Logik in pushAvatars/receiveAvatar/avatarDecide – nur freigegebene Bilder verlassen den Host.
  6c. Der Dümmste fliegt: Leben/Timer oben bei DUMM_LIVES/DUMM_ROUND_SEC/DUMM_VOTE_SEC (im Host änderbar),
      Herzen bei DUMM_HEART, Fragen in DUMM_QUESTIONS/DUMM_ESTIMATES, RAUS-Overlay im CSS unter "RAUS-Overlay".
  6b. Crash: Icons, Geschwindigkeit (CRASH_BASE/CRASH_RATE/CRASH_RATE_VARIATION) und Crash-Wahrscheinlichkeit (CRASH_RANGES)
     oben im Abschnitt "Crash – HIER ANPASSEN", Aussehen im CSS unter "Crash" und im Diagramm bei CRASH_CHART.
  7. Imposter: Wörter, Kategorie, Anzahl Imposter, Mindestspieler, Redezeit (IMPOSTER_TURN_SEC),
     Anzahl Durchgänge (IMPOSTER_TURN_ROUNDS) und Abstimmungszeit (IMPOSTER_VOTE_SEC) oben unter "Imposter – HIER ANPASSEN".
     Rollen werden pro Spieler verschlüsselt – Spieler-Links aus dem Host nehmen (sie enthalten den Schlüssel &s=…).
  8. Spieler-Kameras laufen über VDO.Ninja: Room-Name oben bei VDO_ROOM, Kachelgröße im CSS bei .vgrid.
     Der Room-Name ist öffentlich lesbar – wer ihn kennt, kann in den Room. Später ggf. &password=… ergänzen.
     Host und Overlay nutzen noch die alte Standbild-Kamera (Supabase-Frames).
-->
</body>
