<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streamer Games</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0221;--bg2:#2a0a5e;--panel:#1b0b4d;
  --pink:#ff2bd6;--cyan:#00f0ff;--yellow:#ffe600;--green:#39ff14;--red:#ff2d55;
  --tx:#fff;--mu:#b9a8e8;
  --px:'Press Start 2P',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  color:var(--tx);font-family:var(--px);
  background:
    repeating-linear-gradient(0deg,#00000045 0 2px,transparent 2px 5px),
    linear-gradient(#ff2bd626 2px,transparent 2px) 0 0/60px 60px,
    linear-gradient(90deg,#ff2bd626 2px,transparent 2px) 0 0/60px 60px,
    linear-gradient(var(--bg),var(--bg2));
  background-attachment:fixed;
}
body.overlay{background:transparent;overflow:hidden}
.wrap{max-width:1000px;margin:auto;padding:24px 16px 48px}

/* Logo */
.logo{display:flex;justify-content:center;gap:28px;margin:10px 0 28px;flex-wrap:wrap}
.logo b{font-size:clamp(22px,6vw,48px);color:var(--yellow);text-shadow:4px 4px 0 var(--pink),8px 8px 0 #000}
.logo b+b{color:var(--cyan)}

/* Panels */
.card{background:var(--panel);border:4px solid var(--cyan);box-shadow:6px 6px 0 #000;padding:18px;margin-bottom:22px}
.card h3{margin:0 0 16px;font-size:13px;color:var(--yellow);text-shadow:2px 2px 0 var(--pink);text-transform:uppercase;line-height:1.5}
.mu{color:var(--mu);font-size:10px;line-height:1.8}

/* Status-Chip */
.status{display:inline-block;font-size:10px;padding:8px 12px;border:3px solid #000;background:var(--red);color:#000;margin-bottom:18px}
.status.ok{background:var(--green)}
.warn{background:var(--yellow);color:#000;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:14px;font-size:11px;line-height:1.8;margin-bottom:22px}

/* Game-Buttons */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.gm{font:14px/1.7 var(--px);background:var(--panel);color:var(--yellow);border:4px solid var(--cyan);box-shadow:6px 6px 0 #000;padding:30px 12px;text-shadow:3px 3px 0 var(--pink);cursor:pointer;text-transform:uppercase}
.gm:hover{background:var(--bg2)}
.gm:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.gm.on{background:var(--pink);color:#000;text-shadow:none;border-color:#000}
.btn{font:11px var(--px);background:#000;color:var(--cyan);border:3px solid var(--cyan);box-shadow:4px 4px 0 #000;padding:12px 14px;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}

/* Aktuelles Spiel */
.now{font-size:clamp(14px,3.5vw,22px);color:var(--green);line-height:1.6;margin:4px 0 14px;text-transform:uppercase}

/* Spielerliste */
.plist{display:grid;gap:10px}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#000;border:3px solid var(--pink);padding:10px 12px;font-size:10px;line-height:1.6}
.pl .fr{background:var(--yellow);color:#000;padding:6px 8px;border:2px solid #000;white-space:nowrap}
.pl .nm{color:#fff;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .id{color:var(--cyan);font-size:9px;white-space:nowrap}
.pl.me{border-color:var(--green)}
.empty{font-size:10px;color:var(--mu);line-height:1.8}

/* Links */
.lk{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.lk span{font-size:10px;color:var(--yellow)}
code{font:12px ui-monospace,monospace;background:#000;color:var(--cyan);padding:6px 8px;border:2px solid #ffffff22;word-break:break-all}

/* Spieler-Links im Host */
.slots{display:grid;gap:12px}
.slot{background:#000;border:3px solid var(--pink);padding:12px;display:grid;gap:10px}
.slot.live{border-color:var(--green)}
.slot .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slot .no{background:var(--yellow);color:#000;font-size:10px;padding:8px;border:2px solid #000}
.slot .dot{font-size:9px;color:var(--mu)}
.slot.live .dot{color:var(--green)}
.slot .input{max-width:220px;padding:9px;font-size:11px}
.btn.y{color:var(--yellow);border-color:var(--yellow)}
.btn.ok{color:#000;background:var(--green);border-color:#000}

/* Runde */
.round{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:#000;border:4px solid var(--yellow);box-shadow:6px 6px 0 #000;padding:14px;margin-bottom:14px}
.round b{display:block;font-size:22px;color:var(--yellow);text-shadow:3px 3px 0 var(--pink);margin-top:8px;letter-spacing:4px}
.btn.pk{color:#000;background:var(--pink);border-color:#000}
.card.dead{border-color:var(--red);text-align:center}
.card.dead h3{color:var(--red);text-shadow:none}

/* Kamera-Kacheln – Größe/Abstand hier anpassen */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding-bottom:12px}
.ctile{position:relative;border:5px solid var(--c);background:#000;box-shadow:5px 5px 0 #000}
.cbox{aspect-ratio:4/3;overflow:hidden;background:repeating-linear-gradient(45deg,#1b0b4d 0 10px,#12063a 10px 20px)}
.cbox img,.cbox video{width:100%;height:100%;object-fit:cover;display:block}
.cbox video{transform:scaleX(-1)}
#myvid{width:100%;height:100%}
.cbadge{position:absolute;left:6px;top:-12px;background:var(--c);color:#000;font:9px var(--px);font-style:normal;padding:5px 7px;border:2px solid #000}
.cname{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);background:#000;border:3px solid var(--c);color:var(--c);font:9px var(--px);padding:5px 9px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.pl .on{font-style:normal;color:var(--green)}

/* Imposter */
.role{border:6px solid var(--c);box-shadow:8px 8px 0 #000;background:#000;padding:28px 18px;text-align:center;display:grid;gap:14px;justify-items:center}
.role.crew{--c:var(--cyan)}.role.imp{--c:var(--red)}.role.hidden{--c:var(--mu)}
.role small{font-size:10px;color:var(--mu);letter-spacing:2px}
.role b{font-size:clamp(22px,6vw,40px);color:var(--c);text-shadow:4px 4px 0 #000,6px 6px 0 var(--pink)}
.role.imp b{animation:glow 1.2s ease-in-out infinite alternate}
.role .word{font-size:clamp(18px,5vw,34px);color:var(--yellow);text-shadow:3px 3px 0 var(--pink);background:var(--panel);border:4px solid var(--yellow);padding:16px 22px;text-transform:uppercase;line-height:1.4;max-width:100%;overflow-wrap:anywhere}
.role p{font-size:10px;line-height:2;color:#fff;margin:0;max-width:520px}
.role em{font-style:normal;color:var(--yellow)}
.imp-card{border-color:var(--red)}
.sol{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.sol>div{background:#000;border:3px solid var(--yellow);padding:12px 14px;display:grid;gap:8px}
.sol b{font-size:14px;color:var(--yellow);text-transform:uppercase;line-height:1.5}.sol b.red{color:var(--red)}
.osub{font:clamp(14px,1.6vw,28px)/1.8 var(--px);color:var(--cyan);text-align:center;text-shadow:3px 3px 0 #000;background:#000c;border:4px solid var(--cyan);box-shadow:6px 6px 0 #000;padding:14px 24px}

/* VDO.Ninja-Kameras – LAYOUT HIER ANPASSEN */
.vwrap{padding-top:0}
.vgrid{
  --vdo-w:240px;            /* Breite einer Kachel */
  --vdo-h:180px;            /* Höhe einer Kachel */
  --vdo-radius:14px;        /* Abrundung der Ecken */
  display:flex;flex-wrap:wrap;gap:22px 18px;margin-top:14px
}
.vtile{width:var(--vdo-w);display:grid;gap:10px;justify-items:center}
.vframe{width:var(--vdo-w);height:var(--vdo-h);border-radius:var(--vdo-radius);overflow:hidden;background:#000;border:4px solid var(--cyan);box-shadow:5px 5px 0 #000}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vtile.own .vframe{border-color:var(--green);box-shadow:5px 5px 0 #000,0 0 18px var(--green)}
.vname{font:10px var(--px);color:#fff;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 10px;background:#000;border:3px solid var(--cyan);border-radius:8px}
.vtile.own .vname{color:#000;background:var(--green);border-color:#000}
.vhead a{color:#000;font-weight:bold}
@media (max-width:560px){.vgrid{--vdo-w:calc(50vw - 46px);--vdo-h:calc((50vw - 46px)*.75)}}

.vtile.host:not(.own) .vframe{border-color:#8b5cf6}
.vtile.host:not(.own) .vname{border-color:#8b5cf6;color:#c4b5fd}
.wrap-b{padding-top:0}
#app .wrap{padding-bottom:0}

/* Imposter-Ansicht für Spieler – LAYOUT HIER ANPASSEN
   Zeile 1: Quizmaster-Kamera + Infokasten · Zeile 2: Spieler-Kameras · Zeile 3: Timer */
body.imp-mode{display:flex;flex-direction:column}
body.imp-mode #vdo{order:0;padding-top:24px}
body.imp-mode #app{order:1}
body.imp-mode #app2{order:2}
body.imp-mode #vdo .vhead .row{justify-content:flex-end}
.vgrid.imp{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:34px 16px;margin-top:18px}
.vgrid.imp .vtile{width:auto}
.vgrid.imp .vframe{width:100%;height:auto;aspect-ratio:4/3}
.vgrid.imp .vtile.host{grid-column:1}
.vframe.ph{display:grid;place-items:center;border-style:dashed;border-color:var(--mu);background:repeating-linear-gradient(45deg,#1b0b4d 0 10px,#12063a 10px 20px)}
.vframe.ph span{font:9px var(--px);color:var(--mu);text-align:center;padding:8px;line-height:1.6}
.vinfo{order:1;grid-column:2 / -1;border:6px solid var(--yellow);background:#000;box-shadow:8px 8px 0 #000;padding:18px 20px;display:flex;flex-wrap:wrap;gap:18px 34px;align-items:center;align-content:center;min-height:100%}
.vinfo.good{border-color:var(--cyan)}
.vinfo.bad{border-color:var(--red)}
.vinfo .ik{display:grid;gap:10px}
.vinfo small{font-size:10px;color:var(--mu);letter-spacing:2px}
.vinfo b{font-size:clamp(14px,2.2vw,26px);color:var(--yellow);text-transform:uppercase;line-height:1.4;text-shadow:3px 3px 0 var(--pink);overflow-wrap:anywhere}
.vinfo b.word{color:var(--cyan)}
.vinfo b.red{color:var(--red);animation:glow 1.2s ease-in-out infinite alternate}
.vinfo b.wait{font-size:11px;color:#fff;text-shadow:none;line-height:1.9;text-transform:none}
.vinfo span{font-size:9px;color:#fff;line-height:1.8}
.vinfo .btn{margin-left:auto}
.vtimer{order:100;grid-column:1 / -1;display:flex;align-items:center;gap:16px;background:#000;border:4px solid #fff;box-shadow:6px 6px 0 #000;padding:10px 14px}
.vtbar{flex:1;height:22px;background:#1b0b4d;border:3px solid #000;overflow:hidden}
.vtbar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--yellow) 0 16px,transparent 16px 20px);transition:width .2s linear}
.vtt{font-size:14px;color:var(--yellow);min-width:70px;text-align:right;white-space:nowrap}
.vtimer.low .vtt{color:var(--red)}
.vtimer.low .vtbar i{background:repeating-linear-gradient(90deg,var(--red) 0 16px,transparent 16px 20px)}
.vtimer.done{border-color:var(--red)}
.vtimer.done .vtt{color:var(--red);animation:blink .5s steps(2) infinite}
.vtimer.idle{border-color:var(--mu)}
.vtimer.idle .vtt{font-size:9px;color:var(--mu);min-width:0}
@keyframes blink{to{opacity:.2}}
#htimer{color:var(--yellow)}
@media (max-width:700px){.vgrid.imp{--cols:3 !important}}

/* Imposter-Ablauf: Dran-Markierung, Antwort-Blasen, Abstimmung, Host-Auswertung */
.vtile.turn .vframe{border-color:var(--yellow);box-shadow:5px 5px 0 #000,0 0 26px var(--yellow);animation:turnpulse 1s ease-in-out infinite alternate}
.vtile.turn .vname{background:var(--yellow);color:#000;border-color:#000}
@keyframes turnpulse{to{box-shadow:5px 5px 0 #000,0 0 6px var(--yellow)}}
.vans{position:relative;font:10px/1.6 var(--px);color:#000;background:var(--yellow);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:8px 10px;max-width:100%;text-align:center;overflow-wrap:anywhere;text-transform:uppercase}
.vans:empty{display:none}
.vans::after{content:'';position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#000;border-bottom:0}
.vinfo .ik.ph b.me{color:var(--green);animation:glow 1s ease-in-out infinite alternate}
.vinfo .ik.vote{flex-basis:100%}
.vinfo .vbtns{display:flex;flex-wrap:wrap;gap:10px}
.vinfo .vin{max-width:260px}
.btn.big{font-size:13px;padding:16px 18px}
.turnbox{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:#000;border:4px solid var(--yellow);box-shadow:5px 5px 0 #000;padding:14px;margin:14px 0}
.turnbox b{font-size:16px;color:var(--yellow);text-shadow:2px 2px 0 var(--pink);text-transform:uppercase}
.turnbox span{font-size:10px}
.answers{display:grid;gap:8px;margin:14px 0}
.arow{display:grid;grid-template-columns:minmax(90px,1fr) auto minmax(90px,1.4fr) 24px;gap:12px;align-items:center;background:#000;border:3px solid var(--mu);padding:10px 12px;font-size:10px}
.arow b{color:#fff;text-transform:uppercase}.arow i{font-style:normal;font-size:8px;color:var(--mu)}
.arow span{color:var(--yellow);text-transform:uppercase;overflow-wrap:anywhere}
.arow em{font-style:normal;font-size:14px;text-align:right}
.arow.right{border-color:var(--green)}.arow.right em{color:var(--green)}
.arow.wrong{border-color:var(--red)}.arow.wrong em{color:var(--red)}
@media (max-width:560px){.arow{grid-template-columns:1fr auto}.arow i{display:none}}

/* Imposter: Einstellungen + Punkte */
.setup{display:flex;flex-wrap:wrap;gap:16px;margin:6px 0 16px}
.setup label{display:grid;gap:8px;background:#000;border:3px solid var(--cyan);padding:12px 14px;min-width:220px}
.setup label span{font-size:11px;color:var(--yellow)}
.setup label small{font-size:8px;color:var(--mu)}
.setup .input{max-width:120px;font-size:16px;padding:10px}
.pbox{margin-top:14px;display:grid;gap:10px}
.scores{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:#000;border:3px solid var(--pink);padding:8px 12px;font-size:10px}
.srow i{font-style:normal;color:var(--mu)}
.srow b{color:#fff;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow span{color:var(--yellow)}
.scores.big .srow{font-size:12px;padding:12px 14px}
.srow.win{border-color:var(--yellow);box-shadow:0 0 16px var(--yellow)}
.srow.win b{color:var(--yellow)}
.vinfo .ik.fin{flex-basis:100%}
.pl .pts{font-style:normal;color:var(--yellow);margin-left:6px}

/* Imposter-Spieleransicht kompakt: Quizmaster + Infokasten oben, Punktestand unter dem Quizmaster */
body.imp-mode #vdo{padding-top:8px}
body.imp-mode #vdo>.card{padding:12px;margin-bottom:14px}
.vgrid.imp{margin-top:0}
.vinfo{grid-row:span 2}                      /* Infokasten so hoch wie Quizmaster-Kamera + Punktestand */
.vscore{order:2;grid-column:1;background:#000;border:4px solid #8b5cf6;box-shadow:5px 5px 0 #000;padding:10px;display:grid;gap:6px;align-content:start}
.vsh{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.vsh small{font-size:8px;color:#c4b5fd;letter-spacing:1px}
.vsr{display:flex;justify-content:space-between;gap:8px;font-size:9px;line-height:1.5;padding:4px 6px;border:2px solid transparent}
.vsr b{color:#fff;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:normal}
.vsr span{color:var(--yellow)}
.vsr.me{border-color:var(--green)}.vsr.me b{color:var(--green)}
.vsr:nth-child(2) span{text-shadow:0 0 8px var(--yellow)}
.vframe.ph span{display:grid;gap:10px;justify-items:center}
.btn.sm{font-size:8px;padding:8px 10px;box-shadow:3px 3px 0 #000}

/* Login + Passwort */
.gate{max-width:560px;margin:0 auto 22px}
.gform{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.gform .input{flex:1;min-width:200px;font-size:16px;letter-spacing:2px}
.pwbox{display:grid;gap:8px;justify-items:start}
.pwbox b{font-size:22px;color:var(--cyan);text-shadow:3px 3px 0 var(--pink);letter-spacing:4px}

/* Kategorie-Auswahl */
select.input{font:11px var(--px);background:#000;color:#fff;border:3px solid var(--cyan);padding:10px;max-width:100%;cursor:pointer}
.setup label.wide{flex-basis:100%}
.setup label.wide select{max-width:420px}
.catrow{display:grid;gap:8px;margin-top:14px}
.catrow select{max-width:420px}
.vinfo em{font-style:normal;color:var(--yellow)}

/* ===== OBS-Overlay 1920×1080 – LAYOUT HIER ANPASSEN ===== */
html:has(body.overlay){background:transparent}
body.overlay{margin:0;width:100vw;height:100vh;overflow:hidden}
body.overlay #app,body.overlay #app2{margin:0;padding:0}
body.overlay #vdo{display:none}
#ostage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:var(--px);color:#fff}
#ostage.bg{background:repeating-linear-gradient(0deg,#00000045 0 2px,transparent 2px 5px),linear-gradient(#ff2bd626 2px,transparent 2px) 0 0/60px 60px,linear-gradient(90deg,#ff2bd626 2px,transparent 2px) 0 0/60px 60px,linear-gradient(var(--bg),var(--bg2))}
/* Positionen der vier Bereiche */
.o-hostcam{position:absolute;left:40px;top:40px;width:400px}
.o-side{position:absolute;left:40px;top:410px;width:400px;height:330px}
.o-game{position:absolute;left:480px;right:40px;top:40px;height:690px;display:flex;flex-direction:column;gap:22px}
.o-row{position:absolute;left:40px;right:40px;bottom:30px;height:270px;display:flex;justify-content:center;align-items:flex-end;gap:22px}
/* Kamera-Kacheln */
.otile{position:relative;display:grid;gap:10px;justify-items:center;width:260px}
.o-hostcam .otile{width:400px}
.oframe{width:100%;aspect-ratio:4/3;background:repeating-linear-gradient(45deg,#1b0b4d 0 12px,#12063a 12px 24px);border:6px solid var(--cyan);box-shadow:6px 6px 0 #000;overflow:hidden;display:grid;place-items:center;box-sizing:border-box}
.otile.host .oframe{border-color:#8b5cf6}
.oframe iframe{width:100%;height:100%;border:0;display:block}
.oframe span{font-size:12px;color:var(--mu)}
.oname{font-size:14px;background:#000;border:3px solid var(--cyan);color:#fff;padding:8px 14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.otile.host .oname{border-color:#8b5cf6;color:#c4b5fd}
.otile.turn .oframe{border-color:var(--yellow);animation:turnpulse 1s ease-in-out infinite alternate}
.otile.turn .oname{background:var(--yellow);color:#000;border-color:#000}
.otile .vans{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;padding:10px 14px}
/* Spiel-Bereich: allgemeine Bausteine */
.o-head{display:flex;align-items:baseline;gap:30px}
.o-head b{font-size:56px;color:var(--yellow);text-shadow:5px 5px 0 var(--pink),10px 10px 0 #000}
.o-head span{font-size:22px;color:var(--cyan)}
.o-grid{display:grid;grid-template-columns:420px 1fr;gap:22px;flex:1;min-height:0}
.o-panel{background:#1b0b4dcc;border:6px solid var(--cyan);box-shadow:8px 8px 0 #000;padding:30px;box-sizing:border-box}
.o-center{display:grid;gap:24px;align-content:center;justify-items:center;text-align:center;flex:1}
.o-center small{font-size:16px;color:var(--mu);line-height:1.8}
.o-big{font-size:46px;line-height:1.4;text-shadow:5px 5px 0 #000}
.o-timer{padding:16px 20px}.o-timer .vtbar{height:34px}.o-timer .vtt{font-size:24px;min-width:120px}
.o-scores{background:#000;border:5px solid #8b5cf6;box-shadow:6px 6px 0 #000;padding:16px;display:grid;gap:8px;max-height:100%;overflow:hidden;box-sizing:border-box}
.o-scores .vsr{font-size:15px}.o-scores .vsh small{font-size:12px}
.o-wait{height:100%;display:grid;place-items:center;align-content:center;gap:60px}
.o-logo{display:flex;gap:40px}
.o-logo b{font-size:80px;color:var(--yellow);text-shadow:6px 6px 0 var(--pink),12px 12px 0 #000}.o-logo b+b{color:var(--cyan)}
.o-waittxt{font-size:34px;color:var(--cyan)}

/* ===== Crash – AUSSEHEN HIER ANPASSEN ===== */
.crash-card{border-color:var(--yellow)}
.crash-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 22px;margin-bottom:16px}
.crash-head b{font-size:26px;color:var(--yellow);text-shadow:3px 3px 0 var(--pink)}
.crash-head span{font-size:10px;color:var(--cyan)}
.crash-head .mine{color:var(--green);margin-left:auto}
.crash-chart{position:relative;background:#000;border:5px solid var(--cyan);box-shadow:6px 6px 0 #000;margin-bottom:16px}
.crash-chart canvas{display:block;width:100%;height:auto}
.crash-score{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:clamp(22px,5vw,46px);color:var(--yellow);text-shadow:4px 4px 0 var(--pink),8px 8px 0 #000;pointer-events:none}
.crash-score.boom{color:var(--red);animation:glow .8s ease-in-out infinite alternate}
.crash-btn{display:block;width:100%;font:clamp(16px,4vw,26px) var(--px);padding:24px 14px;text-align:center;border:5px solid #000;box-shadow:6px 6px 0 #000;margin-bottom:16px;box-sizing:border-box}
button.crash-btn.go{background:var(--green);color:#000;cursor:pointer;animation:turnpulse .6s ease-in-out infinite alternate}
button.crash-btn.go:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.crash-btn.safe{background:#000;color:var(--green);border-color:var(--green)}
.crash-btn.boom{background:#000;color:var(--red);border-color:var(--red)}
.crash-btn.wait{background:#000;color:var(--mu);border-color:var(--mu);font-size:12px}
.crash-pick small,.crash-tot small{font-size:9px;color:var(--mu);letter-spacing:1px}
.crash-pick .icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;margin:10px 0 18px}
.crash-pick .icon{display:grid;gap:6px;justify-items:center;background:#000;border:4px solid var(--cyan);box-shadow:4px 4px 0 #000;padding:12px 6px;cursor:pointer}
.crash-pick .icon span{font-size:36px;line-height:1}
.crash-pick .icon em{font:8px var(--px);font-style:normal;color:var(--mu);min-height:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crash-pick .icon.on{border-color:var(--green);background:#0b2a0b}.crash-pick .icon.on em{color:var(--green)}
.crash-pick .icon:disabled{opacity:.35;cursor:default}
.crash-tot{display:grid;gap:8px}
.srow.mine{border-color:var(--green)}
.crash-win{text-align:center;display:grid;gap:12px;margin:10px 0 18px}
.crash-win small{font-size:10px;color:var(--mu)}
.crash-win b{font-size:clamp(20px,5vw,36px);color:var(--yellow);text-shadow:4px 4px 0 var(--pink);animation:glow 1s ease-in-out infinite alternate}
.crows{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:34px 1fr auto 70px;gap:12px;align-items:center;background:#000;border:3px solid var(--mu);padding:8px 12px;font-size:10px}
.crow i{font-style:normal;font-size:22px}.crow b{color:#fff;text-transform:uppercase}
.crow span{color:var(--cyan)}.crow em{font-style:normal;color:var(--yellow);text-align:right}
.crow.safe{border-color:var(--green)}.crow.safe span{color:var(--green)}
.crow.lost{border-color:var(--red)}.crow.lost span{color:var(--red)}
/* Crash – Spieler-Ansicht nach Skizze
   Zeile 1: Zielpunktzahl (rechts) · Zeile 2+3: Quizmaster-Kamera + Punkte links, Diagramm rechts · Zeile 4: Spieler-Kameras */
.vgrid.crash .vtarget{grid-column:2 / -1;grid-row:1;justify-self:end;min-width:55%}
.vgrid.crash .vtile.host{grid-column:1;grid-row:2}
.vgrid.crash .vscore{grid-column:1;grid-row:3}
.vgrid.crash .vinfo{grid-column:2 / -1;grid-row:2 / span 2;min-height:0}
.vgrid.crash .vtile:not(.host){grid-row:4}
.vtarget{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px 26px;background:#000;border:4px solid var(--yellow);box-shadow:5px 5px 0 #000;padding:12px 18px;font-size:14px;color:var(--yellow)}
.vtarget b{margin-right:auto;font-size:18px;text-shadow:3px 3px 0 var(--pink)}
.vtarget small{font-size:8px;color:var(--mu);margin-right:6px}
.vtarget .mine{color:var(--green)}
.vinfo.crashbox{display:grid;gap:14px;align-content:start;padding:14px;border-color:var(--cyan)}
.vinfo.crashbox .crash-chart{margin:0}
.vinfo.crashbox .crash-btn{margin:0;font-size:clamp(14px,2.4vw,24px);padding:18px 12px}
.vinfo.crashbox .crash-pick .icons{margin-bottom:6px}
@media (max-width:700px){.vgrid.crash .vtarget{grid-column:1 / -1;min-width:0;justify-self:stretch}.vgrid.crash .vtile:not(.host){grid-row:auto}}

.ver{text-align:center;font-size:8px;color:var(--mu);opacity:.6;padding:6px 0 18px}

/* ===== Profilbilder – GRÖSSE/LAYOUT HIER ANPASSEN ===== */
:root{--avi-inline:1.25em;--avi-pic:96px;--avi-host:110px}
img.avi{width:var(--avi-inline);height:var(--avi-inline);border-radius:50%;object-fit:cover;vertical-align:middle;border:2px solid #000;box-shadow:0 0 0 2px var(--cyan)}
.crash-btn img.avi{--avi-inline:1.3em}
.avbox .avrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avbox.compact{background:#000;border:3px solid var(--pink);padding:12px;margin-bottom:12px;display:grid;gap:10px}
.avbox.compact small{font-size:9px;color:var(--mu);letter-spacing:1px}
.avpic{width:var(--avi-pic);height:var(--avi-pic);border-radius:50%;overflow:hidden;border:4px solid var(--cyan);background:#000;display:grid;place-items:center;flex:none}
.avpic img{width:100%;height:100%;object-fit:cover}
.avpic span{font-size:30px;color:var(--mu)}
.avpic.pending{border-color:var(--yellow);border-style:dashed}.avpic.approved{border-color:var(--green)}.avpic.rejected{border-color:var(--red)}
.avside{display:grid;gap:8px;justify-items:start}
.avst{font-size:10px;color:var(--mu)}.avst.pending{color:var(--yellow)}.avst.approved{color:var(--green)}.avst.rejected{color:var(--red)}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:100px}
.av-card{border-color:var(--yellow)}
.badge-n{display:inline-block;background:var(--red);color:#fff;font-size:10px;padding:4px 8px;margin-left:8px;text-shadow:none}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.avitem{display:grid;gap:10px;justify-items:center;background:#000;border:3px solid var(--mu);padding:12px;text-align:center}
.avitem.pending{border-color:var(--yellow)}
.avitem img{width:var(--avi-host);height:var(--avi-host);border-radius:50%;object-fit:cover;border:3px solid var(--cyan)}
.avitem b{font-size:10px;text-transform:uppercase}
.avgrid.small .avitem img{--avi-host:64px}
/* Kamera aus → Profilbild füllt die Kachel */
.vframe.avi-bg,.oframe.avi-bg{background-size:cover;background-position:center;background-repeat:no-repeat}
.vframe.avi-bg span,.oframe.avi-bg span{font-size:0;align-self:end;margin-bottom:8px}   /* Text „Keine Kamera“ ausblenden, Knopf bleibt */
#ostage .oname img.avi{--avi-inline:1.4em}

/* ===== Der Dümmste fliegt – AUSSEHEN HIER ANPASSEN ===== */
.dumm-card{border-color:var(--red)}
.dhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;flex-basis:100%}

.dq{display:grid;gap:12px}

.vsr.dl.out b{color:var(--red);text-decoration:line-through}.vsr.dl.out span{color:var(--red)}
/* Leben-Anzeige (Herzen) */
.lives{letter-spacing:1px;white-space:nowrap;font-size:.95em}
.lives.zero{opacity:.6}
/* RAUS-Overlay: Kamera ausgeblendet, Profilbild + großes rotes RAUS (Größe/Farbe/Drehung HIER) */
.vframe,.oframe{position:relative}
.vtile.out iframe,.otile.out iframe{visibility:hidden}
.vtile.out .vframe,.otile.out .oframe{border-color:var(--red);background-color:#1a0005}
.raus{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2;
  font:clamp(18px,4.5vw,44px) var(--px);color:#ff1a1a;transform:rotate(-14deg);letter-spacing:2px;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;
  text-shadow:4px 4px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 18px rgba(255,0,0,.85)}
.otile .raus{font-size:52px;-webkit-text-stroke:4px #000}
.o-hostcam .raus{font-size:70px}
.vtile.out .vname,.otile.out .oname{border-color:var(--red);color:var(--red)}
/* Leben-/Punkte-Abzeichen oben rechts in der Kamera-Kachel – HIER ANPASSEN */
.vlives{position:absolute;top:6px;right:6px;z-index:3;background:rgba(0,0,0,.6);border:2px solid #000;padding:4px 6px;font-size:14px;line-height:1;display:flex;align-items:baseline;gap:6px}
.vlives .lives{font-size:inherit}
.vlives b{font:18px var(--px);color:var(--yellow)}.vlives small{font:7px var(--px);color:#fff}

/* Der Dümmste fliegt – Spieler-Ansicht nach Skizze
   Hauptrunde: 3 Spalten – Quizmaster, Kamera 1, Kamera 2 / Kamera 3, 4, 5 – darunter Infokasten + Timer */
.vgrid.imp.dumm{grid-template-columns:repeat(3,minmax(0,1fr))}

.vgrid.imp.dumm .vtile.host{width:82%;justify-self:start}

/* Finale: Quizmaster klein oben links, Fragekasten oben rechts, 2 Finalisten groß darunter */
.vgrid.imp.dumm.dfin{grid-template-columns:repeat(6,minmax(0,1fr))}
.vgrid.imp.dumm.dfin .vtile.host{grid-column:1 / 3;grid-row:1;width:85%}
.vgrid.imp.dumm.dfin .vinfo{grid-column:3 / -1;grid-row:1;order:0;align-self:start}
.vgrid.imp.dumm.dfin .vtile.fin{grid-column:span 3;grid-row:2}
.vgrid.imp.dumm.dfin .vtile:not(.host):not(.fin){display:none}
.vgrid.imp.dumm.dfin .vtile.fin .vframe{border-color:var(--yellow)}
.vgrid.imp.dumm.dfin .vtile.fin .vlives b{font-size:28px}
@media (max-width:700px){.vgrid.imp.dumm{grid-template-columns:repeat(2,minmax(0,1fr))}.vgrid.imp.dumm.dfin .vtile.host,.vgrid.imp.dumm.dfin .vinfo{grid-column:1 / -1;grid-row:auto}}

     if (ROLE === 'host') syncPlayers();
     render();
   })
   .subscribe(async s => {
     if (c !== ch) return;
     status = s; render();
     if (s !== 'SUBSCRIBED') return;
     if (me) await trackMe(c);
     if (ROLE === 'host') { push(); pushAvatars() }
     else {
       c.send({ type: 'broadcast', event: 'hello', payload: {} });   // State vom Host anfordern
       if (ROLE === 'player') setTimeout(() => { if (!gotState) { expired = true; render() } }, 8000);
     }
   });
}

function onState({ payload }) {
  if (ROLE === 'host' || !payload || !payload.state) return;
  state = payload.state; gotState = true; expired = false;
  fillFrames();
  const v = (state.imposter && state.imposter.vote) || 0;
  if (v !== myVote) { myVote = v; myAnswer = ''; draft = '' }
  applyHostName(); unsealMyRole(); syncTimer(); crashSync(); render();
}

/* Host ist die einzige Quelle der Wahrheit: er verteilt den State an Spieler und Overlay */
function push() {
  if (ROLE !== 'host') return;
  state.names = Object.fromEntries(slots.map((n, i) => ['p' + (i + 1), n]));
  state.avatarStatus = avatarStatus();   // nur der Status (pending/approved/rejected) – die Bilder selbst gehen getrennt raus
  state.hostVdo = hostCam ? hostCam.vdoId : '';   // Kamera-ID des Hosts für alle
  syncTimer();
  const lean = { ...state, round: ROUND, ck: CK, sentAt: Date.now(), players: state.players.map(({ cameraFrame, ...p }) => p) };
  ls.set('qs-state', JSON.stringify(lean));
  const msg = { type: 'broadcast', event: 'state', payload: { state: lean } };
  if (ch && status === 'SUBSCRIBED') ch.send(msg);
  if (chO && chOok) chO.send({ type: 'broadcast', event: 'state', payload: { state: overlayState() } });   // Overlay: nur Anzeige-Daten
}

/* Eigene Daten in Presence melden – der Host übernimmt sie ins players-Array */
function trackMe(c) {
  c = c || ch;
  if (!me || !c || status !== 'SUBSCRIBED') return;
  return c.track({ id: me.id, name: me.name, slot: me.slot, vdoId: me.vdoId || '', role: 'player' });
}

/* Spieler übernimmt den Namen, den der Host für seinen Platz eingetragen hat */
let lastHostName;
function applyHostName() {
  if (!me || !state.names) return;
  const n = state.names[me.id];
  if (!n || n === lastHostName) return;
  lastHostName = n;
  if (n === me.name) return;
  me.name = n; ls.set('qs-name', n);
  trackMe();
}

/* Host baut state.players aus Presence und vergibt freie Plätze */
function syncPlayers() {
  const prev = Object.fromEntries(state.players.map(p => [p.id, p.slot]));
  const used = new Set();
  const list = online.map(p => {
    let s = prev[p.id] || p.slot || 0;
    if (s && used.has(s)) s = 0;
    if (s) used.add(s);
    return { id: p.id, name: p.name, slot: s, vdoId: cleanVdo(p.vdoId), cameraFrame: '' };
  });
  list.forEach(p => {
    if (!p.slot) for (let i = 1; i <= MAX_SLOTS; i++) if (!used.has(i)) { p.slot = i; used.add(i); break }
  });
  state.players = list;
  fillFrames();
  push();
}

/* Verbundene Spieler (Liste unten). Das Overlay nimmt die Liste vom Host. */
function connectedPlayers() {
  const l = ROLE === 'overlay' ? state.players : online.map(p => {
    const s = state.players.find(x => x.id === p.id);
    return { id: p.id, name: p.name, slot: (s && s.slot) || p.slot || 0 };
  });
  return [...(l || [])].map(p => ({ ...p, cameraFrame: camFrame(p.id) }))
    .sort((a, b) => (a.slot || 99) - (b.slot || 99));
}

/* ===== Kamera: empfangen ===== */
function camFrame(id) { return id === myId() && stream ? 'live' : (cams[id] && cams[id].frame) || '' }
function fillFrames() { (state.players || []).forEach(p => p.cameraFrame = (cams[p.id] && cams[p.id].frame) || '') }
function setPlayerFrame(id, f) { const p = (state.players || []).find(x => x.id === id); if (p) p.cameraFrame = f }

function setCam(id, name, frame) {
  if (!frame) { if (cams[id]) { dropCam(id); render() } return }
  const isNew = !cams[id];
  cams[id] = { name: name || (cams[id] && cams[id].name) || id, frame, t: Date.now() };
  setPlayerFrame(id, frame);
  if (isNew) render();
  else document.querySelectorAll('img[data-cam="' + id + '"]').forEach(img => img.src = frame); // nur das Bild tauschen, kein Neuzeichnen
}
function dropCam(id) { delete cams[id]; setPlayerFrame(id, '') }

// Kameras ohne neues Bild (Tab geschlossen, Netz weg) nach FRAME_TIMEOUT entfernen
setInterval(() => {
  const now = Date.now(); let changed = false;
  for (const id in cams) if (now - cams[id].t > FRAME_TIMEOUT) { dropCam(id); changed = true }
  if (changed) render();
}, 1000);

/* ===== Kamera: eigene ===== */
let stream = null, camTimer = null, camErr = '';
const vid = document.createElement('video');
vid.muted = true; vid.autoplay = true; vid.playsInline = true; vid.setAttribute('playsinline', '');
const cvs = document.createElement('canvas');

async function startCam() {
  if (stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camErr = 'Kein Kamerazugriff möglich. Die Seite muss über https:// laufen (z. B. Netlify), nicht über einen normalen http-Link.';
    render(); return;
  }
  try {
    // Aufnahme-Auflösung – kleiner reicht, gesendet wird ohnehin nur FRAME_W breit
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false });
  } catch (e) {
    camErr = e && e.name === 'NotAllowedError' ? 'Kamera wurde nicht erlaubt. Klick links in der Adressleiste auf das Schloss und erlaube die Kamera.'
      : e && e.name === 'NotFoundError' ? 'Keine Kamera gefunden.'
      : 'Kamera konnte nicht gestartet werden (' + (e && e.message || e) + '). Läuft sie schon in einem anderen Programm?';
    stream = null; render(); return;
  }
  camErr = '';
  vid.srcObject = stream; vid.play && vid.play().catch(() => {});
  stream.getVideoTracks().forEach(t => t.onended = stopCam);   // Kamera abgezogen o. Ä.
  camTimer = setInterval(sendFrame, FRAME_MS);
  render();
}

function sendFrame() {
  if (!stream || !vid.videoWidth || !ch || status !== 'SUBSCRIBED') return;
  const w = FRAME_W, h = Math.round(w * vid.videoHeight / vid.videoWidth);
  cvs.width = w; cvs.height = h;
  const g = cvs.getContext('2d');
  g.translate(w, 0); g.scale(-1, 1);          // spiegeln wie im Selfie – entfernen, wenn Schrift lesbar sein soll
  g.drawImage(vid, 0, 0, w, h);
  const f = cvs.toDataURL('image/jpeg', FRAME_Q);
  if (f.length > 200000) return;              // Sicherheitsgrenze, falls FRAME_W/FRAME_Q zu hoch gesetzt sind
  setPlayerFrame(myId(), f);
  ch.send({ type: 'broadcast', event: 'frame', payload: { id: myId(), name: myName(), frame: f } });
}

function sendEmptyFrame() {
  if (ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'frame', payload: { id: myId(), name: myName(), frame: '' } });
}

function stopCam() {
  const was = !!stream;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; clearInterval(camTimer); camTimer = null; vid.srcObject = null;
  setPlayerFrame(myId(), '');
  if (was) { sendEmptyFrame(); render() }
}

// Seite verlassen: allen sagen, dass die Kamera aus ist (FRAME_TIMEOUT fängt den Rest ab)
addEventListener('pagehide', () => {
  if (stream) sendEmptyFrame();
  if (ROLE === 'host' && hostCam && hostCam.vdoId) { const v = hostCam.vdoId; hostCam.vdoId = ''; try { push() } catch (e) {} hostCam.vdoId = v }
  if (me && ch) { try { ch.untrack() } catch (e) {} }   // Spieler verlässt die Seite → raus aus dem players-Array
});

/* ===== Imposter =====
   Der Host verteilt die Rollen. Jede Rolle wird mit dem Schlüssel des jeweiligen Spielers
   verschlüsselt (AES-GCM). Im State steht nur Verschlüsseltes – Overlay und andere Spieler
   können fremde Rollen nicht lesen. Nur der Host kennt die Lösung. */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rint = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
async function keyFor(secret, round) {
  const raw = await crypto.subtle.digest('SHA-256', te.encode('streamer-games:' + round + ':' + secret));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
}
async function seal(secret, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await keyFor(secret, ROUND), te.encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function unseal(secret, box) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, await keyFor(secret, ROUND), unb64(box.ct));
  return JSON.parse(td.decode(pt));
}

let impSolution = null, impShow = false, impMsg = '', impBusy = false;   // nur Host
try { impSolution = JSON.parse(ls.get('qs-imp') || 'null') } catch (e) {}
let myRole = null, myDeal = 0, roleHidden = false;                       // nur Spieler

async function deal() {
  if (ROLE !== 'host' || impBusy) return;
  if (!crypto.subtle) { impMsg = 'Verschlüsselung nicht verfügbar – die Seite muss über https:// laufen.'; render(); return }
  const pl = connectedPlayers().filter(p => /^p[1-9]\d*$/.test(p.id) && +p.id.slice(1) <= MAX_SLOTS);
  if (pl.length < IMPOSTER_MIN_PLAYERS) {
    impMsg = `Mindestens ${IMPOSTER_MIN_PLAYERS} Spieler nötig – gerade ${pl.length} verbunden.`;
    render(); return;
  }
  impBusy = true; impMsg = '';
  const ids = pl.map(p => p.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = rint(i + 1); [ids[i], ids[j]] = [ids[j], ids[i]] }
  const imps = ids.slice(0, Math.min(IMPOSTER_COUNT, ids.length - 1));
  // Kategorie: die gewählte – oder zufällig (möglichst nicht dieselbe wie letzte Runde)
  let cat = impCfg.category in imposterDatabase ? impCfg.category : '';
  if (!cat) {
    const others = IMPOSTER_CATEGORIES.filter(c => IMPOSTER_CATEGORIES.length === 1 || !impSolution || c !== impSolution.category);
    cat = others[rint(others.length)];
  }
  // Begriff: zufällig aus der Kategorie (nicht derselbe wie letzte Runde)
  const words = [...new Set(imposterDatabase[cat])];
  const pool = words.length > 1 ? words.filter(w => !impSolution || w !== impSolution.word) : words;
  const word = pool[rint(pool.length)];
  const roles = {};
  for (const p of pl) {
    const sec = secrets[+p.id.slice(1) - 1];
    roles[p.id] = await seal(sec, imps.includes(p.id)
      ? { role: 'imposter', category: IMPOSTER_SEES_CATEGORY ? cat : '' }
      : { role: 'crew', word, category: cat });
  }
  const n = (state.imposter && state.imposter.deal || 0) + 1;
  const seat = [...pl].sort((a, b) => (a.slot || 99) - (b.slot || 99)).map(p => p.id);   // Sitzreihenfolge nach Platz
  // Startspieler wechselt jede Runde: der Nächste nach dem letzten Startspieler, in der ersten Runde zufällig
  const last = state.impLastStart;
  let start = seat.indexOf(last);
  if (start >= 0) start = (start + 1) % seat.length;
  else if (last) { const s = +String(last).slice(1), nx = seat.findIndex(id => +id.slice(1) > s); start = nx >= 0 ? nx : 0 }  // letzter Starter ist weg
  else start = rint(seat.length);
  const order = [...seat.slice(start), ...seat.slice(0, start)];
  state.impLastStart = order[0];
  const names = Object.fromEntries(pl.map(p => [p.id, p.name]));
  state.imposter = { deal: n, category: cat, count: pl.length, roles, order, names, phase: 'dealt', turn: -1, vote: 0, reveal: null };
  impSolution = { deal: n, word, category: cat, impIds: imps, imposters: pl.filter(p => imps.includes(p.id)).map(p => p.name), players: pl.map(p => p.name) };
  ls.set('qs-imp', JSON.stringify(impSolution));
  if (impPendingRound && state.impGame) { state.impGame.round = impPendingRound; impPendingRound = 0 }
  state.timer = null;          // Timer startet erst, wenn der Host „Start“ drückt
  impAnswers = {}; saveAns();
  impShow = false; impBusy = false;
  push(); render();
}

async function unsealMyRole() {
  if (!me) return;
  const im = state.activeGame === 'imposter' ? state.imposter : null;
  if (!im) { myRole = null; myDeal = 0; return }
  if (im.deal === myDeal) return;
  myDeal = im.deal; roleHidden = false;
  const box = im.roles && im.roles[me.id];
  if (!box) { myRole = { role: 'out' }; return }
  if (!me.secret || !crypto.subtle) { myRole = { role: 'error' }; return }
  myRole = { role: 'pending' };
  try { myRole = await unseal(me.secret, box) } catch (e) { myRole = { role: 'error' } }
  render();
}

/* ===== Imposter-Ablauf =====
   Phasen in state.imposter.phase:
   'dealt'  → Rollen verteilt, wartet auf „Start“ vom Host
   'turns'  → jeder Spieler ist IMPOSTER_TURN_ROUNDS-mal dran, je IMPOSTER_TURN_SEC Sekunden; Host tippt „Weiter“
   'vote'   → IMPOSTER_VOTE_SEC Sekunden: Imposter tippt das Wort, alle anderen wählen den Imposter
   'reveal' → Host hat die Antworten freigegeben, sie stehen über den Kameras */
const impOrder = () => (state.imposter && state.imposter.order) || [];
const impTurns = () => (state.impCfg && +state.impCfg.turns) || IMPOSTER_TURN_ROUNDS;
const impTotal = () => impOrder().length * impTurns();
const impName = id => (state.imposter && state.imposter.names && state.imposter.names[id]) || (state.names || {})[id]
  || ((state.players || []).find(p => p.id === id) || {}).name || id;

/* Einstellungen (nur Host, vor dem Spiel) */
let impCfg = { rounds: IMPOSTER_ROUNDS, turns: IMPOSTER_TURN_ROUNDS, category: 'random' }, impPendingRound = 0;   // category: Name oder 'random'
try { Object.assign(impCfg, JSON.parse(ls.get('qs-impcfg') || '{}')) } catch (e) {}

/* Punkte: state.scores = { p1: 4, p2: -1, … } – bleiben über alle Runden eines Spiels */
const ptsOf = id => (state.scores || {})[id] || 0;
const fmtPts = n => n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '±0';
const scoreOn = () => state.activeGame === 'imposter' && !!state.impGame;
const inGame = id => !!id && id !== 'host' && (id in (state.scores || {}) || impOrder().includes(id));
function scoreList() {
  const ids = [...new Set([...Object.keys(state.scores || {}), ...impOrder()])];
  const l = ids.map(id => ({ id, name: impName(id), pts: ptsOf(id) })).sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
  l.forEach((s, i) => s.place = i && s.pts === l[i - 1].pts ? l[i - 1].place : i + 1);
  return l;
}
/* Punkte einer Runde berechnen (Host, beim Freigeben) */
function impScore() {
  const im = state.imposter, sol = impSolution || {}, imps = sol.impIds || [], d = {};
  im.order.forEach(id => d[id] = 0);
  const byName = Object.fromEntries(Object.entries(im.names || {}).map(([id, n]) => [n, id]));
  im.order.forEach(id => {
    const a = impAnswers[id]; if (!a) return;
    if (imps.includes(id)) { if (norm(a) === norm(sol.word)) d[id] += IMPOSTER_PTS_WORD }     // Imposter errät das Wort
    else {
      const t = byName[a];
      if (imps.includes(t)) { d[id] += IMPOSTER_PTS_CATCH; d[t] += IMPOSTER_PTS_PER_VOTE }       // richtig getippt / Stimme gegen den Imposter
    }
  });
  return d;
}
function impTurnPid() {
  const im = state.imposter, o = impOrder();
  if (!im || im.phase !== 'turns' || !o.length) return '';
  return o[im.turn % o.length] || '';
}
const timerRunning = () => !!timerEnd && Date.now() < timerEnd;

/* Antworten: Spieler verschlüsseln mit ihrem eigenen Schlüssel → nur der Host kann sie lesen */
let myAnswer = '', myVote = 0, draft = '';                 // Spieler
let impAnswers = {};                                        // Host: id → Antwort
try { const a = JSON.parse(ls.get('qs-imp-ans') || 'null'); if (a && state.imposter && a.deal === state.imposter.deal && a.vote === state.imposter.vote) impAnswers = a.answers || {} } catch (e) {}
function saveAns() { if (ROLE === 'host' && state.imposter) ls.set('qs-imp-ans', JSON.stringify({ deal: state.imposter.deal, vote: state.imposter.vote, answers: impAnswers })) }

async function sendAnswer(text) {
  const im = state.imposter;
  text = String(text || '').trim().slice(0, 40);
  if (!me || !im || im.phase !== 'vote' || !timerRunning() || !text) return;
  myAnswer = text; draft = ROLE === 'player' && myRole && myRole.role === 'imposter' ? text : draft;
  render();
  try {
    const box = await seal(me.secret, { text, vote: im.vote });
    if (ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'answer', payload: { id: me.id, vote: im.vote, box } });
  } catch (e) {}
}

async function receiveAnswer(pl) {
  const im = state.imposter;
  if (ROLE !== 'host' || !pl || !im || im.phase !== 'vote' || pl.vote !== im.vote) return;
  const id = cleanId(pl.id);
  if (!im.roles || !im.roles[id]) return;
  if (timerEnd && Date.now() > timerEnd + 2000) return;        // zu spät (2 s Kulanz fürs Netz)
  try {
    const o = await unseal(secrets[+id.slice(1) - 1], pl.box);
    if (o.vote !== im.vote) return;
    impAnswers[id] = String(o.text || '').slice(0, 40);
    saveAns(); render();
  } catch (e) {}
}

/* Prüft für den Host, ob eine Antwort richtig ist */
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
function answerOk(id, text) {
  const sol = impSolution; if (!sol || !text) return false;
  const imps = sol.impIds || [];
  return imps.includes(id) ? norm(text) === norm(sol.word) : imps.some(x => impName(x) === text);
}

/* ===== VDO.Ninja-Kameras (nur Spieler-Seite) =====
   Die Kacheln liegen in einem eigenen Bereich #vdo außerhalb von #app. Sie werden nur ergänzt
   oder entfernt, nie neu gezeichnet – sonst würden die iframes bei jedem Update neu laden. */
const cleanVdo = s => /^(spieler|host)_[a-z0-9]{4}$/.test(s || '') ? s : '';
let vdoWin = null, vdoBlocked = false;

/* Der Host hat eine eigene Kamera-ID (host_xxxx). Sie bleibt über Runden hinweg gleich
   und wird im State als hostVdo an alle verteilt. */
const hostCam = ROLE === 'host' ? { id: 'host', name: HOST_NAME, slot: 0, vdoId: cleanVdo(ls.get('qs-vdo-host')) } : null;
const camSelf = () => ROLE === 'host' ? hostCam : me;
const vdoKey = () => ROLE === 'host' ? 'qs-vdo-host' : 'qs-vdo-' + ROUND + '-' + me.id;
function announceCam() { ROLE === 'host' ? push() : trackMe() }   // Host → State, Spieler → Presence

function vdoConnect() {
  const M = camSelf(); if (!M) return;
  if (!M.vdoId) {
    M.vdoId = (ROLE === 'host' ? 'host_' : 'spieler_') + Array.from(crypto.getRandomValues(new Uint8Array(4)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
    ls.set(vdoKey(), M.vdoId);
  }
  // Muss direkt im Klick passieren, sonst blockt der Browser das Fenster
  vdoWin = window.open(vdoPushUrl(M.vdoId, M.name), 'vdo-push-' + M.vdoId);
  vdoBlocked = !vdoWin;
  announceCam(); updateVdo(true);
}

function vdoDisconnect() {
  const M = camSelf(); if (!M || !M.vdoId) return;
  try { vdoWin && vdoWin.close() } catch (e) {}
  vdoWin = null; vdoBlocked = false;
  ls.set(vdoKey(), '');
  M.vdoId = '';
  announceCam(); updateVdo(true);
}

/* Alle bekannten Spieler: players-Array im State (vom Host) + Presence der verbundenen Spieler –
   damit funktionieren die Kameras auch, wenn der Host gerade nicht offen ist. */
function vdoPeople() {
  const byId = {};
  (state.players || []).forEach(p => byId[p.id] = { ...p });
  online.forEach(p => byId[p.id] = { ...(byId[p.id] || {}), ...p, slot: (byId[p.id] && byId[p.id].slot) || p.slot });
  return Object.values(byId);
}

/* Kamera-Liste. withPlaceholders = auch Spieler ohne Kamera als Platzhalter-Kachel (Imposter-Ansicht). */
function vdoList(withPlaceholders) {
  const M = camSelf();
  const l = [];
  vdoPeople().forEach(p => {
    const own = !!(me && p.id === me.id);
    const v = own ? cleanVdo(me.vdoId) : cleanVdo(p.vdoId);
    if (v) l.push({ key: v, vdoId: v, pid: p.id, name: own ? me.name : p.name, slot: p.slot || 9, own });
    else if (withPlaceholders || aviOf(p.id)) l.push({ key: 'ph-' + p.id, pid: p.id, name: own ? me.name : p.name, slot: p.slot || 9, own, ph: true });   // Kamera aus: Platzhalter (mit Profilbild, falls freigegeben)
  });
  // Host-Kamera (kommt beim Spieler über den State)
  if (ROLE !== 'host') {
    const hv = cleanVdo(state.hostVdo);
    if (hv) l.push({ key: hv, vdoId: hv, pid: 'host', name: HOST_NAME, slot: 0, host: true });
    else if (withPlaceholders) l.push({ key: 'ph-host', pid: 'host', name: HOST_NAME, slot: 0, host: true, ph: true });
  }
  // Eigene Kachel, falls man selbst noch nicht in der Liste ist (z. B. Presence noch unterwegs)
  if (M && !l.some(p => p.own) && (M.vdoId || withPlaceholders && ROLE === 'player'))
    l.push(M.vdoId ? { key: M.vdoId, vdoId: M.vdoId, pid: M.id, name: M.name, slot: M.slot || 9, own: true, host: ROLE === 'host' }
                   : { key: 'ph-' + M.id, pid: M.id, name: M.name, slot: M.slot || 9, own: true, ph: true });
  return l;
}

/* Infokasten in der Imposter-Ansicht: Imposter sieht nur die Kategorie, alle anderen auch das Wort */
function impInfo() {
  const r = myRole, im = state.imposter;
  const toggle = `<button class="btn" onclick="A.hideRole()">${roleHidden ? 'Rolle zeigen' : 'Rolle verbergen'}</button>`;
  if (state.impGame && state.impGame.over) return { cls: 'good', html: `<div class="ik fin"><small>SPIEL BEENDET · ENDSTAND</small>${scoreTable(true)}</div>` };
  if (!im) return { cls: '', html: `<div class="ik"><small>IMPOSTER</small><b class="wait">Warte, bis der Quizmaster das Spiel startet …</b></div>` };
  if (!r || r.role === 'pending') return { cls: '', html: `<div class="ik"><b class="wait">Rolle wird entschlüsselt …</b></div>` };
  if (r.role === 'out') return { cls: '', html: `<div class="ik"><small>ZUSCHAUEN</small><b class="wait">Du warst beim Verteilen noch nicht da. In der nächsten Runde bist du dabei.</b></div>${impPhaseLine()}` };
  if (r.role === 'error') return { cls: 'bad', html: `<div class="ik"><small>HOPPLA</small><b class="wait">Deine Rolle konnte nicht gelesen werden. Öffne deinen Link vom Host noch einmal.</b></div>` };
  const extra = im.phase === 'vote' ? (roleHidden ? `<div class="ik ph"><small>ABSTIMMUNG</small><b class="wait">Rolle zeigen, um abzustimmen.</b></div>` : impVoteBox(r)) : impPhaseLine();
  if (roleHidden) return { cls: '', html: `<div class="ik"><small>RUNDE ${im.deal}</small><b>VERDECKT</b></div>${extra}${toggle}` };
  if (r.role === 'imposter') return { cls: 'bad', html:
    `<div class="ik"><small>DEINE ROLLE</small><b class="red">DU BIST DER IMPOSTER</b><span>Kategorie: <em>${esc(r.category || '???')}</em> – den Begriff kennst du nicht. Tu so, als ob!</span></div>${extra}${toggle}` };
  return { cls: 'good', html:
    `<div class="ik"><small>KATEGORIE</small><b>${esc(r.category)}</b></div>
     <div class="ik"><small>DEIN BEGRIFF</small><b class="word">${esc(r.word)}</b></div>${extra}${toggle}` };
}

/* Zeile im Infokasten: wer ist dran / worauf wird gewartet */
function impPhaseLine() {
  const im = state.imposter;
  if (!im || im.phase === 'dealt') return `<div class="ik ph"><small>GLEICH GEHT'S LOS</small><b class="wait">Warte auf den Start durch den Quizmaster …</b></div>`;
  if (im.phase === 'turns') {
    const pid = impTurnPid(), r = Math.floor(im.turn / impOrder().length) + 1, mine = me && pid === me.id;
    return `<div class="ik ph"><small>DURCHGANG ${r}/${impTurns()} · ZUG ${im.turn + 1}/${impTotal()}</small><b class="${mine ? 'me' : ''}">${mine ? 'DU BIST DRAN!' : 'DRAN: ' + esc(impName(pid))}</b></div>`;
  }
  if (im.phase === 'reveal') { const d = me && im.result ? im.result[me.id] : undefined;
    return `<div class="ik ph"><small>AUFLÖSUNG</small><b class="wait">Die Antworten stehen über den Kameras.${d !== undefined ? ' Deine Punkte: ' + fmtPts(d) + ' (gesamt ' + ptsOf(me.id) + ')' : ''}</b></div>` }
  return '';
}

/* Abstimmung: Imposter tippt das Wort, alle anderen wählen einen Namen */
function impVoteBox(r) {
  const open = timerRunning();
  if (!open) return `<div class="ik vote"><small>ABSTIMMUNG</small><b class="wait">${myAnswer ? 'Deine Antwort: „' + esc(myAnswer) + '“. ' : 'Keine Antwort abgegeben. '}Zeit um – der Quizmaster wertet aus …</b></div>`;
  const done = myAnswer ? `<span>Abgegeben: „${esc(myAnswer)}“ – du kannst bis Zeitende ändern.</span>` : '';
  if (r.role === 'imposter') return `<div class="ik vote"><small>WELCHES WORT SUCHEN DIE ANDEREN?</small>
      <div class="row"><input class="input vin" maxlength="40" placeholder="Dein Tipp" oninput="A.draft(this.value)" onkeydown="if(event.key==='Enter')A.sendWord()"><button class="btn y" onclick="A.sendWord()">Absenden</button></div>${done}</div>`;
  const others = impOrder().filter(id => !me || id !== me.id);
  return `<div class="ik vote"><small>WER IST DER IMPOSTER?</small>
      <div class="vbtns">${others.map(id => `<button class="btn ${myAnswer === impName(id) ? 'ok' : ''}" onclick="A.vote('${esc(id)}')">${esc(impName(id))}</button>`).join('')}</div>${done}</div>`;
}

let vdoHead = '', vdoInfoHtml = '';

function updateVdo(force) {
  const box = document.getElementById('vdo');
  if (!box) return;
  const show = authed && (ROLE === 'host' || (ROLE === 'player' && !linkProblem() && !roundClosed));
  // Spiel-Ansichten nur für Spieler (Layout HIER pro Spiel im CSS anpassen: .vgrid.imp bzw. .vgrid.crash)
  //   Imposter: Quizmaster + Infokasten oben, Punkte darunter, Spieler-Kameras, Timer
  //   Crash:    Zielpunktzahl oben rechts, Quizmaster + Punkte links, Diagramm rechts, Spieler-Kameras unten
  const imp = show && ROLE === 'player' && state.activeGame === 'imposter';
  const crm = show && ROLE === 'player' && state.activeGame === 'crash' && !!state.crash;
  const dm = show && ROLE === 'player' && state.activeGame === 'dumm' && !!state.dumm;   // Der Dümmste fliegt: Anordnung wie Imposter
  const lay = imp || crm || dm;
  document.body.classList.toggle('imp-mode', lay);
  box.style.display = show ? '' : 'none';
  if (!show) return;
  if (!box.querySelector('.vgrid')) box.innerHTML = '<div class="card"><h3 class="vtitle">Kameras</h3><div class="vhead"></div><div class="vgrid"></div></div>';

  const G = state.impGame;
  const title = imp ? 'IMPOSTER' + (G ? ' · RUNDE ' + G.round + '/' + G.rounds : '') : 'Kameras';
  const h3 = box.querySelector('.vtitle'); if (h3.textContent !== title) h3.textContent = title;
  h3.style.display = lay ? 'none' : '';   // im Spiel keine Überschrift → Kameras rücken nach oben

  // Kopfbereich (Buttons) – nur neu schreiben, wenn sich etwas geändert hat
  const M = camSelf();
  const head = M.vdoId
    ? `<div class="row"><button class="btn y" onclick="A.vdoConnect()">Kamera-Fenster öffnen</button><button class="btn" onclick="A.vdoDisconnect()">Kamera trennen</button></div>
       ${lay ? '' : '<p class="mu">Deine Kamera läuft im VDO.Ninja-Fenster – lass es offen. Dort einmal die Kamera erlauben und starten.</p>'}
       ${vdoBlocked ? `<div class="warn">Das Fenster wurde blockiert. <a href="${esc(vdoPushUrl(M.vdoId, M.name))}" target="_blank" rel="noopener">Hier klicken, um es zu öffnen</a> – oder Pop-ups für diese Seite erlauben.</div>` : ''}`
    : `<div class="row"><button class="btn y" onclick="A.vdoConnect()">● Kamera verbinden</button></div>
       ${lay ? '' : '<p class="mu">Öffnet ein VDO.Ninja-Fenster, in dem du deine Kamera freigibst.</p>'}`;
  if (force || head !== vdoHead) { box.querySelector('.vhead').innerHTML = head; vdoHead = head }
  // Im Spiel kein „Kamera verbinden“-Bereich (nur der Hinweis, falls das Fenster blockiert wurde)
  box.querySelector('.vhead').style.display = lay && !vdoBlocked ? 'none' : '';

  const grid = box.querySelector('.vgrid');
  grid.classList.toggle('imp', lay);     // gemeinsames Spiel-Raster
  grid.classList.toggle('crash', crm);   // Crash-Anordnung
  grid.classList.toggle('dumm', dm);
  grid.classList.toggle('dfin', dm && dummFinalOn());   // Finale: Quizmaster + Frage oben, 2 große Kameras

  // Kacheln abgleichen: neue anlegen, alte entfernen, Namen aktualisieren – iframes nie neu laden
  const list = vdoList(lay), want = new Set(list.map(p => p.key));
  grid.querySelectorAll('.vtile').forEach(t => { if (!want.has(t.dataset.vdo)) t.remove() });
  const players = list.filter(p => !p.host).length;
  grid.style.setProperty('--cols', Math.max(5, players));   // so viele Spalten wie Spieler (mind. 5)
  const im = state.imposter, turnPid = imp ? impTurnPid() : '', rev = imp && im && im.phase === 'reveal' ? (im.reveal || {}) : null, order = impOrder();
  const cr = crm ? state.crash : null;
  list.forEach(p => {
    let t = grid.querySelector('.vtile[data-vdo="' + p.key + '"]');
    if (!t) {
      t = document.createElement('div'); t.className = 'vtile'; t.dataset.vdo = p.key;
      t.innerHTML = p.ph
        ? `<div class="vans"></div><div class="vframe ph"><span>KEINE KAMERA${p.own && ROLE === 'player' ? '<button class="btn y sm" onclick="A.vdoConnect()">Kamera verbinden</button>' : ''}</span></div><div class="vname"></div>`
        : `<div class="vans"></div><div class="vframe"><iframe src="${esc(vdoViewUrl(p.vdoId, p.own))}" allow="autoplay; fullscreen; picture-in-picture" title="Kamera"></iframe></div><div class="vname"></div>`;
      grid.appendChild(t);
    }
    t.classList.toggle('own', !!p.own);
    t.classList.toggle('host', !!p.host);
    // Reihenfolge nur per CSS-order, damit die iframes nicht umgehängt werden (sonst laden sie neu)
    t.style.order = lay ? (p.host ? 0 : 10 + p.slot) : (p.own ? 0 : p.host ? 1 : p.slot + 1);
    const label = (p.own ? 'DU · ' : '') + (cr && cr.icons[p.pid] ? iconHtml(p.pid, cr.icons[p.pid]) + ' ' : '') + esc(p.name);
    const nm = t.querySelector('.vname'); if (nm._lbl !== label) { nm.innerHTML = label; nm._lbl = label }
    dummDecorate(t, '.vframe', p.pid, p.ph);   // Kamera aus → Profilbild · 0 Leben → Kamera weg, Profilbild + RAUS
    t.classList.toggle('turn', !!turnPid && p.pid === turnPid);                 // wer gerade dran ist
    const an = t.querySelector('.vans');                                         // Blase über der Kamera
    const dl = rev && im.result && p.pid in im.result ? ' · ' + fmtPts(im.result[p.pid]) : '';
    let at = rev && rev[p.pid] ? '„' + rev[p.pid] + '“' + dl : rev && order.includes(p.pid) ? '— keine Antwort —' + dl : '';
    if (cr && (cr.riders || []).includes(p.pid)) {                               // Crash: ausgestiegen / Ergebnis
      if (cr.phase === 'run' && cr.cashed[p.pid]) at = '✓ ' + cr.cashed[p.pid].pts;
      if (cr.phase === 'crashed' || cr.phase === 'over') at = (cr.last || {})[p.pid] ? '+' + cr.last[p.pid] : '💥 0';
    }
    if (an && an.textContent !== at) an.textContent = at;
  });

  // Bausteine der Spiel-Ansicht: Infokasten/Diagramm, Punkte, Timer, Zielpunktzahl
  const mk = cls => { let e = grid.querySelector('.' + cls); if (!e) { e = document.createElement('div'); e.className = cls; grid.appendChild(e) } return e };
  const info = mk('vinfo'), sc = mk('vscore'), tim = mk('vtimer'), tg = mk('vtarget');
  if (!tim.querySelector || !tim.querySelector('.vtbar')) tim.innerHTML = '<div class="vtbar"><i></i></div><span class="vtt"></span>';
  const showSc = (imp && scoreOn()) || crm;
  sc.style.display = showSc ? '' : 'none';
  if (showSc) { const sh = dm ? dummBoard() : crm ? crashScoreBoard() : scoreBoard(); if (sc.innerHTML !== sh) sc.innerHTML = sh }
  info.style.display = lay ? '' : 'none';
  tim.style.display = imp || dm ? '' : 'none';
  tg.style.display = crm ? '' : 'none';
  if (crm) { const th = crashTargetBar(); if (tg.innerHTML !== th) tg.innerHTML = th }
  if (lay) {
    const ii = imp ? impInfo() : dm ? { cls: 'dummbox', html: dummPanel() } : { cls: 'crashbox', html: crashPanel() };
    info.className = 'vinfo ' + ii.cls;
    if (ii.html !== vdoInfoHtml) {
      const focused = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('vin');
      info.innerHTML = ii.html; vdoInfoHtml = ii.html;
      const inp = info.querySelector && info.querySelector('.vin');
      if (inp) { inp.value = draft; if (focused) inp.focus() }
    }
    if (imp || dm) tickTimer();
  }

  let empty = grid.querySelector('.empty');
  const noCams = !lay && !list.length;
  if (noCams && !empty) { empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'Noch keine Kamera verbunden.'; grid.appendChild(empty) }
  if (!noCams && empty) empty.remove();
}

/* ===== Timer (Imposter) =====
   Der Host startet ihn beim Verteilen. Jeder Client rechnet die Restzeit selbst aus,
   dabei wird der Uhrzeit-Unterschied zwischen den Geräten ausgeglichen. */

let timerId = 0, timerEnd = 0, timerDur = IMPOSTER_TURN_SEC, timerWasRunning = false;
function syncTimer() {
  const t = state.timer;
  if (!t) { timerId = 0; timerEnd = 0; return }
  if (t.id === timerId) return;
  timerId = t.id; timerDur = t.dur || IMPOSTER_TURN_SEC;
  timerEnd = ROLE === 'host' ? t.end : t.end - ((state.sentAt || Date.now()) - Date.now());
}
function tickTimer() {
  const rem = timerEnd ? Math.max(0, timerEnd - Date.now()) : 0, running = rem > 0;
  // Timer gerade abgelaufen → einmal neu zeichnen (Eingabe sperren, Antworten beim Host zeigen)
  if (timerWasRunning && !running) { timerWasRunning = false; render(); return }
  timerWasRunning = running;
  const els = document.querySelectorAll('.vtimer, #htimer');
  if (!els.length) return;
  const im = state.imposter;
  const dmT = state.activeGame === 'dumm' && state.dumm;
  const label = dmT ? (dmT.phase === 'vote' ? 'ABSTIMMUNG · ' : dmT.phase === 'round' ? 'RUNDE ' + dmT.round + ' · ' : '')
    : im && im.phase === 'turns' ? impName(impTurnPid()).toUpperCase() + ' · ' : im && im.phase === 'vote' ? 'ABSTIMMUNG · ' : '';
  const idle = dmT ? ({ ready: 'WARTE AUF START', result: 'ERGEBNIS', final: 'FINALE', estimate: 'SCHÄTZFRAGE', over: 'ENDE' }[dmT.phase] || 'TIMER')
    : !im ? 'TIMER' : im.phase === 'dealt' ? 'WARTE AUF START' : im.phase === 'reveal' ? 'AUFLÖSUNG' : 'TIMER';
  const s = Math.ceil(rem / 1000), clock = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const txt = !timerEnd ? idle : running ? label + clock : label + 'ZEIT UM!';
  const pct = !timerEnd ? 100 : rem / (timerDur * 1000) * 100;
  els.forEach(el => {
    if (el.id === 'htimer') { const t2 = timerEnd ? (running ? 'Restzeit ' + clock : 'Zeit um!') : ''; if (el.textContent !== t2) el.textContent = t2; return }
    el.classList.toggle('done', !!timerEnd && !running);
    el.classList.toggle('idle', !timerEnd);
    el.classList.toggle('low', running && rem < 10000);
    const bar = el.querySelector('.vtbar i'), tt = el.querySelector('.vtt');
    if (bar) bar.style.width = pct + '%';
    if (tt && tt.textContent !== txt) tt.textContent = txt;
  });
}
setInterval(tickTimer, 200);
function newTimer(sec) { return { id: (state.timer && state.timer.id || 0) + 1, end: Date.now() + sec * 1000, dur: sec } }

/* ===== Aktionen ===== */
const A = {
  game(k) {
    state = { ...state, activeGame: k, questionIndex: 0, buzzerWinner: null, imposter: null, timer: null, impGame: null, scores: {}, crash: null, dumm: null };
    crashMsg = ''; dummMsg = '';
    impMsg = ''; impAnswers = {}; push(); render();   // Imposter: erst Einstellungen, dann „Spiel starten“
  },
  menu() { state = { ...state, activeGame: null, questionIndex: 0, buzzerWinner: null, imposter: null, timer: null, impGame: null, scores: {}, crash: null, dumm: null }; impMsg = ''; push(); render() },
  cfg(k, v) {
    if (k === 'category') { impCfg.category = v in imposterDatabase ? v : 'random'; ls.set('qs-impcfg', JSON.stringify(impCfg)); render(); return }
    const max = k === 'rounds' ? 20 : 10;
    impCfg[k] = Math.max(1, Math.min(max, Math.round(+v) || 1));
    ls.set('qs-impcfg', JSON.stringify(impCfg)); render();
  },
  startGame() {
    state.impCfg = { ...impCfg }; state.scores = {}; state.imposter = null; state.timer = null; state.impLastStart = null;
    state.impGame = { round: 1, rounds: impCfg.rounds, over: false };
    impAnswers = {}; impMsg = ''; push(); render(); deal();
  },
  nextRound() { const G = state.impGame; if (!G || G.round >= G.rounds) return; impPendingRound = G.round + 1; deal() },
  finish() { if (!state.impGame) return; state.impGame.over = true; state.timer = null; push(); render() },
  newGame() {
    if (state.impGame && !state.impGame.over && !confirm('Spiel abbrechen? Die Punkte gehen verloren.')) return;
    state.impGame = null; state.imposter = null; state.scores = {}; state.timer = null; state.impLastStart = null; impAnswers = {}; impMsg = ''; push(); render();
  },
  timer() { const ph = state.imposter && state.imposter.phase; state.timer = newTimer(ph === 'vote' ? IMPOSTER_VOTE_SEC : IMPOSTER_TURN_SEC); push(); render() },
  impStart() { const im = state.imposter; if (!im) return; im.phase = 'turns'; im.turn = 0; state.timer = newTimer(IMPOSTER_TURN_SEC); push(); render() },
  impNext() { const im = state.imposter; if (!im || im.phase !== 'turns' || im.turn + 1 >= impTotal()) return; im.turn++; state.timer = newTimer(IMPOSTER_TURN_SEC); push(); render() },
  impVote() { const im = state.imposter; if (!im) return; im.phase = 'vote'; im.vote = (im.vote || 0) + 1; im.reveal = null; impAnswers = {}; saveAns(); state.timer = newTimer(IMPOSTER_VOTE_SEC); push(); render() },
  impReveal() {
    const im = state.imposter; if (!im || im.phase === 'reveal') return;
    const d = impScore(); im.result = d;                         // Punkte dieser Runde
    state.scores = { ...(state.scores || {}) };
    for (const id in d) state.scores[id] = (state.scores[id] || 0) + d[id];
    im.phase = 'reveal'; im.reveal = { ...impAnswers }; state.timer = null; push(); render();
  },
  draft(v) { draft = v },
  sendWord() { sendAnswer(draft) },
  vote(id) { sendAnswer(impName(id)) },
  deal() { deal() },
  impShow() { impShow = !impShow; render() },
  hideRole() { roleHidden = !roleHidden; render() },
  vdoConnect() { vdoConnect() },
  vdoDisconnect() { vdoDisconnect() },
  cam() { stream ? stopCam() : startCam() },
  slotName(i, v) { slots[i] = v.trim().slice(0, 24) || 'Spieler ' + (i + 1); ls.set('qs-slots', JSON.stringify(slots)); push(); render() },
  resetNames() {
    if (!confirm('Alle Namen auf "Spieler 1–6" zurücksetzen?')) return;
    for (let i = 0; i < MAX_SLOTS; i++) slots[i] = 'Spieler ' + (i + 1);
    ls.set('qs-slots', JSON.stringify(slots)); push(); render();
  },
  async newRound() {
    if (!confirm('Neue Runde starten?\n\nAlle Spieler-Links und das Spieler-Passwort werden neu erzeugt. Die alten funktionieren danach nicht mehr – auch Spieler, die gerade verbunden sind, fliegen raus.')) return;
    const old = ch;
    ROUND = code(); ls.set('qs-round', ROUND); loadSecrets(true); loadRoundPw(true);
    await deriveKeys(ROUND_PW);
    online = []; state.players = []; state.imposter = null; impSolution = null; status = 'VERBINDE';
    for (const id in cams) delete cams[id];
    if (sb) {
      if (old) { old.send({ type: 'broadcast', event: 'closed', payload: {} }); setTimeout(() => sb.removeChannel(old), 500) }
      joinPlayerChannel();
    }
    push(); render();
  },
  copy(i, btn) { copyText(typeof i === 'string' ? overlayLink(i) : slotLink(i), btn) },
  open(i) { window.open(slotLink(i), '_blank') },
  openAll() { for (let i = 0; i < MAX_SLOTS; i++) window.open(slotLink(i), '_blank') },
  copyPw(btn) { copyText(ROUND_PW, btn) },
  copyOv(btn) { copyText(OVERLAY_URL, btn) },
  crashCfg(v) { crashCfg.target = Math.max(50, Math.min(100000, Math.round(+v) || CRASH_TARGET_DEFAULT)); ls.set('qs-crashcfg', JSON.stringify(crashCfg)); render() },
  crashNewGame() {
    state.crash = { phase: 'pick', target: crashCfg.target, round: 0, icons: {}, totals: {}, riders: [], cashed: {}, last: {}, names: {}, winners: [] };
    crashMsg = ''; push(); render();
  },
  crashStart() {
    const c = state.crash; if (!c || c.phase === 'run' || c.phase === 'over') return;
    const ids = (state.players || []).map(p => p.id).filter(id => /^p\d+$/.test(id));
    ids.forEach(id => {                                    // wer noch kein Icon hat, bekommt ein freies
      if (!c.icons[id]) { const free = CRASH_ICONS.find(i => !Object.values(c.icons).includes(i)); if (free) c.icons[id] = free }
    });
    const riders = ids.filter(id => c.icons[id]);
    if (!riders.length) { crashMsg = 'Keine Spieler verbunden.'; render(); return }
    crashMsg = ''; c.round++; c.riders = riders; c.cashed = {}; c.last = {}; c.crashValue = null; c.crashT = null;
    riders.forEach(id => c.names[id] = impName(id));
    crashSecret = { round: c.round, at: crashDraw() }; ls.set('qs-crash', JSON.stringify(crashSecret));   // geheim, bleibt beim Host
    c.startAt = Date.now() + CRASH_COUNTDOWN_SEC * 1000; c.phase = 'run';
    crashSync(); push(); render(); crashSchedule();
  },
  crashEnd() {
    if (state.crash && state.crash.phase !== 'over' && !confirm('Crash beenden? Die Punkte gehen verloren.')) return;
    state.crash = null; crashSecret = null; ls.set('qs-crash', 'null'); crashMsg = ''; push(); render();
  },
  pickIcon(ic) { if (me && ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'icon', payload: { id: me.id, icon: ic } }) },
  cashOut() { crashCashOut() },
  avatarFile(input) { avatarFromFile(input) },
  avOk(id) { avatarDecide(id, true) },
  avNo(id) { avatarDecide(id, false) },
  avDel(id) { if (confirm('Profilbild entfernen?')) avatarRemove(id) },
  copyHash(btn) { copyText(hostHash(), btn) },
  logout() { ss.set('qs-auth-host', ''); ss.set('qs-auth-' + ROUND, ''); location.reload() },
  async login() {
    if (gateBusy) return;
    const v = ((document.getElementById('pw') || {}).value || '').trim();
    gateErr = ''; gateBusy = true;
    try {
      if (!crypto.subtle) gateErr = 'Die Seite muss über https:// laufen.';
      else if (ROLE === 'host') {
        const hh = hostHash(), x = await sha('host:' + v);
        if (!hh) {                                   // erstes Mal: Passwort festlegen
          const v2 = ((document.getElementById('pw2') || {}).value || '').trim();
          if (v.length < 4) gateErr = 'Bitte mindestens 4 Zeichen.';
          else if (v !== v2) gateErr = 'Die beiden Passwörter stimmen nicht überein.';
          else { ls.set('qs-hostpw', x); ss.set('qs-auth-host', x); authed = true }
        } else if (x === hh) { ss.set('qs-auth-host', x); authed = true }
        else gateErr = 'Falsches Passwort.';
      } else {
        const pw = v.toUpperCase();
        if (await checkPlayerPw(pw)) { ss.set('qs-auth-' + ROUND, pw); authed = true }
        else gateErr = 'Falsches Passwort.';
      }
    } finally { gateBusy = false }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    render();
    if (authed) connect();
  },
  rename(v) {
    v = v.trim().slice(0, 24); if (!v || !me) return;
    me.name = v; ls.set('qs-name', v);
    trackMe();
    render();
  }
};

function copyText(u, btn) {
  const ok = () => { const t = btn.textContent; btn.textContent = 'Kopiert ✓'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = t; btn.classList.remove('ok') }, 1500) };
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(ok, () => prompt('Link kopieren:', u));
  else prompt('Link kopieren:', u);
}

/* Alle Kameras (eigene + empfangene), Host zuerst, dann nach Platz */

function impHostCard() {

      <div class="row">

    flow = `
      <div class="turnbox"><span class="mu">ABSTIMMUNG</span><b>${ph === 'reveal' ? 'FREIGEGEBEN' : show ? 'ZEIT UM' : 'LÄUFT …'}</b><span>${n}/${order.length} Antworten</span><span id="htimer"></span></div>
