const playerChannel = () => CHANNEL + '-' + ROUND + (CK ? '-' + CK : '');
const ss = {
  get(k) { try { return sessionStorage.getItem(k) } catch (e) { return null } },
  set(k, v) { try { sessionStorage.setItem(k, v) } catch (e) {} }
};
const sha = async s => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))), b => b.toString(16).padStart(2, '0')).join('');
async function deriveKeys(pw) {
  CK = (await sha('room:' + ROUND + ':' + pw)).slice(0, 16);
  CHK = (await sha('chk:' + ROUND + ':' + pw)).slice(0, 6);
}
/* Host: Spieler-Passwort gehört zur Runde – neue Runde = neues Passwort */
function loadRoundPw(fresh) {
  let s = null;
  try { s = JSON.parse(ls.get('qs-roundpw') || 'null') } catch (e) {}
  ROUND_PW = !fresh && s && s.round === ROUND && s.pw ? s.pw : code(6).toUpperCase();
  ls.set('qs-roundpw', JSON.stringify({ round: ROUND, pw: ROUND_PW }));
}
async function checkPlayerPw(pw) {
  const c = clean(P.get('c')).toLowerCase();
  if (!pw || !c || !crypto.subtle) return false;
  if ((await sha('chk:' + ROUND + ':' + pw)).slice(0, 6) !== c) return false;
  await deriveKeys(pw);
  return true;
}
let authed = ROLE === 'overlay', gateErr = '', gateBusy = false;
const hostHash = () => HOST_PASSWORD_HASH || ls.get('qs-hostpw') || '';
/* Overlay-Kanal ist fest, damit der Overlay-Link ohne Schlüssel funktioniert.
   Ist HOST_PASSWORD_HASH oben eingetragen, hängt der Kanal davon ab → fremde Hosts mit
   eigenem Passwort landen auf einem anderen Kanal und können dein Overlay nicht stören. */
let OVCH = CHANNEL + '-overlay';
const overlayChannel = () => OVCH;
async function initOverlayChannel() {
  if (HOST_PASSWORD_HASH && crypto.subtle) OVCH = CHANNEL + '-overlay-' + (await sha('ov:' + HOST_PASSWORD_HASH)).slice(0, 16);
}

/* Overlay-Layout per URL: ?role=overlay&k=…&cams=top | bottom | side */
const OV_LAYOUT = ['top', 'bottom', 'side'].includes(P.get('cams')) ? P.get('cams') : 'top';

/* ===== Identität ===== */
let me = null;
if (ROLE === 'player') {
  const id = cleanId(P.get('id')) || ls.get('qs-id') || ('p-' + rnd());
  ls.set('qs-id', id);
  me = {
    id,
    name: P.get('name') || ls.get('qs-name') || 'Spieler ' + id.slice(-2).toUpperCase(),
    slot: +(P.get('slot') || P.get('frame')) || 0
  };
  me.secret = clean(P.get('s'));
  me.vdoId = ls.get('qs-vdo-' + clean(P.get('r')) + '-' + me.id) || '';   // VDO.Ninja-ID, entsteht beim Klick auf „Kamera verbinden“   // geheimer Schlüssel nur für diesen Spieler (entschlüsselt seine Rolle)
}
const myId = () => ROLE === 'host' ? 'host' : me ? me.id : '';
const myName = () => ROLE === 'host' ? HOST_NAME : me ? me.name : '';

/* ===== State =====
   players: [{ id, name, slot, cameraFrame }]
   cameraFrame = aktuelles Kamerabild als Base64-JPEG ('' = Kamera aus).
   Die Bilder laufen als eigenes Event "frame" über den Channel und werden bei jedem Client
   in state.players[].cameraFrame eingetragen. Beim Verschicken des großen States werden sie
   weggelassen, damit nicht alle Bilder doppelt übertragen werden. */
const EMPTY = { activeGame: null, questionIndex: 0, buzzerWinner: null, players: [] };
let state = { ...EMPTY };
if (ROLE === 'host') {
  try { Object.assign(state, JSON.parse(ls.get('qs-state') || '{}')) } catch (e) {}
  if (!GAMES[state.activeGame]) state.activeGame = null;   // gespeichertes Spiel gibt es nicht mehr
}
let online = [];            // verbundene Spieler (Presence)
let status = 'VERBINDE';
let sb = null, ch = null, chO = null, chOok = false;
let gotState = false, expired = false, roundClosed = false;
const cams = {};            // id → { name, frame, t } aller empfangenen Kameras (auch Host)

/* ===== Spieler-Plätze (nur Host) ===== */
let slots = [];
try { slots = JSON.parse(ls.get('qs-slots') || '[]') } catch (e) {}
for (let i = 0; i < MAX_SLOTS; i++) slots[i] = slots[i] || 'Spieler ' + (i + 1);
/* Pro Runde bekommt jeder Platz einen geheimen Schlüssel, der nur in seinem Link steckt */
let secrets = [];
function loadSecrets(fresh) {
  let s = null;
  try { s = JSON.parse(ls.get('qs-secrets') || 'null') } catch (e) {}
  secrets = !fresh && s && s.round === ROUND && s.list && s.list.length === MAX_SLOTS ? s.list : Array.from({ length: MAX_SLOTS }, () => code(16));
  ls.set('qs-secrets', JSON.stringify({ round: ROUND, list: secrets }));
}
if (ROLE === 'host') loadSecrets(false);
const BASE = location.href.split('?')[0].split('#')[0];
const slotLink = i => BASE + '?role=player&r=' + ROUND + '&c=' + CHK + '&id=p' + (i + 1) + '&slot=' + (i + 1) + '&s=' + secrets[i] + '&name=' + encodeURIComponent(slots[i]);
const overlayLink = (layout) => BASE + '?role=overlay&k=' + OVKEY + (layout && layout !== 'top' ? '&cams=' + layout : '');

function linkProblem() {
  if (ROLE === 'player' && !ROUND) return 'Dieser Link ist unvollständig. Bitte den Host um deinen Link für diese Runde.';
  if (ROLE === 'player' && !clean(P.get('c'))) return 'Dieser Link ist veraltet. Bitte den Quizmaster um deinen neuen Link und das Passwort.';
  return '';
}

/* ===== Realtime ===== */
function connect() {
  if (missingKeys()) { status = 'KEINE ZUGANGSDATEN'; render(); return }
  if (linkProblem()) { status = 'UNGÜLTIGER LINK'; render(); return }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  if (ROLE === 'overlay') {
    // Overlay hört nur auf dem festen Overlay-Kanal – dort kommen ausschließlich Anzeige-Daten an
    chO = sb.channel(overlayChannel(), { config: { broadcast: { self: false } } });
    chO.on('broadcast', { event: 'state' }, onState)
       .on('broadcast', { event: 'avatars' }, ({ payload }) => receiveAvatars(payload))
       .subscribe(s => {
         if (!ch) { status = s; render() }
         if (s === 'SUBSCRIBED') chO.send({ type: 'broadcast', event: 'hello', payload: {} });
       });
    return;
  }

  joinPlayerChannel();

  if (ROLE === 'host') {
    chO = sb.channel(overlayChannel(), { config: { broadcast: { self: false } } });
    chO.on('broadcast', { event: 'hello' }, () => { push(); pushAvatars() })
       .subscribe(s => { chOok = s === 'SUBSCRIBED'; if (chOok) { push(); pushAvatars() } });
  }
}

function joinPlayerChannel() {
  const c = ch = sb.channel(playerChannel(), {
    config: { broadcast: { self: false }, presence: { key: me ? me.id : ROLE + '-' + rnd() } }
  });
  c.on('broadcast', { event: 'state' }, onState)
   .on('broadcast', { event: 'hello' }, () => { if (ROLE === 'host') { push(); pushAvatars() } })
   .on('broadcast', { event: 'avatar' }, ({ payload }) => { if (c === ch) receiveAvatar(payload) })
   .on('broadcast', { event: 'avatars' }, ({ payload }) => { if (c === ch) receiveAvatars(payload) })
   .on('broadcast', { event: 'answer' }, ({ payload }) => { if (c === ch) receiveAnswer(payload) })
   .on('broadcast', { event: 'icon' }, ({ payload }) => { if (c === ch) crashReceiveIcon(payload) })
   .on('broadcast', { event: 'cashout' }, ({ payload }) => { if (c === ch) crashReceiveCash(payload) })
   .on('broadcast', { event: 'dvote' }, ({ payload }) => { if (c === ch) dummReceiveVote(payload) })
   .on('broadcast', { event: 'dest' }, ({ payload }) => { if (c === ch) dummReceiveEst(payload) })
   .on('broadcast', { event: 'frame' }, ({ payload }) => {
     if (c !== ch || !payload) return;
     const id = cleanId(payload.id);
     if (!id || id === myId()) return;
     const f = typeof payload.frame === 'string' && payload.frame.startsWith('data:image/jpeg;base64,') ? payload.frame : '';
     setCam(id, String(payload.name || '').slice(0, 24), f);
   })
   .on('broadcast', { event: 'closed' }, () => {          // Host hat eine neue Runde gestartet
     if (ROLE !== 'player') return;
     stopCam();
     gotState = false; expired = true; roundClosed = true; status = 'RUNDE BEENDET';
     sb.removeChannel(c); render();
   })
   .on('presence', { event: 'sync' }, () => {
     if (c !== ch) return;   // alter Raum nach "Neue Runde"
     online = Object.values(c.presenceState()).map(a => a[0]).filter(x => x && x.role === 'player');
     // Wer den Raum verlassen hat, verliert sofort seine Kamera-Kachel
     for (const id in cams) if (id !== 'host' && id !== myId() && !online.some(p => p.id === id)) dropCam(id);
     if (ROLE === 'host') syncPlayers();
     render();
   })
   .subscribe(async s => {
     if (c !== ch) return;
     status = s; render();
     if (s !== 'SUBSCRIBED') return;
     if (me) await trackMe(c);
     if (ROLE === 'host') { push(); pushAvatars() }
     else {
       c.send({ type: 'broadcast', event: 'hello', payload: {} });   // State vom Host anfordern
       if (ROLE === 'player') setTimeout(() => { if (!gotState) { expired = true; render() } }, 8000);
     }
   });
}

function onState({ payload }) {
  if (ROLE === 'host' || !payload || !payload.state) return;
  state = payload.state; gotState = true; expired = false;
  fillFrames();
  const v = (state.imposter && state.imposter.vote) || 0;
  if (v !== myVote) { myVote = v; myAnswer = ''; draft = '' }
  applyHostName(); unsealMyRole(); syncTimer(); crashSync(); render();
}

/* Host ist die einzige Quelle der Wahrheit: er verteilt den State an Spieler und Overlay */
function push() {
  if (ROLE !== 'host') return;
  state.names = Object.fromEntries(slots.map((n, i) => ['p' + (i + 1), n]));
  state.avatarStatus = avatarStatus();   // nur der Status (pending/approved/rejected) – die Bilder selbst gehen getrennt raus
  state.hostVdo = hostCam ? hostCam.vdoId : '';   // Kamera-ID des Hosts für alle
  syncTimer();
  const lean = { ...state, round: ROUND, ck: CK, sentAt: Date.now(), players: state.players.map(({ cameraFrame, ...p }) => p) };
  ls.set('qs-state', JSON.stringify(lean));
  const msg = { type: 'broadcast', event: 'state', payload: { state: lean } };
  if (ch && status === 'SUBSCRIBED') ch.send(msg);
  if (chO && chOok) chO.send({ type: 'broadcast', event: 'state', payload: { state: overlayState() } });   // Overlay: nur Anzeige-Daten
}

/* Eigene Daten in Presence melden – der Host übernimmt sie ins players-Array */
function trackMe(c) {
  c = c || ch;
  if (!me || !c || status !== 'SUBSCRIBED') return;
  return c.track({ id: me.id, name: me.name, slot: me.slot, vdoId: me.vdoId || '', role: 'player' });
}

/* Spieler übernimmt den Namen, den der Host für seinen Platz eingetragen hat */
let lastHostName;
function applyHostName() {
  if (!me || !state.names) return;
  const n = state.names[me.id];
  if (!n || n === lastHostName) return;
  lastHostName = n;
  if (n === me.name) return;
  me.name = n; ls.set('qs-name', n);
  trackMe();
}

/* Host baut state.players aus Presence und vergibt freie Plätze */
function syncPlayers() {
  const prev = Object.fromEntries(state.players.map(p => [p.id, p.slot]));
  const used = new Set();
  const list = online.map(p => {
    let s = prev[p.id] || p.slot || 0;
    if (s && used.has(s)) s = 0;
    if (s) used.add(s);
    return { id: p.id, name: p.name, slot: s, vdoId: cleanVdo(p.vdoId), cameraFrame: '' };
  });
  list.forEach(p => {
    if (!p.slot) for (let i = 1; i <= MAX_SLOTS; i++) if (!used.has(i)) { p.slot = i; used.add(i); break }
  });
  state.players = list;
  fillFrames();
  push();
}

/* Verbundene Spieler (Liste unten). Das Overlay nimmt die Liste vom Host. */
function connectedPlayers() {
  const l = ROLE === 'overlay' ? state.players : online.map(p => {
    const s = state.players.find(x => x.id === p.id);
    return { id: p.id, name: p.name, slot: (s && s.slot) || p.slot || 0 };
  });
  return [...(l || [])].map(p => ({ ...p, cameraFrame: camFrame(p.id) }))
    .sort((a, b) => (a.slot || 99) - (b.slot || 99));
}

/* ===== Kamera: empfangen ===== */
function camFrame(id) { return id === myId() && stream ? 'live' : (cams[id] && cams[id].frame) || '' }
function fillFrames() { (state.players || []).forEach(p => p.cameraFrame = (cams[p.id] && cams[p.id].frame) || '') }
function setPlayerFrame(id, f) { const p = (state.players || []).find(x => x.id === id); if (p) p.cameraFrame = f }

function setCam(id, name, frame) {
  if (!frame) { if (cams[id]) { dropCam(id); render() } return }
  const isNew = !cams[id];
  cams[id] = { name: name || (cams[id] && cams[id].name) || id, frame, t: Date.now() };
  setPlayerFrame(id, frame);
  if (isNew) render();
  else document.querySelectorAll('img[data-cam="' + id + '"]').forEach(img => img.src = frame); // nur das Bild tauschen, kein Neuzeichnen
}
function dropCam(id) { delete cams[id]; setPlayerFrame(id, '') }

// Kameras ohne neues Bild (Tab geschlossen, Netz weg) nach FRAME_TIMEOUT entfernen
setInterval(() => {
  const now = Date.now(); let changed = false;
  for (const id in cams) if (now - cams[id].t > FRAME_TIMEOUT) { dropCam(id); changed = true }
  if (changed) render();
}, 1000);

/* ===== Kamera: eigene ===== */
let stream = null, camTimer = null, camErr = '';
const vid = document.createElement('video');
vid.muted = true; vid.autoplay = true; vid.playsInline = true; vid.setAttribute('playsinline', '');
const cvs = document.createElement('canvas');

async function startCam() {
  if (stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camErr = 'Kein Kamerazugriff möglich. Die Seite muss über https:// laufen (z. B. Netlify), nicht über einen normalen http-Link.';
    render(); return;
  }
  try {
    // Aufnahme-Auflösung – kleiner reicht, gesendet wird ohnehin nur FRAME_W breit
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false });
  } catch (e) {
    camErr = e && e.name === 'NotAllowedError' ? 'Kamera wurde nicht erlaubt. Klick links in der Adressleiste auf das Schloss und erlaube die Kamera.'
      : e && e.name === 'NotFoundError' ? 'Keine Kamera gefunden.'
      : 'Kamera konnte nicht gestartet werden (' + (e && e.message || e) + '). Läuft sie schon in einem anderen Programm?';
    stream = null; render(); return;
  }
  camErr = '';
  vid.srcObject = stream; vid.play && vid.play().catch(() => {});
  stream.getVideoTracks().forEach(t => t.onended = stopCam);   // Kamera abgezogen o. Ä.
  camTimer = setInterval(sendFrame, FRAME_MS);
  render();
}

function sendFrame() {
  if (!stream || !vid.videoWidth || !ch || status !== 'SUBSCRIBED') return;
  const w = FRAME_W, h = Math.round(w * vid.videoHeight / vid.videoWidth);
  cvs.width = w; cvs.height = h;
  const g = cvs.getContext('2d');
  g.translate(w, 0); g.scale(-1, 1);          // spiegeln wie im Selfie – entfernen, wenn Schrift lesbar sein soll
  g.drawImage(vid, 0, 0, w, h);
  const f = cvs.toDataURL('image/jpeg', FRAME_Q);
  if (f.length > 200000) return;              // Sicherheitsgrenze, falls FRAME_W/FRAME_Q zu hoch gesetzt sind
  setPlayerFrame(myId(), f);
  ch.send({ type: 'broadcast', event: 'frame', payload: { id: myId(), name: myName(), frame: f } });
}

function sendEmptyFrame() {
  if (ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'frame', payload: { id: myId(), name: myName(), frame: '' } });
}

function stopCam() {
  const was = !!stream;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; clearInterval(camTimer); camTimer = null; vid.srcObject = null;
  setPlayerFrame(myId(), '');
  if (was) { sendEmptyFrame(); render() }
}

// Seite verlassen: allen sagen, dass die Kamera aus ist (FRAME_TIMEOUT fängt den Rest ab)
addEventListener('pagehide', () => {
  if (stream) sendEmptyFrame();
  if (ROLE === 'host' && hostCam && hostCam.vdoId) { const v = hostCam.vdoId; hostCam.vdoId = ''; try { push() } catch (e) {} hostCam.vdoId = v }
  if (me && ch) { try { ch.untrack() } catch (e) {} }   // Spieler verlässt die Seite → raus aus dem players-Array
});

/* ===== Imposter =====
   Der Host verteilt die Rollen. Jede Rolle wird mit dem Schlüssel des jeweiligen Spielers
   verschlüsselt (AES-GCM). Im State steht nur Verschlüsseltes – Overlay und andere Spieler
   können fremde Rollen nicht lesen. Nur der Host kennt die Lösung. */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rint = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
async function keyFor(secret, round) {
  const raw = await crypto.subtle.digest('SHA-256', te.encode('streamer-games:' + round + ':' + secret));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
}
async function seal(secret, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await keyFor(secret, ROUND), te.encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function unseal(secret, box) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, await keyFor(secret, ROUND), unb64(box.ct));
  return JSON.parse(td.decode(pt));
}

let impSolution = null, impShow = false, impMsg = '', impBusy = false;   // nur Host
try { impSolution = JSON.parse(ls.get('qs-imp') || 'null') } catch (e) {}
let myRole = null, myDeal = 0, roleHidden = false;                       // nur Spieler

async function deal() {
  if (ROLE !== 'host' || impBusy) return;
  if (!crypto.subtle) { impMsg = 'Verschlüsselung nicht verfügbar – die Seite muss über https:// laufen.'; render(); return }
  const pl = connectedPlayers().filter(p => /^p[1-9]\d*$/.test(p.id) && +p.id.slice(1) <= MAX_SLOTS);
  if (pl.length < IMPOSTER_MIN_PLAYERS) {
    impMsg = `Mindestens ${IMPOSTER_MIN_PLAYERS} Spieler nötig – gerade ${pl.length} verbunden.`;
    render(); return;
  }
  impBusy = true; impMsg = '';
  const ids = pl.map(p => p.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = rint(i + 1); [ids[i], ids[j]] = [ids[j], ids[i]] }
  const imps = ids.slice(0, Math.min(IMPOSTER_COUNT, ids.length - 1));
  // Kategorie: die gewählte – oder zufällig (möglichst nicht dieselbe wie letzte Runde)
  let cat = impCfg.category in imposterDatabase ? impCfg.category : '';
  if (!cat) {
    const others = IMPOSTER_CATEGORIES.filter(c => IMPOSTER_CATEGORIES.length === 1 || !impSolution || c !== impSolution.category);
    cat = others[rint(others.length)];
  }
  // Begriff: zufällig aus der Kategorie (nicht derselbe wie letzte Runde)
  const words = [...new Set(imposterDatabase[cat])];
  const pool = words.length > 1 ? words.filter(w => !impSolution || w !== impSolution.word) : words;
  const word = pool[rint(pool.length)];
  const roles = {};
  for (const p of pl) {
    const sec = secrets[+p.id.slice(1) - 1];
    roles[p.id] = await seal(sec, imps.includes(p.id)
      ? { role: 'imposter', category: IMPOSTER_SEES_CATEGORY ? cat : '' }
      : { role: 'crew', word, category: cat });
  }
  const n = (state.imposter && state.imposter.deal || 0) + 1;
  const seat = [...pl].sort((a, b) => (a.slot || 99) - (b.slot || 99)).map(p => p.id);   // Sitzreihenfolge nach Platz
  // Startspieler wechselt jede Runde: der Nächste nach dem letzten Startspieler, in der ersten Runde zufällig
  const last = state.impLastStart;
  let start = seat.indexOf(last);
  if (start >= 0) start = (start + 1) % seat.length;
  else if (last) { const s = +String(last).slice(1), nx = seat.findIndex(id => +id.slice(1) > s); start = nx >= 0 ? nx : 0 }  // letzter Starter ist weg
  else start = rint(seat.length);
  const order = [...seat.slice(start), ...seat.slice(0, start)];
  state.impLastStart = order[0];
  const names = Object.fromEntries(pl.map(p => [p.id, p.name]));
  state.imposter = { deal: n, category: cat, count: pl.length, roles, order, names, phase: 'dealt', turn: -1, vote: 0, reveal: null };
  impSolution = { deal: n, word, category: cat, impIds: imps, imposters: pl.filter(p => imps.includes(p.id)).map(p => p.name), players: pl.map(p => p.name) };
  ls.set('qs-imp', JSON.stringify(impSolution));
  if (impPendingRound && state.impGame) { state.impGame.round = impPendingRound; impPendingRound = 0 }
  state.timer = null;          // Timer startet erst, wenn der Host „Start“ drückt
  impAnswers = {}; saveAns();
  impShow = false; impBusy = false;
  push(); render();
}

async function unsealMyRole() {
  if (!me) return;
  const im = state.activeGame === 'imposter' ? state.imposter : null;
  if (!im) { myRole = null; myDeal = 0; return }
  if (im.deal === myDeal) return;
  myDeal = im.deal; roleHidden = false;
  const box = im.roles && im.roles[me.id];
  if (!box) { myRole = { role: 'out' }; return }
  if (!me.secret || !crypto.subtle) { myRole = { role: 'error' }; return }
  myRole = { role: 'pending' };
  try { myRole = await unseal(me.secret, box) } catch (e) { myRole = { role: 'error' } }
  render();
}

/* ===== Imposter-Ablauf =====
   Phasen in state.imposter.phase:
   'dealt'  → Rollen verteilt, wartet auf „Start“ vom Host
   'turns'  → jeder Spieler ist IMPOSTER_TURN_ROUNDS-mal dran, je IMPOSTER_TURN_SEC Sekunden; Host tippt „Weiter“
   'vote'   → IMPOSTER_VOTE_SEC Sekunden: Imposter tippt das Wort, alle anderen wählen den Imposter
   'reveal' → Host hat die Antworten freigegeben, sie stehen über den Kameras */
const impOrder = () => (state.imposter && state.imposter.order) || [];
const impTurns = () => (state.impCfg && +state.impCfg.turns) || IMPOSTER_TURN_ROUNDS;
const impTotal = () => impOrder().length * impTurns();
const impName = id => (state.imposter && state.imposter.names && state.imposter.names[id]) || (state.names || {})[id]
  || ((state.players || []).find(p => p.id === id) || {}).name || id;

/* Einstellungen (nur Host, vor dem Spiel) */
let impCfg = { rounds: IMPOSTER_ROUNDS, turns: IMPOSTER_TURN_ROUNDS, category: 'random' }, impPendingRound = 0;   // category: Name oder 'random'
try { Object.assign(impCfg, JSON.parse(ls.get('qs-impcfg') || '{}')) } catch (e) {}

/* Punkte: state.scores = { p1: 4, p2: -1, … } – bleiben über alle Runden eines Spiels */
const ptsOf = id => (state.scores || {})[id] || 0;
const fmtPts = n => n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '±0';
const scoreOn = () => state.activeGame === 'imposter' && !!state.impGame;
const inGame = id => !!id && id !== 'host' && (id in (state.scores || {}) || impOrder().includes(id));
function scoreList() {
  const ids = [...new Set([...Object.keys(state.scores || {}), ...impOrder()])];
  const l = ids.map(id => ({ id, name: impName(id), pts: ptsOf(id) })).sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
  l.forEach((s, i) => s.place = i && s.pts === l[i - 1].pts ? l[i - 1].place : i + 1);
  return l;
}
/* Punkte einer Runde berechnen (Host, beim Freigeben) */
function impScore() {
  const im = state.imposter, sol = impSolution || {}, imps = sol.impIds || [], d = {};
  im.order.forEach(id => d[id] = 0);
  const byName = Object.fromEntries(Object.entries(im.names || {}).map(([id, n]) => [n, id]));
  im.order.forEach(id => {
    const a = impAnswers[id]; if (!a) return;
    if (imps.includes(id)) { if (norm(a) === norm(sol.word)) d[id] += IMPOSTER_PTS_WORD }     // Imposter errät das Wort
    else {
      const t = byName[a];
      if (imps.includes(t)) { d[id] += IMPOSTER_PTS_CATCH; d[t] += IMPOSTER_PTS_PER_VOTE }       // richtig getippt / Stimme gegen den Imposter
    }
  });
  return d;
}
function impTurnPid() {
  const im = state.imposter, o = impOrder();
  if (!im || im.phase !== 'turns' || !o.length) return '';
  return o[im.turn % o.length] || '';
}
const timerRunning = () => !!timerEnd && Date.now() < timerEnd;

/* Antworten: Spieler verschlüsseln mit ihrem eigenen Schlüssel → nur der Host kann sie lesen */
let myAnswer = '', myVote = 0, draft = '';                 // Spieler
let impAnswers = {};                                        // Host: id → Antwort
try { const a = JSON.parse(ls.get('qs-imp-ans') || 'null'); if (a && state.imposter && a.deal === state.imposter.deal && a.vote === state.imposter.vote) impAnswers = a.answers || {} } catch (e) {}
function saveAns() { if (ROLE === 'host' && state.imposter) ls.set('qs-imp-ans', JSON.stringify({ deal: state.imposter.deal, vote: state.imposter.vote, answers: impAnswers })) }

async function sendAnswer(text) {
  const im = state.imposter;
  text = String(text || '').trim().slice(0, 40);
  if (!me || !im || im.phase !== 'vote' || !timerRunning() || !text) return;
  myAnswer = text; draft = ROLE === 'player' && myRole && myRole.role === 'imposter' ? text : draft;
  render();
  try {
    const box = await seal(me.secret, { text, vote: im.vote });
    if (ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'answer', payload: { id: me.id, vote: im.vote, box } });
  } catch (e) {}
}

async function receiveAnswer(pl) {
  const im = state.imposter;
  if (ROLE !== 'host' || !pl || !im || im.phase !== 'vote' || pl.vote !== im.vote) return;
  const id = cleanId(pl.id);
  if (!im.roles || !im.roles[id]) return;
  if (timerEnd && Date.now() > timerEnd + 2000) return;        // zu spät (2 s Kulanz fürs Netz)
  try {
    const o = await unseal(secrets[+id.slice(1) - 1], pl.box);
    if (o.vote !== im.vote) return;
    impAnswers[id] = String(o.text || '').slice(0, 40);
    saveAns(); render();
  } catch (e) {}
}

/* Prüft für den Host, ob eine Antwort richtig ist */
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
function answerOk(id, text) {
  const sol = impSolution; if (!sol || !text) return false;
  const imps = sol.impIds || [];
  return imps.includes(id) ? norm(text) === norm(sol.word) : imps.some(x => impName(x) === text);
}

/* ===== VDO.Ninja-Kameras (nur Spieler-Seite) =====
   Die Kacheln liegen in einem eigenen Bereich #vdo außerhalb von #app. Sie werden nur ergänzt
   oder entfernt, nie neu gezeichnet – sonst würden die iframes bei jedem Update neu laden. */
const cleanVdo = s => /^(spieler|host)_[a-z0-9]{4}$/.test(s || '') ? s : '';
let vdoWin = null, vdoBlocked = false;

/* Der Host hat eine eigene Kamera-ID (host_xxxx). Sie bleibt über Runden hinweg gleich
   und wird im State als hostVdo an alle verteilt. */
const hostCam = ROLE === 'host' ? { id: 'host', name: HOST_NAME, slot: 0, vdoId: cleanVdo(ls.get('qs-vdo-host')) } : null;
const camSelf = () => ROLE === 'host' ? hostCam : me;
const vdoKey = () => ROLE === 'host' ? 'qs-vdo-host' : 'qs-vdo-' + ROUND + '-' + me.id;
function announceCam() { ROLE === 'host' ? push() : trackMe() }   // Host → State, Spieler → Presence

function vdoConnect() {
  const M = camSelf(); if (!M) return;
  if (!M.vdoId) {
    M.vdoId = (ROLE === 'host' ? 'host_' : 'spieler_') + Array.from(crypto.getRandomValues(new Uint8Array(4)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
    ls.set(vdoKey(), M.vdoId);
  }
  // Muss direkt im Klick passieren, sonst blockt der Browser das Fenster
  vdoWin = window.open(vdoPushUrl(M.vdoId, M.name), 'vdo-push-' + M.vdoId);
  vdoBlocked = !vdoWin;
  announceCam(); updateVdo(true);
}

function vdoDisconnect() {
  const M = camSelf(); if (!M || !M.vdoId) return;
  try { vdoWin && vdoWin.close() } catch (e) {}
  vdoWin = null; vdoBlocked = false;
  ls.set(vdoKey(), '');
  M.vdoId = '';
  announceCam(); updateVdo(true);
}

/* Alle bekannten Spieler: players-Array im State (vom Host) + Presence der verbundenen Spieler –
   damit funktionieren die Kameras auch, wenn der Host gerade nicht offen ist. */
function vdoPeople() {
  const byId = {};
  (state.players || []).forEach(p => byId[p.id] = { ...p });
  online.forEach(p => byId[p.id] = { ...(byId[p.id] || {}), ...p, slot: (byId[p.id] && byId[p.id].slot) || p.slot });
  const d = state.activeGame === 'dumm' && state.dumm;               // Seite verlassen → Karte bleibt, zeigt Profilbild
  if (d) d.order.forEach(id => { if (!byId[id]) byId[id] = { id, name: d.names[id], slot: (d.slots || {})[id] || 9, vdoId: '', offline: true } });
  return Object.values(byId);
}

/* Kamera-Liste. withPlaceholders = auch Spieler ohne Kamera als Platzhalter-Kachel (Imposter-Ansicht). */
function vdoList(withPlaceholders) {
  const M = camSelf();
  const l = [];
  vdoPeople().forEach(p => {
    const own = !!(me && p.id === me.id);
    const v = own ? cleanVdo(me.vdoId) : cleanVdo(p.vdoId);
    if (v) l.push({ key: v, vdoId: v, pid: p.id, name: own ? me.name : p.name, slot: p.slot || 9, own });
    else if (withPlaceholders || aviOf(p.id) || p.offline) l.push({ key: 'ph-' + p.id, pid: p.id, name: own ? me.name : p.name, slot: p.slot || 9, own, ph: true });   // Kamera aus: Platzhalter (mit Profilbild, falls freigegeben)
  });
  // Host-Kamera (kommt beim Spieler über den State)
  if (ROLE !== 'host') {
    const hv = cleanVdo(state.hostVdo);
    if (hv) l.push({ key: hv, vdoId: hv, pid: 'host', name: HOST_NAME, slot: 0, host: true });
    else if (withPlaceholders) l.push({ key: 'ph-host', pid: 'host', name: HOST_NAME, slot: 0, host: true, ph: true });
  }
  // Eigene Kachel, falls man selbst noch nicht in der Liste ist (z. B. Presence noch unterwegs)
  if (M && !l.some(p => p.own) && (M.vdoId || withPlaceholders && ROLE === 'player'))
    l.push(M.vdoId ? { key: M.vdoId, vdoId: M.vdoId, pid: M.id, name: M.name, slot: M.slot || 9, own: true, host: ROLE === 'host' }
                   : { key: 'ph-' + M.id, pid: M.id, name: M.name, slot: M.slot || 9, own: true, ph: true });
  return l;
}

/* Infokasten in der Imposter-Ansicht: Imposter sieht nur die Kategorie, alle anderen auch das Wort */
function impInfo() {
  const r = myRole, im = state.imposter;
  const toggle = `<button class="btn" onclick="A.hideRole()">${roleHidden ? 'Rolle zeigen' : 'Rolle verbergen'}</button>`;
  if (state.impGame && state.impGame.over) return { cls: 'good', html: `<div class="ik fin"><small>SPIEL BEENDET · ENDSTAND</small>${scoreTable(true)}</div>` };
  if (!im) return { cls: '', html: `<div class="ik"><small>IMPOSTER</small><b class="wait">Warte, bis der Quizmaster das Spiel startet …</b></div>` };
  if (!r || r.role === 'pending') return { cls: '', html: `<div class="ik"><b class="wait">Rolle wird entschlüsselt …</b></div>` };
  if (r.role === 'out') return { cls: '', html: `<div class="ik"><small>ZUSCHAUEN</small><b class="wait">Du warst beim Verteilen noch nicht da. In der nächsten Runde bist du dabei.</b></div>${impPhaseLine()}` };
  if (r.role === 'error') return { cls: 'bad', html: `<div class="ik"><small>HOPPLA</small><b class="wait">Deine Rolle konnte nicht gelesen werden. Öffne deinen Link vom Host noch einmal.</b></div>` };
  const extra = im.phase === 'vote' ? (roleHidden ? `<div class="ik ph"><small>ABSTIMMUNG</small><b class="wait">Rolle zeigen, um abzustimmen.</b></div>` : impVoteBox(r)) : impPhaseLine();
  if (roleHidden) return { cls: '', html: `<div class="ik"><small>RUNDE ${im.deal}</small><b>VERDECKT</b></div>${extra}${toggle}` };
  if (r.role === 'imposter') return { cls: 'bad', html:
    `<div class="ik"><small>DEINE ROLLE</small><b class="red">DU BIST DER IMPOSTER</b><span>Kategorie: <em>${esc(r.category || '???')}</em> – den Begriff kennst du nicht. Tu so, als ob!</span></div>${extra}${toggle}` };
  return { cls: 'good', html:
    `<div class="ik"><small>KATEGORIE</small><b>${esc(r.category)}</b></div>
     <div class="ik"><small>DEIN BEGRIFF</small><b class="word">${esc(r.word)}</b></div>${extra}${toggle}` };
}

/* Zeile im Infokasten: wer ist dran / worauf wird gewartet */
function impPhaseLine() {
  const im = state.imposter;
  if (!im || im.phase === 'dealt') return `<div class="ik ph"><small>GLEICH GEHT'S LOS</small><b class="wait">Warte auf den Start durch den Quizmaster …</b></div>`;
  if (im.phase === 'turns') {
    const pid = impTurnPid(), r = Math.floor(im.turn / impOrder().length) + 1, mine = me && pid === me.id;
    return `<div class="ik ph"><small>DURCHGANG ${r}/${impTurns()} · ZUG ${im.turn + 1}/${impTotal()}</small><b class="${mine ? 'me' : ''}">${mine ? 'DU BIST DRAN!' : 'DRAN: ' + esc(impName(pid))}</b></div>`;
  }
  if (im.phase === 'reveal') { const d = me && im.result ? im.result[me.id] : undefined;
    const s = im.solution;
    return (s ? `<div class="ik reveal"><small>AUFLÖSUNG</small><b>DER IMPOSTER WAR: <span class="red">${s.names.map(esc).join(' &amp; ')}</span></b><span>Gesuchter Begriff: <em>${esc(s.word)}</em></span></div>` : '') +
      `<div class="ik ph"><small>PUNKTE</small><b class="wait">Die Antworten stehen über den Kameras.${d !== undefined ? ' Deine Punkte: ' + fmtPts(d) + ' (gesamt ' + ptsOf(me.id) + ')' : ''}</b></div>` }
  return '';
}

/* Abstimmung: Imposter tippt das Wort, alle anderen wählen einen Namen */
function impVoteBox(r) {
  const open = timerRunning();
  if (!open) return `<div class="ik vote"><small>ABSTIMMUNG</small><b class="wait">${myAnswer ? 'Deine Antwort: „' + esc(myAnswer) + '“. ' : 'Keine Antwort abgegeben. '}Zeit um – der Quizmaster wertet aus …</b></div>`;
  const done = myAnswer ? `<span>Abgegeben: „${esc(myAnswer)}“ – du kannst bis Zeitende ändern.</span>` : '';
  if (r.role === 'imposter') return `<div class="ik vote"><small>WELCHES WORT SUCHEN DIE ANDEREN?</small>
      <div class="row"><input class="input vin" maxlength="40" placeholder="Dein Tipp" oninput="A.draft(this.value)" onkeydown="if(event.key==='Enter')A.sendWord()"><button class="btn y" onclick="A.sendWord()">Absenden</button></div>${done}</div>`;
  const others = impOrder().filter(id => !me || id !== me.id);
  return `<div class="ik vote"><small>WER IST DER IMPOSTER?</small>
      <div class="vbtns">${others.map(id => `<button class="btn ${myAnswer === impName(id) ? 'ok' : ''}" onclick="A.vote('${esc(id)}')">${esc(impName(id))}</button>`).join('')}</div>${done}</div>`;
}

let vdoHead = '', vdoInfoHtml = '';

/* Punktestand unter der Quizmaster-Kamera (Spieler-Ansicht) */
function scoreBoard() {
  const G = state.impGame, l = scoreList();
  return `<div class="vsh"><small>PUNKTE</small>${G ? `<small>RUNDE ${G.round}/${G.rounds}</small>` : ''}</div>` +
    (l.length ? l.map(s => `<div class="vsr ${me && s.id === me.id ? 'me' : ''}"><b>${esc(s.name)}</b><span>${s.pts}</span></div>`).join('')
              : '<div class="vsr"><b>Noch keine Punkte</b></div>');
}
function updateVdo(force) {
  const box = document.getElementById('vdo');
  if (!box) return;
  const show = authed && (ROLE === 'host' || (ROLE === 'player' && !linkProblem() && !roundClosed));
  // Spiel-Ansichten nur für Spieler (Layout HIER pro Spiel im CSS anpassen: .vgrid.imp bzw. .vgrid.crash)
  //   Imposter: Quizmaster + Infokasten oben, Punkte darunter, Spieler-Kameras, Timer
  //   Crash:    Zielpunktzahl oben rechts, Quizmaster + Punkte links, Diagramm rechts, Spieler-Kameras unten
  const imp = show && ROLE === 'player' && state.activeGame === 'imposter';
  const crm = show && ROLE === 'player' && state.activeGame === 'crash' && !!state.crash;
  const dm = show && ROLE === 'player' && state.activeGame === 'dumm' && !!state.dumm;   // Der Dümmste fliegt: Anordnung wie Imposter
  const lay = imp || crm || dm;
  document.body.classList.toggle('imp-mode', lay);
  box.style.display = show ? '' : 'none';
  if (!show) return;
  if (!box.querySelector('.vgrid')) box.innerHTML = '<div class="card"><h3 class="vtitle">Kameras</h3><div class="vhead"></div><div class="vgrid"></div></div>';

  const G = state.impGame;
  const title = imp ? 'IMPOSTER' + (G ? ' · RUNDE ' + G.round + '/' + G.rounds : '') : 'Kameras';
  const h3 = box.querySelector('.vtitle'); if (h3.textContent !== title) h3.textContent = title;
  h3.style.display = lay ? 'none' : '';   // im Spiel keine Überschrift → Kameras rücken nach oben

  // Kopfbereich (Buttons) – nur neu schreiben, wenn sich etwas geändert hat
  const M = camSelf();
  const head = M.vdoId
    ? `<div class="row"><button class="btn y" onclick="A.vdoConnect()">Kamera-Fenster öffnen</button><button class="btn" onclick="A.vdoDisconnect()">Kamera trennen</button></div>
       ${lay ? '' : '<p class="mu">Deine Kamera läuft im VDO.Ninja-Fenster – lass es offen. Dort einmal die Kamera erlauben und starten.</p>'}
       ${vdoBlocked ? `<div class="warn">Das Fenster wurde blockiert. <a href="${esc(vdoPushUrl(M.vdoId, M.name))}" target="_blank" rel="noopener">Hier klicken, um es zu öffnen</a> – oder Pop-ups für diese Seite erlauben.</div>` : ''}`
    : `<div class="row"><button class="btn y" onclick="A.vdoConnect()">● Kamera verbinden</button></div>
       ${lay ? '' : '<p class="mu">Öffnet ein VDO.Ninja-Fenster, in dem du deine Kamera freigibst.</p>'}`;
  if (force || head !== vdoHead) { box.querySelector('.vhead').innerHTML = head; vdoHead = head }
  // Im Spiel kein „Kamera verbinden“-Bereich (nur der Hinweis, falls das Fenster blockiert wurde)
  box.querySelector('.vhead').style.display = lay && !vdoBlocked ? 'none' : '';

  const grid = box.querySelector('.vgrid');
  grid.classList.toggle('imp', lay);     // gemeinsames Spiel-Raster
  grid.classList.toggle('crash', crm);   // Crash-Anordnung
  grid.classList.toggle('dumm', dm);
  grid.classList.toggle('dfin', dm && dummFinalOn());   // Finale: Quizmaster + Frage oben, 2 große Kameras

  // Kacheln abgleichen: neue anlegen, alte entfernen, Namen aktualisieren – iframes nie neu laden
  const list = vdoList(lay), want = new Set(list.map(p => p.pid));
  grid.querySelectorAll('.vtile').forEach(t => { if (!want.has(t.dataset.pid)) t.remove() });
  const players = list.filter(p => !p.host).length;
  grid.style.setProperty('--cols', Math.max(5, players));   // so viele Spalten wie Spieler (mind. 5)
  const im = state.imposter, turnPid = curTurnPid(), impIds = impRevealIds(), rev = imp && im && im.phase === 'reveal' ? (im.reveal || {}) : null, order = impOrder();
  const cr = crm ? state.crash : null;
  list.forEach(p => {
    let t = grid.querySelector('.vtile[data-pid="' + p.pid + '"]');        // eine Karte pro Person – bleibt beim Kamera-Wechsel bestehen
    if (!t) {
      t = document.createElement('div'); t.className = 'vtile'; t.dataset.pid = p.pid;
      const back = p.host ? esc(HOST_NAME).toUpperCase() : 'KEINE KAMERA' + (p.own && ROLE === 'player' ? '<button class="btn y sm" onclick="A.vdoConnect()">Kamera verbinden</button>' : '');
      t.innerHTML = camTileHtml('vframe', 'vname', p.vdoId, p.own, back); t._cam0 = p.vdoId || '';
      grid.appendChild(t);
    }
    t.dataset.vdo = p.key;
    syncCamCard(t, '.vframe', p.vdoId, p.own, p.pid);                          // Kamera aus → Karte umdrehen (Profilbild)
    t.classList.toggle('own', !!p.own);
    t.classList.toggle('host', !!p.host);
    // Reihenfolge nur per CSS-order, damit die iframes nicht umgehängt werden (sonst laden sie neu)
    t.style.order = lay ? (p.host ? 0 : 10 + p.slot) : (p.own ? 0 : p.host ? 1 : p.slot + 1);
    const label = (p.own ? 'DU · ' : '') + (cr && cr.icons[p.pid] ? iconHtml(p.pid, cr.icons[p.pid]) + ' ' : '') + esc(p.name);
    const nm = t.querySelector('.vname'); if (nm._lbl !== label) { nm.innerHTML = label; nm._lbl = label }
    dummDecorate(t, '.vframe', p.pid);   // 0 Leben → grau + RAUS-Stempel
    t.classList.toggle('turn', !!turnPid && p.pid === turnPid);                 // nur wer dran ist, leuchtet
    t.classList.toggle('impx', impIds.includes(p.pid));                         // Imposter-Auflösung
    const an = t.querySelector('.vans');                                         // Blase über der Kamera
    const dl = rev && im.result && p.pid in im.result ? ' · ' + fmtPts(im.result[p.pid]) : '';
    let at = rev && rev[p.pid] ? '„' + rev[p.pid] + '“' + dl : rev && order.includes(p.pid) ? '— keine Antwort —' + dl : '';
    if (cr && (cr.riders || []).includes(p.pid)) {                               // Crash: ausgestiegen / Ergebnis
      if (cr.phase === 'run' && cr.cashed[p.pid]) at = '✓ ' + cr.cashed[p.pid].pts;
      if (cr.phase === 'crashed' || cr.phase === 'over') at = (cr.last || {})[p.pid] ? '+' + cr.last[p.pid] : '💥 0';
    }
    if (an && an.textContent !== at) an.textContent = at;
  });

  // Bausteine der Spiel-Ansicht: Infokasten/Diagramm, Punkte, Timer, Zielpunktzahl
  const mk = cls => { let e = grid.querySelector('.' + cls); if (!e) { e = document.createElement('div'); e.className = cls; grid.appendChild(e) } return e };
  const info = mk('vinfo'), sc = mk('vscore'), tim = mk('vtimer'), tg = mk('vtarget');
  if (!tim.querySelector || !tim.querySelector('.vtbar')) tim.innerHTML = '<div class="vtbar"><i></i></div><span class="vtt"></span>';
  const showSc = (imp && scoreOn()) || crm;
  sc.style.display = showSc ? '' : 'none';
  if (showSc) { const sh = dm ? dummBoard() : crm ? crashScoreBoard() : scoreBoard(); if (sc.innerHTML !== sh) sc.innerHTML = sh }
  info.style.display = lay ? '' : 'none';
  tim.style.display = imp || dm ? '' : 'none';
  tg.style.display = crm ? '' : 'none';
  if (crm) { const th = crashTargetBar(); if (tg.innerHTML !== th) tg.innerHTML = th }
  if (lay) {
    const ii = imp ? impInfo() : dm ? { cls: 'dummbox', html: dummPanel() } : { cls: 'crashbox', html: crashPanel() };
    info.className = 'vinfo ' + ii.cls;
    if (ii.html !== vdoInfoHtml) {
      const focused = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('vin');
      info.innerHTML = ii.html; vdoInfoHtml = ii.html;
      const inp = info.querySelector && info.querySelector('.vin');
      if (inp) { inp.value = draft; if (focused) inp.focus() }
    }
    if (imp || dm) tickTimer();
  }

  let empty = grid.querySelector('.empty');
  const noCams = !lay && !list.length;
  if (noCams && !empty) { empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'Noch keine Kamera verbunden.'; grid.appendChild(empty) }
  if (!noCams && empty) empty.remove();
}

/* ===== Timer (Imposter) =====
   Der Host startet ihn beim Verteilen. Jeder Client rechnet die Restzeit selbst aus,
   dabei wird der Uhrzeit-Unterschied zwischen den Geräten ausgeglichen. */

let timerId = 0, timerEnd = 0, timerDur = IMPOSTER_TURN_SEC, timerWasRunning = false;
function syncTimer() {
  const t = state.timer;
  if (!t) { timerId = 0; timerEnd = 0; return }
  if (t.id === timerId) return;
  timerId = t.id; timerDur = t.dur || IMPOSTER_TURN_SEC;
  timerEnd = ROLE === 'host' ? t.end : t.end - ((state.sentAt || Date.now()) - Date.now());
}
function tickTimer() {
  const rem = timerEnd ? Math.max(0, timerEnd - Date.now()) : 0, running = rem > 0;
  // Timer gerade abgelaufen → einmal neu zeichnen (Eingabe sperren, Antworten beim Host zeigen)
  if (timerWasRunning && !running) { timerWasRunning = false; render(); return }
  timerWasRunning = running;
  const els = document.querySelectorAll('.vtimer, #htimer');
  if (!els.length) return;
  const im = state.imposter;
  const dmT = state.activeGame === 'dumm' && state.dumm;
  const label = dmT ? (dmT.phase === 'vote' ? 'ABSTIMMUNG · ' : dmT.phase === 'round' ? 'RUNDE ' + dmT.round + ' · ' : '')
    : im && im.phase === 'turns' ? impName(impTurnPid()).toUpperCase() + ' · ' : im && im.phase === 'vote' ? 'ABSTIMMUNG · ' : '';
  const idle = dmT ? ({ ready: 'WARTE AUF START', result: 'ERGEBNIS', final: 'FINALE', estimate: 'SCHÄTZFRAGE', over: 'ENDE' }[dmT.phase] || 'TIMER')
    : !im ? 'TIMER' : im.phase === 'dealt' ? 'WARTE AUF START' : im.phase === 'reveal' ? 'AUFLÖSUNG' : 'TIMER';
  const s = Math.ceil(rem / 1000), clock = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const txt = !timerEnd ? idle : running ? label + clock : label + 'ZEIT UM!';
  const pct = !timerEnd ? 100 : rem / (timerDur * 1000) * 100;
  els.forEach(el => {
    if (el.id === 'htimer') { const t2 = timerEnd ? (running ? 'Restzeit ' + clock : 'Zeit um!') : ''; if (el.textContent !== t2) el.textContent = t2; return }
    el.classList.toggle('done', !!timerEnd && !running);
    el.classList.toggle('idle', !timerEnd);
    el.classList.toggle('low', running && rem < 10000);
    const bar = el.querySelector('.vtbar i'), tt = el.querySelector('.vtt');
    if (bar) bar.style.width = pct + '%';
    if (tt && tt.textContent !== txt) tt.textContent = txt;
  });
}
setInterval(tickTimer, 200);
function newTimer(sec) { return { id: (state.timer && state.timer.id || 0) + 1, end: Date.now() + sec * 1000, dur: sec } }

/* ===== Aktionen ===== */
const A = {
  game(k) {
    state = { ...state, activeGame: k, questionIndex: 0, buzzerWinner: null, imposter: null, timer: null, impGame: null, scores: {}, crash: null, dumm: null };
    crashMsg = ''; dummMsg = '';
    impMsg = ''; impAnswers = {}; push(); render();   // Imposter: erst Einstellungen, dann „Spiel starten“
  },
  menu() { state = { ...state, activeGame: null, questionIndex: 0, buzzerWinner: null, imposter: null, timer: null, impGame: null, scores: {}, crash: null, dumm: null }; impMsg = ''; push(); render() },
  cfg(k, v) {
    if (k === 'category') { impCfg.category = v in imposterDatabase ? v : 'random'; ls.set('qs-impcfg', JSON.stringify(impCfg)); render(); return }
    const max = k === 'rounds' ? 20 : 10;
    impCfg[k] = Math.max(1, Math.min(max, Math.round(+v) || 1));
    ls.set('qs-impcfg', JSON.stringify(impCfg)); render();
  },
  startGame() {
    state.impCfg = { ...impCfg }; state.scores = {}; state.imposter = null; state.timer = null; state.impLastStart = null;
    state.impGame = { round: 1, rounds: impCfg.rounds, over: false };
    impAnswers = {}; impMsg = ''; push(); render(); deal();
  },
  nextRound() { const G = state.impGame; if (!G || G.round >= G.rounds) return; impPendingRound = G.round + 1; deal() },
  finish() { if (!state.impGame) return; state.impGame.over = true; state.timer = null; push(); render() },
  newGame() {
    if (state.impGame && !state.impGame.over && !confirm('Spiel abbrechen? Die Punkte gehen verloren.')) return;
    state.impGame = null; state.imposter = null; state.scores = {}; state.timer = null; state.impLastStart = null; impAnswers = {}; impMsg = ''; push(); render();
  },
  timer() { const ph = state.imposter && state.imposter.phase; state.timer = newTimer(ph === 'vote' ? IMPOSTER_VOTE_SEC : IMPOSTER_TURN_SEC); push(); render() },
  impStart() { const im = state.imposter; if (!im) return; im.phase = 'turns'; im.turn = 0; state.timer = newTimer(IMPOSTER_TURN_SEC); push(); render() },
  impNext() { const im = state.imposter; if (!im || im.phase !== 'turns' || im.turn + 1 >= impTotal()) return; im.turn++; state.timer = newTimer(IMPOSTER_TURN_SEC); push(); render() },
  impVote() { const im = state.imposter; if (!im) return; im.phase = 'vote'; im.vote = (im.vote || 0) + 1; im.reveal = null; impAnswers = {}; saveAns(); state.timer = newTimer(IMPOSTER_VOTE_SEC); push(); render() },
  impReveal() {
    const im = state.imposter; if (!im || im.phase === 'reveal') return;
    const d = impScore(); im.result = d;                         // Punkte dieser Runde
    state.scores = { ...(state.scores || {}) };
    for (const id in d) state.scores[id] = (state.scores[id] || 0) + d[id];
    const sol = impSolution || {};
    im.solution = { ids: sol.impIds || [], names: sol.imposters || [], word: sol.word || '', category: sol.category || im.category };   // Auflösung für alle
    im.phase = 'reveal'; im.reveal = { ...impAnswers }; state.timer = null; push(); render();
  },
  draft(v) { draft = v },
  sendWord() { sendAnswer(draft) },
  vote(id) { sendAnswer(impName(id)) },
  deal() { deal() },
  impShow() { impShow = !impShow; render() },
  hideRole() { roleHidden = !roleHidden; render() },
  vdoConnect() { vdoConnect() },
  vdoDisconnect() { vdoDisconnect() },
  cam() { stream ? stopCam() : startCam() },
  slotName(i, v) { slots[i] = v.trim().slice(0, 24) || 'Spieler ' + (i + 1); ls.set('qs-slots', JSON.stringify(slots)); push(); render() },
  resetNames() {
    if (!confirm('Alle Namen auf "Spieler 1–6" zurücksetzen?')) return;
    for (let i = 0; i < MAX_SLOTS; i++) slots[i] = 'Spieler ' + (i + 1);
    ls.set('qs-slots', JSON.stringify(slots)); push(); render();
  },
  async newRound() {
    if (!confirm('Neue Runde starten?\n\nAlle Spieler-Links und das Spieler-Passwort werden neu erzeugt. Die alten funktionieren danach nicht mehr – auch Spieler, die gerade verbunden sind, fliegen raus.')) return;
    const old = ch;
    ROUND = code(); ls.set('qs-round', ROUND); loadSecrets(true); loadRoundPw(true);
    await deriveKeys(ROUND_PW);
    online = []; state.players = []; state.imposter = null; impSolution = null; status = 'VERBINDE';
    for (const id in cams) delete cams[id];
    if (sb) {
      if (old) { old.send({ type: 'broadcast', event: 'closed', payload: {} }); setTimeout(() => sb.removeChannel(old), 500) }
      joinPlayerChannel();
    }
    push(); render();
  },
  copy(i, btn) { copyText(typeof i === 'string' ? overlayLink(i) : slotLink(i), btn) },
  open(i) { window.open(slotLink(i), '_blank') },
  openAll() { for (let i = 0; i < MAX_SLOTS; i++) window.open(slotLink(i), '_blank') },
  copyPw(btn) { copyText(ROUND_PW, btn) },
  copyOv(btn) { copyText(OVERLAY_URL, btn) },
  crashCfg(v) { crashCfg.target = Math.max(50, Math.min(100000, Math.round(+v) || CRASH_TARGET_DEFAULT)); ls.set('qs-crashcfg', JSON.stringify(crashCfg)); render() },
  crashNewGame() {
    state.crash = { phase: 'pick', target: crashCfg.target, round: 0, icons: {}, totals: {}, riders: [], cashed: {}, last: {}, names: {}, winners: [] };
    crashMsg = ''; push(); render();
  },
  crashStart() {
    const c = state.crash; if (!c || c.phase === 'run' || c.phase === 'over') return;
    const ids = (state.players || []).map(p => p.id).filter(id => /^p\d+$/.test(id));
    ids.forEach(id => {                                    // wer noch kein Icon hat, bekommt ein freies
      if (!c.icons[id]) { const free = CRASH_ICONS.find(i => !Object.values(c.icons).includes(i)); if (free) c.icons[id] = free }
    });
    const riders = ids.filter(id => c.icons[id]);
    if (!riders.length) { crashMsg = 'Keine Spieler verbunden.'; render(); return }
    crashMsg = ''; c.round++; c.riders = riders; c.cashed = {}; c.last = {}; c.crashValue = null; c.crashT = null;
    riders.forEach(id => c.names[id] = impName(id));
    crashSecret = { round: c.round, at: crashDraw() }; ls.set('qs-crash', JSON.stringify(crashSecret));   // geheim, bleibt beim Host
    c.rate = crashRandRate();   // jede Runde ein anderes Tempo
    c.startAt = Date.now() + CRASH_COUNTDOWN_SEC * 1000; c.phase = 'run';
    crashSync(); push(); render(); crashSchedule();
  },
  crashEnd() {
    if (state.crash && state.crash.phase !== 'over' && !confirm('Crash beenden? Die Punkte gehen verloren.')) return;
    state.crash = null; crashSecret = null; ls.set('qs-crash', 'null'); crashMsg = ''; push(); render();
  },
  pickIcon(ic) { if (me && ch && status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'icon', payload: { id: me.id, icon: ic } }) },
  cashOut() { crashCashOut() },
  avatarFile(input) { avatarFromFile(input) },
  avOk(id) { avatarDecide(id, true) },
  avNo(id) { avatarDecide(id, false) },
  avDel(id) { if (confirm('Profilbild entfernen?')) avatarRemove(id) },
  copyHash(btn) { copyText(hostHash(), btn) },
  logout() { ss.set('qs-auth-host', ''); ss.set('qs-auth-' + ROUND, ''); location.reload() },
  async login() {
    if (gateBusy) return;
    const v = ((document.getElementById('pw') || {}).value || '').trim();
    gateErr = ''; gateBusy = true;
    try {
      if (!crypto.subtle) gateErr = 'Die Seite muss über https:// laufen.';
      else if (ROLE === 'host') {
        const hh = hostHash(), x = await sha('host:' + v);
        if (!hh) {                                   // erstes Mal: Passwort festlegen
          const v2 = ((document.getElementById('pw2') || {}).value || '').trim();
          if (v.length < 4) gateErr = 'Bitte mindestens 4 Zeichen.';
          else if (v !== v2) gateErr = 'Die beiden Passwörter stimmen nicht überein.';
          else { ls.set('qs-hostpw', x); ss.set('qs-auth-host', x); authed = true }
        } else if (x === hh) { ss.set('qs-auth-host', x); authed = true }
        else gateErr = 'Falsches Passwort.';
      } else {
        const pw = v.toUpperCase();
        if (await checkPlayerPw(pw)) { ss.set('qs-auth-' + ROUND, pw); authed = true }
        else gateErr = 'Falsches Passwort.';
      }
    } finally { gateBusy = false }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    render();
    if (authed) connect();
  },
  rename(v) {
    v = v.trim().slice(0, 24); if (!v || !me) return;
    me.name = v; ls.set('qs-name', v);
    trackMe();
    render();
  }
};

function copyText(u, btn) {
  const ok = () => { const t = btn.textContent; btn.textContent = 'Kopiert ✓'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = t; btn.classList.remove('ok') }, 1500) };
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(ok, () => prompt('Link kopieren:', u));
  else prompt('Link kopieren:', u);
}

/* Alle Kameras (eigene + empfangene), Host zuerst, dann nach Platz */
function camList() {
  const slotOf = id => id === 'host' ? 0 : ((state.players || []).find(p => p.id === id) || {}).slot || (me && id === me.id ? me.slot : 0) || 9;
  const list = Object.entries(cams).filter(([id]) => id !== myId()).map(([id, c]) => ({ id, name: c.name, frame: c.frame }));
  if (stream && ROLE !== 'overlay') list.push({ id: myId(), name: myName(), own: true });
  return list.map(c => ({ ...c, slot: slotOf(c.id) })).sort((a, b) => a.slot - b.slot);
}

function camTile(c) {
  const color = c.id === 'host' ? HOST_COLOR : SLOT_COLORS[(c.slot || 1) - 1] || '#ffe600';
  const label = c.id === 'host' ? 'HOST' : c.slot && c.slot < 9 ? 'CAM ' + c.slot : '';
  return `<div class="ctile" style="--c:${color}">
    <div class="cbox">${c.own ? '<div id="myvid"></div>' : `<img data-cam="${esc(c.id)}" src="${esc(c.frame)}" alt="">`}</div>
    ${label ? `<i class="cbadge">${label}</i>` : ''}<b class="cname">${esc(c.name)}${c.own ? ' (du)' : ''}</b>

}

function camCard() {

function impHostCard() {
  const im = state.imposter, G = state.impGame, sol = im && impSolution && impSolution.deal === im.deal ? impSolution : null;
  // Noch kein Spiel: Einstellungen
  if (!G) return `<div class="card imp-card"><h3>Imposter · Einstellungen</h3>
    ${impMsg ? `<div class="warn">${esc(impMsg)}</div>` : ''}
    <div class="setup">
      <label class="wide"><span>Kategorie</span><small>fest oder jede Runde zufällig</small>${catSelect()}</label>

      <label><span>Durchgänge pro Runde</span><small>so oft ist jeder dran (${IMPOSTER_TURN_SEC} s)</small>

  const ph = im ? im.phase || 'dealt' : '';
  const order = impOrder(), total = impTotal(), turns = impTurns();
  let flow = '';
  if (G.over) flow = `<div class="turnbox"><span class="mu">SPIEL BEENDET</span><b>ENDSTAND</b></div>${scoreTable(true)}
      <div class="row"><button class="btn pk big" onclick="A.newGame()">Neues Spiel</button></div>`;
  else if (ph === 'dealt') flow = `
      <p class="mu">Jeder ist ${turns}× dran, je ${IMPOSTER_TURN_SEC} Sekunden. Reihenfolge: ${order.map(id => esc(impName(id))).join(' → ')}</p>
      <div class="row"><button class="btn pk big" onclick="A.impStart()">▶ Start – ${esc(impName(order[0]))} ist dran</button></div>`;
  else if (ph === 'turns') {

    flow = `
      <div class="turnbox"><span class="mu">DURCHGANG ${Math.floor(im.turn / order.length) + 1}/${turns} · ZUG ${im.turn + 1}/${total}</span><b>DRAN: ${esc(impName(pid))}</b><span id="htimer"></span></div>
      <div class="row">
        ${last ? `<button class="btn pk big" onclick="A.impVote()">Abstimmung starten (${IMPOSTER_VOTE_SEC} s)</button>`

        <button class="btn" onclick="A.timer()">Timer neu starten</button>
      </div>`;
  }

    flow = `
      <div class="turnbox"><span class="mu">ABSTIMMUNG</span><b>${ph === 'reveal' ? 'FREIGEGEBEN' : show ? 'ZEIT UM' : 'LÄUFT …'}</b><span>${n}/${order.length} Antworten</span><span id="htimer"></span></div>
      ${show ? `<div class="answers">${order.map(id => {
          const a = (ph === 'reveal' ? im.reveal || {} : impAnswers)[id], isImp = sol && (sol.impIds || []).includes(id);
          return `<div class="arow ${a ? (answerOk(id, a) ? 'right' : 'wrong') : ''}"><b>${esc(impName(id))}</b><i>${isImp ? 'IMPOSTER · TIPPT WORT' : 'TIPPT IMPOSTER'}</i><span>${a ? esc(a) : '— keine Antwort —'}</span><em>${ph === 'reveal' ? fmtPts(res[id] || 0) : a ? (answerOk(id, a) ? '✓' : '✗') : ''}</em></div>`;
        }).join('')}</div>` : `<p class="mu">Die Antworten siehst du, sobald die ${IMPOSTER_VOTE_SEC} Sekunden um sind.</p>`}
      <div class="row">

function impPlayerStage() {
  const r = myRole, im = state.imposter;
  if (!im) return `<div class="stage"><div><b>Imposter</b>Warte, bis der Host die Rollen verteilt …</div></div>`;
  if (!r || r.role === 'pending') return `<div class="stage"><div>Rolle wird entschlüsselt …</div></div>`;
  if (r.role === 'out') return `<div class="stage"><div><b>Zuschauen</b>Du warst beim Verteilen noch nicht da. In der nächsten Runde bist du dabei.</div></div>`;
  if (r.role === 'error') return `<div class="stage"><div><b>Hoppla</b>Deine Rolle konnte nicht gelesen werden. Öffne deinen Link vom Host noch einmal.</div></div>`;
  const toggle = `<button class="btn" onclick="A.hideRole()">${roleHidden ? 'Rolle zeigen' : 'Rolle verbergen'}</button>`;
  if (roleHidden) return `<div class="role hidden"><small>RUNDE ${im.deal}</small><b>VERDECKT</b>${toggle}</div>`;
  return r.role === 'imposter'
    ? `<div class="role imp"><small>DEINE ROLLE · RUNDE ${im.deal}</small><b>IMPOSTER</b>
        <p>Du kennst das Wort nicht.${r.category ? ` Kategorie: <em>${esc(r.category)}</em>.` : ''} Tu so, als ob – und lass dich nicht erwischen!</p>${toggle}</div>`
    : `<div class="role crew"><small>DEINE ROLLE · RUNDE ${im.deal}</small><b>SPIELER</b>
        <small>DEIN WORT</small><div class="word">${esc(r.word)}</div>
        <p>Kategorie: <em>${esc(r.category)}</em>. Einer von euch kennt das Wort nicht – findet ihn!</p>${toggle}</div>`;
}

/* ===================================================================================
   OBS-OVERLAY (?role=overlay) – feste 1920×1080-Bühne, nur Anzeige
   Aufbau:  #ostage
             ├─ .o-hostcam    Quizmaster-Kamera (links oben)        ← bleibt immer stehen
             ├─ .o-side       Punktestand unter dem Quizmaster       ← je nach Spiel
             ├─ .o-game       Spiel-Bereich (rechts oben)            ← wird pro Spiel gezeichnet
             └─ .o-row        Spieler-Kameras (unten)                ← bleibt immer stehen
   Kameras werden nie neu gezeichnet (iframes würden sonst neu laden), nur ergänzt/entfernt.
   =================================================================================== */
const OVERLAY_URL = 'https://anduuuuin.github.io/Streamer-Games-by-Anduuuuin/?role=overlay';   // fester Link für OBS
const OVERLAY_CAM_AUDIO = false;     // true = Ton der Kameras im Overlay (Achtung: doppelt, wenn ihr z. B. über Discord redet)
const OVERLAY_BACKGROUND = true;     // false = durchsichtiger Hintergrund (eigener Hintergrund in OBS)

/* ----- Ein Anzeige-Bereich pro Spiel – HIER das Aussehen pro Spiel anpassen -----
   Jede Funktion liefert das HTML für den Spiel-Bereich (.o-game, 1400×690 px).
   side() liefert optional das HTML für den Kasten unter der Quizmaster-Kamera. */
const OVERLAY_GAMES = {
  // Kein Spiel aktiv
  none: {
    game: () => `<div class="o-wait"><div class="o-logo"><b>STREAMER</b><b>GAMES</b></div><div class="o-waittxt">Warte auf Spielstart<i>.</i><i>.</i><i>.</i></div></div>`,
    side: () => ''
  },

  // ---------- IMPOSTER ----------
  imposter: {
    game: () => {
      const im = state.imposter, G = state.impGame;
      const head = `<div class="o-head"><b>IMPOSTER</b>${G ? `<span>RUNDE ${G.round}/${G.rounds}</span>` : ''}</div>`;
      if (G && G.over) return head + `<div class="o-panel o-final"><small>ENDSTAND</small>${scoreTable(true)}</div>`;
      if (!im) return head + `<div class="o-panel o-center"><div class="o-big">Gleich geht’s los …</div><small>Der Quizmaster verteilt die Rollen</small></div>`;
      // Nie den Begriff oder den Imposter zeigen – die Spieler könnten den Stream schauen!
      const cat = `<div class="o-cat"><small>KATEGORIE</small><b>${esc(im.category)}</b></div>`;
      let main = '';
      if (im.phase === 'dealt') main = `<div class="o-big">Rollen verteilt</div><small>Einer von euch kennt den Begriff nicht …</small>`;
      if (im.phase === 'turns') {
        const r = Math.floor(im.turn / impOrder().length) + 1;
        main = `<small>DURCHGANG ${r}/${impTurns()} · ZUG ${im.turn + 1}/${impTotal()}</small><div class="o-big o-turn">DRAN: ${esc(impName(impTurnPid()))}</div>`;
      }
      if (im.phase === 'vote') main = `<div class="o-big o-vote">ABSTIMMUNG</div><small>Wer ist der Imposter? Der Imposter tippt den Begriff.</small>`;
      if (im.phase === 'reveal') main = im.solution ? `<small>AUFLÖSUNG · DER IMPOSTER WAR</small><div class="o-big o-impname">${im.solution.names.map(esc).join(' &amp; ')}</div><small>Gesuchter Begriff: <em class="o-word">${esc(im.solution.word)}</em></small>` : `<div class="o-big">AUFLÖSUNG</div><small>Die Antworten stehen über den Kameras</small>`;
      const timer = im.phase === 'turns' || im.phase === 'vote' || im.phase === 'dealt'
        ? `<div class="vtimer o-timer"><div class="vtbar"><i></i></div><span class="vtt"></span></div>` : '';
      return head + `<div class="o-grid">${cat}<div class="o-panel o-center">${main}</div></div>${timer}`;
    },
    side: () => state.impGame && !state.impGame.over ? `<div class="o-scores">${scoreBoard()}</div>` : ''
  },

};

/* Bühne einmal aufbauen und auf das Fenster skalieren (in OBS 1920×1080 = 1:1) */
function overlayStage() {
  let st = document.getElementById('ostage');
  if (st) return st;
  const app = document.getElementById('app');
  app.innerHTML = `<div id="ostage" class="${OVERLAY_BACKGROUND ? 'bg' : ''}">
    <div class="o-hostcam"></div><div class="o-side"></div><div class="o-game"></div><div class="o-row"></div></div>`;
  st = document.getElementById('ostage');
  if (!st) return null;
  const fit = () => { st.style.transform = 'scale(' + Math.min(innerWidth / 1920, innerHeight / 1080) + ')' };
  addEventListener('resize', fit); fit();
  return st;
}

let ovGameHtml = '', ovSideHtml = '';
function renderOverlay() {
  const st = overlayStage();
  if (!st) return;
  const def = OVERLAY_GAMES[state.activeGame] || (state.activeGame ? {
    game: () => `<div class="o-head"><b>${esc(gameName(state.activeGame))}</b></div>`, side: () => '' } : OVERLAY_GAMES.none);
  st.dataset.game = state.activeGame || 'none';           // für CSS pro Spiel: #ostage[data-game="imposter"] …
  st.dataset.sub = def.sub ? def.sub() : '';              // Unter-Layout, z. B. #ostage[data-sub="final"]
  const g = def.game(), s = def.side();
  if (g !== ovGameHtml) { st.querySelector('.o-game').innerHTML = g; ovGameHtml = g }
  if (s !== ovSideHtml) { st.querySelector('.o-side').innerHTML = s; ovSideHtml = s }
  updateOverlayCams(st);
  syncWinner(st);                                        // Gewinner + Konfetti im Overlay
  tickTimer();
}

/* Kameras im Overlay – sichtbar in jedem Spiel */
function updateOverlayCams(st) {
  const im = state.imposter, inImp = state.activeGame === 'imposter';
  const turnPid = curTurnPid(), impIds = impRevealIds();
  const rev = inImp && im && im.phase === 'reveal' ? (im.reveal || {}) : null;
  const want = [];
  const hv = cleanVdo(state.hostVdo);
  want.push({ box: '.o-hostcam', key: hv || 'ph-host', vdoId: hv, pid: 'host', name: HOST_NAME, slot: 0 });
  const pl = (state.players || []).slice();
  const d = state.activeGame === 'dumm' && state.dumm;                 // Spieler, die die Seite verlassen haben, bleiben als Karte
  if (d) d.order.forEach(id => { if (!pl.some(p => p.id === id)) pl.push({ id, name: d.names[id], slot: (d.slots || {})[id] || 9, vdoId: '' }) });
  pl.sort((a, b) => (a.slot || 99) - (b.slot || 99)).forEach(p => {
    const v = cleanVdo(p.vdoId);
    want.push({ box: '.o-row', key: v || 'ph-' + p.id, vdoId: v, pid: p.id, name: p.name, slot: p.slot || 9 });
  });
  const pids = new Set(want.map(w => w.pid));
  st.querySelectorAll('.otile').forEach(t => { if (!pids.has(t.dataset.pid)) t.remove() });
  want.forEach(w => {
    const box = st.querySelector(w.box);
    let t = box.querySelector('.otile[data-pid="' + w.pid + '"]');
    if (!t) {
      t = document.createElement('div'); t.className = 'otile'; t.dataset.pid = w.pid;
      t.innerHTML = camTileHtml('oframe', 'oname', w.vdoId, !OVERLAY_CAM_AUDIO, w.pid === 'host' ? esc(HOST_NAME).toUpperCase() : 'KEINE KAMERA'); t._cam0 = w.vdoId || '';
      box.appendChild(t);
    }
    t.dataset.key = w.key;
    syncCamCard(t, '.oframe', w.vdoId, !OVERLAY_CAM_AUDIO, w.pid);       // Kamera aus / Seite verlassen → Karte umdrehen
    t.style.order = w.slot;
    t.classList.toggle('host', w.pid === 'host');
    t.classList.toggle('turn', !!turnPid && w.pid === turnPid);          // nur wer dran ist, leuchtet
    t.classList.toggle('impx', impIds.includes(w.pid));                  // Imposter-Auflösung
    const cr = state.activeGame === 'crash' && state.crash;
    const label = (cr && cr.icons[w.pid] ? iconHtml(w.pid, cr.icons[w.pid]) + ' ' : '') + esc(w.name);
    const nm = t.querySelector('.oname'); if (nm._lbl !== label) { nm.innerHTML = label; nm._lbl = label }
    dummDecorate(t, '.oframe', w.pid);   // 0 Leben → grau + RAUS-Stempel
    const an = t.querySelector('.vans');
    const dl = rev && im.result && w.pid in im.result ? ' · ' + fmtPts(im.result[w.pid]) : '';
    let at = rev && rev[w.pid] ? '„' + rev[w.pid] + '“' + dl : rev && impOrder().includes(w.pid) ? '— keine Antwort —' + dl : '';
    if (cr && (cr.riders || []).includes(w.pid)) {                   // Crash: Ausstieg / Ergebnis über der Kamera
      if (cr.phase === 'run' && cr.cashed[w.pid]) at = '✓ ' + cr.cashed[w.pid].pts;
      if (cr.phase === 'crashed' || cr.phase === 'over') at = (cr.last || {})[w.pid] ? '+' + cr.last[w.pid] : '💥 0';
    }
    if (an.textContent !== at) an.textContent = at;
  });
  st.querySelector('.o-row').style.setProperty('--n', Math.max(1, want.length - 1));
}

/* Was der Host an das Overlay schickt: nur Anzeige-Daten, nichts Geheimes
   (kein Begriff, keine Rollen, kein Passwort, kein Raum-Schlüssel) */
function overlayState() {
  const im = state.imposter;
  return {
    activeGame: state.activeGame || null,
    players: (state.players || []).map(p => ({ id: p.id, name: p.name, slot: p.slot, vdoId: p.vdoId || '' })),
    hostVdo: state.hostVdo || '', names: state.names || {}, scores: state.scores || {},
    impGame: state.impGame || null, impCfg: state.impCfg || null, timer: state.timer || null, sentAt: Date.now(),
    crash: state.crash || null,   // enthält nie den Crash-Punkt
    dumm: state.dumm || null,     // enthält nie Antworten oder wer wen gewählt hat
    imposter: im ? { deal: im.deal, category: im.category, count: im.count, order: im.order, names: im.names, phase: im.phase,
      turn: im.turn, vote: im.vote, reveal: im.phase === 'reveal' ? im.reveal : null, result: im.phase === 'reveal' ? im.result : null,
      solution: im.phase === 'reveal' ? im.solution || null : null } : null
  };
}

/* ===================================================================================
   KAMERA-KARTEN · Vorderseite = Kamera (VDO.Ninja), Rückseite = Profilbild
   Kamera aus oder Spieler hat die Seite verlassen → Karte dreht sich um.
   Dauer/Art der Drehung im CSS unter „Kamera-Karte umdrehen“.
   =================================================================================== */
const camIframe = (id, mute) => `<iframe src="${esc(vdoViewUrl(id, mute))}" allow="autoplay; fullscreen; picture-in-picture" title="Kamera"></iframe>`;
function camTileHtml(frameCls, nameCls, vdoId, mute, backText) {
  return `<div class="vans"></div><div class="${frameCls}"><div class="flip"><div class="face front">${vdoId ? camIframe(vdoId, mute) : ''}</div>` +
    `<div class="face back"><span>${backText}</span></div></div></div><div class="${nameCls}"></div>`;
}
function syncCamCard(t, frameSel, vdoId, mute, pid) {
  const fr = t.querySelector(frameSel); if (!fr) return;
  const front = fr.querySelector('.front'), back = fr.querySelector('.back');
  if (front && front._cam === undefined) front._cam = t._cam0 || '';   // welche Kamera beim Anlegen schon drin war
  if (vdoId && front && front._cam !== vdoId) {                    // neue/andere Kamera → iframe einsetzen (gleiche Kamera lädt nie neu)
    front.innerHTML = camIframe(vdoId, mute);
    front._cam = vdoId;
  }
  fr.classList.toggle('flipped', !vdoId);                          // keine Kamera → Rückseite mit Profilbild
  aviBackground(back, pid);
}
/* Wer ist gerade dran? Nur dessen Rahmen leuchtet (Imposter: Zug · Der Dümmste fliegt: Frage) */
function curTurnPid() {
  if (state.activeGame === 'imposter') return impTurnPid();
  const d = state.activeGame === 'dumm' && state.dumm;
  if (d && (d.phase === 'round' || d.phase === 'final')) return d.turn || '';
  return '';
}
/* Imposter-Auflösung: wer war Imposter? (erst nach der Freigabe im State) */
const impRevealIds = () => { const im = state.activeGame === 'imposter' && state.imposter; return im && im.phase === 'reveal' && im.solution ? im.solution.ids || [] : [] };

/* ===================================================================================
   GEWINNER-SHOW + KONFETTI – HIER ANPASSEN
   =================================================================================== */
const CONFETTI = {
  cannon: 220,          // Teilchen, die zu Beginn aus den unteren Ecken geschossen werden
  rain: 5,              // neue Teilchen pro Bild, die danach von oben regnen
  durationMs: 9000,     // wie lange es nachregnet
  gravity: 0.16,        // Fallgeschwindigkeit
  size: [9, 18],        // Größe der Schnipsel (min, max) in Pixel
  colors: ['#ff2bd6', '#00f0ff', '#ffe600', '#39ff14', '#ff2d55', '#ffffff']
};
function confetti(cv) {
  const x = cv && cv.getContext && cv.getContext('2d'); if (!x) return;
  const fit = () => { cv.width = cv.clientWidth || 1920; cv.height = cv.clientHeight || 1080 };
  fit();
  const R = (a, b) => a + Math.random() * (b - a), col = () => CONFETTI.colors[Math.random() * CONFETTI.colors.length | 0];
  const mk = (px, py, vx, vy) => ({ x: px, y: py, vx, vy, r: R(0, 6.3), vr: R(-.25, .25), s: R(CONFETTI.size[0], CONFETTI.size[1]), c: col(), round: Math.random() < .25, tilt: R(0, 6.3) });
  const P = [], W = () => cv.width, H = () => cv.height, t0 = Date.now();
  for (let i = 0; i < CONFETTI.cannon; i++) {                     // zwei Konfetti-Kanonen unten links und rechts
    const left = i % 2 === 0;
    P.push(mk(left ? R(0, W() * .08) : R(W() * .92, W()), H() + 10, (left ? 1 : -1) * R(4, 13) * W() / 1920, -R(14, 26) * H() / 1080));
  }
  const raf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : f => setTimeout(f, 16);
  (function step() {
    if (cv.isConnected === false) return;                          // Anzeige geschlossen → aufhören
    const el = Date.now() - t0;
    if (el < CONFETTI.durationMs) for (let i = 0; i < CONFETTI.rain; i++) P.push(mk(R(0, W()), -20, R(-1.5, 1.5), R(1, 4)));
    x.clearRect(0, 0, W(), H());
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.vy += CONFETTI.gravity; p.vx *= .99; p.vy = Math.min(p.vy, 7); p.x += p.vx + Math.sin(p.tilt += .05) * .6; p.y += p.vy; p.r += p.vr;
      if (p.y > H() + 40) { P.splice(i, 1); continue }
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if (p.round) { x.beginPath(); x.arc(0, 0, p.s / 2.4, 0, 6.3); x.fill() }
      else x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2 * Math.abs(Math.cos(p.tilt)) + 2);
      x.restore();
    }
    if (P.length || el < CONFETTI.durationMs) raf(step);
  })();
}
/* Gewinner groß einblenden (einmal pro Sieg). parent = #ostage (Overlay) oder body (Spieler-Ansicht) */
function showWinner(parent, key, pid, name, title) {
  if (!parent || parent._winKey === key) return;
  hideWinner(parent); parent._winKey = key;
  const el = document.createElement('div'); el.className = 'winfx';
  const pic = aviOf(pid) ? `<img src="${aviOf(pid)}" alt="">` : '<span>🏆</span>';
  el.innerHTML = `<canvas class="confetti"></canvas><div class="wincard"><small>${esc(title)}</small><div class="winpic">${pic}</div>` +
    `<b>${esc(name)}</b><em>GEWINNT!</em></div>${ROLE === 'player' ? '<button class="btn winclose" onclick="this.parentNode.remove()">Schließen</button>' : ''}`;
  parent.appendChild(el);
  confetti(el.querySelector('.confetti'));
}
function hideWinner(parent) { if (!parent) return; const el = parent.querySelector('.winfx'); if (el) el.remove(); parent._winKey = '' }
function syncWinner(parent) {
  const d = state.activeGame === 'dumm' && state.dumm;
  if (d && d.phase === 'over' && d.winner) showWinner(parent, 'dumm:' + d.winner + ':' + d.qNo, d.winner, dummName(d.winner), 'DER DÜMMSTE FLIEGT');
  else if (parent && parent._winKey) hideWinner(parent);
}

/* ===================================================================================
   PROFILBILDER
   Ablauf:  Spieler lädt Bild hoch → wird quadratisch verkleinert → verschlüsselt an den Host
            → Host speichert es mit Status „pending“ → Host gibt frei („approved“) oder lehnt ab („rejected“).
   Nur freigegebene Bilder verlassen den Host (Event „avatars“) – Spieler und Overlay sehen nie ungeprüfte Bilder.
   =================================================================================== */
/* ----- Profilbilder – HIER ANPASSEN ----- */
const AVATAR_SIZE = 160;          // Kantenlänge der gespeicherten Bilder in Pixel
const AVATAR_QUALITY = 0.8;       // JPEG-Qualität 0…1
const AVATAR_MAX_CHARS = 120000;  // Sicherheitsgrenze pro Bild (Base64-Zeichen, ≈ 90 KB)

let avatarStore = {};             // nur Host: pid → { approved, pending, status: 'pending'|'approved'|'rejected', v }
let avatars = {};                 // alle: pid → freigegebenes Bild (data:image/jpeg;base64,…)
let myAvatarPreview = '', avatarMsg = '';
const isAvi = s => typeof s === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(s) && s.length < AVATAR_MAX_CHARS;
function approvedList() { const o = {}; for (const k in avatarStore) if (avatarStore[k] && isAvi(avatarStore[k].approved)) o[k] = avatarStore[k].approved; return o }
if (ROLE === 'host') { try { avatarStore = JSON.parse(ls.get('qs-avatars') || '{}') || {} } catch (e) {} avatars = approvedList() }
function saveAvatars() { ls.set('qs-avatars', JSON.stringify(avatarStore)) }
const avatarStatus = () => Object.fromEntries(Object.entries(avatarStore).map(([k, v]) => [k, v.status]));

/* --- FREIGABE-LOGIK (Host) --- */
// Host schickt die freigegebenen Bilder an Spieler + Overlay (bei Änderung und wenn jemand neu dazukommt)
function pushAvatars() {
  if (ROLE !== 'host') return;
  avatars = approvedList();
  const msg = { type: 'broadcast', event: 'avatars', payload: { list: avatars } };
  if (ch && status === 'SUBSCRIBED') ch.send(msg);
  if (chO && chOok) chO.send(msg);
}
// Host empfängt ein neues Bild → Status „pending“ (das alte freigegebene Bild bleibt bis zur Entscheidung aktiv)
async function receiveAvatar(pl) {
  if (ROLE !== 'host' || !pl) return;
  const id = cleanId(pl.id);
  if (!/^p\d+$/.test(id) || +id.slice(1) > MAX_SLOTS) return;
  try {
    const o = await unseal(secrets[+id.slice(1) - 1], pl.box);   // nur der echte Spieler kann für seinen Platz hochladen
    if (!isAvi(o.img)) return;
    const a = avatarStore[id] || {};
    avatarStore[id] = { approved: a.approved || null, pending: o.img, status: 'pending', v: (a.v || 0) + 1 };
    saveAvatars(); push(); render();
  } catch (e) {}
}
function avatarDecide(id, ok) {
  const a = avatarStore[id]; if (!a) return;
  if (ok && a.pending) { a.approved = a.pending; a.status = 'approved' }
  if (!ok) a.status = a.pending ? 'rejected' : a.status;
  a.pending = null;
  saveAvatars(); push(); pushAvatars(); render();
}
function avatarRemove(id) { delete avatarStore[id]; saveAvatars(); push(); pushAvatars(); render() }

/* Alle anderen: freigegebene Bilder übernehmen */
function receiveAvatars(pl) {
  if (ROLE === 'host' || !pl || !pl.list) return;
  const o = {};
  for (const k in pl.list) { const id = cleanId(k); if (isAvi(pl.list[k])) o[id] = pl.list[k] }
  avatars = o; render();
}

/* --- Spieler: Bild auswählen, zuschneiden, hochladen --- */
async function avatarFromFile(input) {
  const f = input && input.files && input.files[0];
  if (!f) return;
  avatarMsg = '';
  if (!/^image\//.test(f.type)) { avatarMsg = 'Bitte ein Bild auswählen.'; render(); return }
  try {
    const url = URL.createObjectURL(f);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url });
    const s = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas');
    cv.width = cv.height = AVATAR_SIZE;                                       // quadratisch, Mitte ausschneiden
    cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, AVATAR_SIZE, AVATAR_SIZE);
    URL.revokeObjectURL(url);
    const data = cv.toDataURL('image/jpeg', AVATAR_QUALITY);
    if (!isAvi(data)) { avatarMsg = 'Das Bild ist zu groß.'; render(); return }
    await sendAvatar(data);
    myAvatarPreview = data; avatarMsg = 'Hochgeladen – wartet auf Freigabe durch den Quizmaster.';
  } catch (e) { avatarMsg = 'Bild konnte nicht hochgeladen werden. Bist du verbunden?' }
  try { input.value = '' } catch (e) {}
  render();
}
async function sendAvatar(data) {
  if (!me || !ch || status !== 'SUBSCRIBED') throw new Error('offline');
  const box = await seal(me.secret, { img: data });
  ch.send({ type: 'broadcast', event: 'avatar', payload: { id: me.id, box } });
}

/* --- BILDANZEIGE --- */
const aviOf = id => avatars[id] || '';
// HTML-Icon: Profilbild (freigegeben) oder Emoji als Ersatz
const iconHtml = (id, fallback) => aviOf(id) ? `<img class="avi" src="${aviOf(id)}" alt="">` : esc(fallback || '');
// Für das Crash-Diagramm (Canvas): Bild-Objekte zwischenspeichern
const aviImgs = {};
function aviImg(id) {
  const a = aviOf(id);
  if (!a || typeof Image === 'undefined') return null;
  let im = aviImgs[id];
  if (!im || im._src !== a) { im = new Image(); im._src = a; im.src = a; aviImgs[id] = im }
  return im.complete && im.naturalWidth ? im : null;
}
// Kamera aus → Profilbild in die leere Kachel
function aviBackground(frame, id) {
  if (!frame || !frame.style) return;
  const a = aviOf(id), key = a ? a.length + ':' + a.slice(-24) : '';
  if ((frame.dataset.avi || '') === key) return;
  frame.dataset.avi = key;
  frame.style.backgroundImage = a ? 'url(' + a + ')' : '';
  frame.classList.toggle('avi-bg', !!a);
}

/* Spieler-Karte „Profilbild“ */
function avatarCard(compact) {
  if (!me) return '';
  const st = (state.avatarStatus || {})[me.id], cur = aviOf(me.id);
  const label = { pending: '⏳ Wartet auf Freigabe', approved: '✓ Freigegeben', rejected: '✗ Abgelehnt – lade ein anderes hoch' }[st] || 'Noch kein Profilbild';
  const pic = st === 'pending' && myAvatarPreview ? myAvatarPreview : cur;
